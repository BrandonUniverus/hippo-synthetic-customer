acquiSuiteSample:
  profileId: gw_acquisuite_student_electric
  localDate: '2024-01-15'
  utcOffsetHours: -8
  timestampConvention: interval_start
  rowOffset: 0
  # Each row contains timestamp, interval kWh, average kW. No header row.
  segments:
    - {startInterval: 0, count: 24, demandKW: 40}
    - {startInterval: 24, count: 12, demandKW: 80}
    - {startInterval: 36, count: 32, demandKW: 120}
    - {startInterval: 68, count: 16, demandKW: 100}
    - {startInterval: 84, count: 12, demandKW: 60}
  missingIntervals: {start: 48, count: 8}
  expected:
    complete: {intervalsPerPoint: 96, readings: 192, energyKWh: 2020, peakKW: 120}
    gap: {intervalsPerPoint: 88, readings: 176, energyKWh: 1780, peakKW: 120}
    backfill: {intervalsPerPoint: 8, readings: 16, energyKWh: 240, peakKW: 120}

