  - Replace every illustrative database ID in the older gateway blueprint with IDs captured from the UI.
  - Author source-format samples for the remaining gateway cases; a mapping is not ingestion proof.
  - Exercise DST, accumulator resets, invalid units and malformed files after the normal AcquiSuite case.
  - Model and validate the full rate library with complete schedules and independent bill calculations.
  - Add live BACnet and Modbus emulators, weather fixtures and the external ODBC historian.
  - Add the planned chiller digital status and activity-index input paths before claiming those measurements work.
  - Supply the fixed-network submeter file and the Cedar Row submeter route upload before claiming apartment-level data.
  - Decide the input path for the manual deduct-meter readings.
  - Supply the Ridgeline SCADA and met-mast sample files, and prove the standard-time clock, before claiming wind data.
  - Reproduce the hand-made July 2024 Ridgeline transfer statement with EEM's bill generation before relying on generated statements.
