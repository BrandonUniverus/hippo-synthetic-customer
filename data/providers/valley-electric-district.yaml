# Valley Electric District — EVERYDAY electric distribution utility.
# Single commodity (electric) but the most data-rich everyday provider:
# every account produces a monthly tariff bill, and the five interval-metered
# buildings (four on campus plus the Central Plant) also produce 15-minute kWh and kW channels.
# Since 2024-07 it also bills the Ridgeline Wind generator interconnection in both
# directions, and moves that account's export credit to the Central Plant's bill (VED-BCT).
id: valley_electric_district
displayName: Valley Electric District
shortName: VED
identityClass: everyday
providerKind: distribution_utility
ownership: public_municipal_district
billingModel: tariff_metered
currency: USD
billingCadence: monthly
description: >
  Municipal electric distribution district serving the Northlake campus, the
  Central Plant and Cedar Row Apartments, where it bills one master meter per
  building and never an individual apartment. Demand is billed on the highest 15-minute
  average kW in the period, and power factor is tracked so reactive-power
  adjustments can appear on lab-heavy buildings. Its generator interconnection
  service meters the Ridgeline Wind substation both ways at 34.5 kV: station
  service in, export out, and reactive energy for the power-factor charge.

website: https://www.valleyelectric.example
icon: fa-bolt          # the Font Awesome mark the provider picker shows

billing:
  remitAddress:              # where bills are paid; entered on the Utility Provider editor and chosen per billing account
    line1: PO Box 41027
    city: Sacramento
    state: CA
    postalCode: "95841"
  businessAddress:           # the account representative's office
    line1: 2400 Feather River Road
    city: Sacramento
    state: CA
    postalCode: "95833"

  billCycles:                # the provider owns the calendar; a meter stores only the cycle number
    periods: calendar months across the scenario date range
    cycles:
      - { number: 1, description: "Campus and plant accounts, read in the first week" }
  companyAccounts:           # CompanyProvider: what each company is to this provider
    northlake_university: { vendorNumber: VED-10042, alias: VED }
    cedar_row_apartments: { vendorNumber: VED-10043, alias: VED }
    northlake_thermal_plant: { vendorNumber: VED-10044, alias: VED }

supplies:
  - commodity: electric
    role: consumption
    usageUnit: kWh
    demandUnit: kW
    dataTypes: [monthly_bill, interval_15min, billing_demand]
    intervalMinutes: 15
    notes: Demand billed on max 15-minute kW; power factor below 0.95 triggers an adjustment.
  - commodity: electric
    role: generator_interconnection
    usageUnit: kWh
    reactiveUnit: kVArh
    statementUnit: MWh       # the generator bill states export in MWh
    dataTypes: [monthly_bill, interval_15min]
    intervalMinutes: 15
    direction: bidirectional
    servedBuildings: [ridgeline_substation]
    notes: Delivered is station service while the turbines are idle; received is the farm's export. The export credit transfers to the Central Plant account under VED-BCT.

accountModel:
  numberFormat: "SYN-VED-A-#######"
  example: "SYN-VED-A-0010014"
  grouping: one_account_per_metered_building
  meta: [service_address, rate_schedule_id, voltage_level, service_territory_synthetic]

meterModel:
  providerNumberFormat: "VED-BADGE-#######"   # the provider's own badge number; the digits repeat our meter number
  numberFormat: "SYN-VED-M-#######"
  example: "SYN-VED-M-0040207"
  meterTypes: [interval_demand, monthly_kwh, unmetered_area_lighting, bidirectional_interval]
  intervalBuildings: [science_center, student_center, lakeview_hall, recreation_center, central_plant, ridgeline_substation]
  monthlyOnlyBuildings: [admin_hall, library, parking_structure, cedar_row_a, cedar_row_b, cedar_row_common_house]
  unmeteredServices: [campus_grounds, cedar_row_carport_grounds]

channels:
  - id: electric_kwh
    commodity: electric
    unit: kWh
    direction: delivered
    intervalMinutes: 15
    appliesTo: intervalBuildings
  - id: electric_kw
    commodity: electric
    unit: kW
    direction: delivered
    intervalMinutes: 15
    appliesTo: intervalBuildings

rateSchedules:
  - id: VED-TOU-GS
    name: Time-of-Use General Service
    type: time_of_use_demand
    effective: "2024-01-01..2024-12-31"
    seasons:
      summer: { months: [6, 7, 8, 9], periods: [peak, part_peak, off_peak] }
      winter: { months: [1, 2, 3, 4, 5, 10, 11, 12], periods: [part_peak, off_peak] }
    components:
      energy:
        peak: { unit: $/kWh, rate: 0.241 }
        part_peak: { unit: $/kWh, rate: 0.168 }
        off_peak: { unit: $/kWh, rate: 0.112 }
      demand: { unit: $/kW, rate: 18.40, basis: max_15min_kw }
      facilityCharge: { unit: $/month, rate: 64.00 }
  - id: VED-TOU-GS-FY25
    name: Time-of-Use General Service (FY2025 rate change)
    type: time_of_use_demand
    effective: "2025-01-01..2025-12-31"
    rateChangeScenario: provider_rate_change
    components:
      energy:
        peak: { unit: $/kWh, rate: 0.258 }
        part_peak: { unit: $/kWh, rate: 0.179 }
        off_peak: { unit: $/kWh, rate: 0.118 }
      demand: { unit: $/kW, rate: 19.75, basis: max_15min_kw }
      facilityCharge: { unit: $/month, rate: 67.50 }

  - id: VED-TOU-PRI
    name: Time-of-Use Primary Service
    type: time_of_use_demand
    effective: "2024-01-01..2025-12-31"
    appliesTo: [central_plant]
    seasons:
      summer: { months: [6, 7, 8, 9], periods: [peak, part_peak, off_peak] }
      winter: { months: [1, 2, 3, 4, 5, 10, 11, 12], periods: [part_peak, off_peak] }
    components:
      energy:
        peak: { unit: $/kWh, rate: 0.214 }
        part_peak: { unit: $/kWh, rate: 0.149 }
        off_peak: { unit: $/kWh, rate: 0.098 }
      demand: { unit: $/kW, rate: 21.90, basis: max_15min_kw }
      facilityCharge: { unit: $/month, rate: 410.00 }
  - id: VED-AL-1
    name: Unmetered Area Lighting
    type: flat_per_fixture
    effective: "2024-01-01..2025-12-31"
    appliesTo: [campus_grounds, cedar_row_carport_grounds]
    components:
      fixtureCharge: { unit: $/fixture/month, rate: 14.60, basis: fixture_count }
  - id: VED-GEN-IC
    name: Generator Interconnection Service
    type: generator_interconnection
    effective: "2024-07-01..2025-12-31"
    appliesTo: [ridgeline_substation]
    components:
      customerCharge: { unit: $/month, rate: 285.00 }
      stationServiceEnergy: { unit: $/kWh, rate: 0.131, basis: delivered_kwh }
      reactivePower: { unit: $/kVArh, rate: 0.0042, basis: kvarh_beyond_power_factor_0_95 }
      generationCredit: { unit: $/kWh, rate: -0.0612, basis: received_kwh }
  - id: VED-BCT
    name: Renewable Generation Bill Credit Transfer
    type: bill_credit_transfer_rider
    effective: "2024-07-01..2025-12-31"
    appliesTo: [ridgeline_substation, central_plant]
    generatingAccount: SYN-VED-A-0010014
    benefitingAccount: SYN-VED-A-0010013
    components:
      creditTransfer: { unit: $, rate: 1.0, basis: the_generating_accounts_generation_credit_moved_whole_to_the_benefiting_account }
      administrativeFee: { unit: $/month, rate: 12.50, basis: per_benefiting_account }

billCharges:
  - { code: energy_peak, type: usage_tou, unit: $/kWh }
  - { code: energy_part_peak, type: usage_tou, unit: $/kWh }
  - { code: energy_off_peak, type: usage_tou, unit: $/kWh }
  - { code: demand_charge, type: demand, unit: $/kW }
  - { code: facility_charge, type: fixed, unit: $/month }
  - { code: power_factor_adjustment, type: adjustment, unit: $ }
  - { code: public_purpose_program, type: rider, unit: $ }
  - { code: utility_users_tax, type: tax, unit: $ }
  - { code: generator_customer_charge, type: fixed, unit: $/month }
  - { code: station_service_energy, type: usage, unit: $/kWh }
  - { code: reactive_power_charge, type: usage, unit: $/kVArh }
  - { code: generation_credit, type: generation_credit, unit: $/kWh }
  - { code: bct_credit_transferred, type: transfer_out, unit: $ }
  - { code: bct_credit_received, type: credit, unit: $ }
  - { code: bct_administrative_fee, type: fixed, unit: $/month }

fileFormats:
  billing:
    name: VED monthly billing extract
    format: csv
    grain: one_row_per_account_per_billing_period
    artifactType: bif
    keyColumns: [synthetic_account_number, billing_start, billing_end, total_kwh, billing_demand_kw, total_cost, bill_status]
  interval:
    name: VED 15-minute interval extract
    format: csv
    grain: one_row_per_channel_per_interval
    artifactType: mdef
    keyColumns: [synthetic_meter_number, channel_id, reading_start, reading_end, kwh, kw, quality_code]

environmental:
  scope: 2
  # The grid factor for Scope 2 and for the avoided emissions of Ridgeline's generation. CO2e adds CH4 and N2O at the
  # GWPs EEM ships (28 and 265). Synthetic 2024 and 2025 values continuing the eGRID CAMX trend; EEM's eGRID source
  # carries CAMX through 2023 and Stage 8 adds these rows.
  emissionFactorSource: eGRID CAMX subregion (synthetic 2024 and 2025 values)
  co2eFactor:
    unit: kgCO2e/kWh
    history:
      - { effectiveFrom: 2024-01-01, value: 0.1866, lbPerMWh: { co2: 410.0, ch4: 0.024, n2o: 0.0029 } }
      - { effectiveFrom: 2025-01-01, value: 0.1798, lbPerMWh: { co2: 395.0, ch4: 0.023, n2o: 0.0028 } }

scenarioHooks:
  - { scenario: baseline_monthly_bills, role: primary }
  - { scenario: electric_interval_15min, role: primary, targets: [science_center, student_center, lakeview_hall, recreation_center, central_plant] }
  - { scenario: meter_replacement, role: primary, targets: [library] }
  - { scenario: missing_interval_backfill, role: primary, targets: [student_center] }
  - { scenario: provider_rate_change, role: primary, note: "FY2025 TOU rate step" }
  - { scenario: generator_bill_credit_transfer, role: primary, targets: [ridgeline_substation, central_plant], note: "Export credit leaves the generator account and lands on the Central Plant bill" }
  - { scenario: account_transferred_at_acquisition, role: primary, targets: [ridgeline_substation], note: "The seller's generator account closed 2024-06-30; the plant's opened 2024-07-01 under a new number" }

dataQuirks:
  - Summer cooling load raises Science Center peak demand and shifts energy into peak hours.
  - Power factor below 0.95 on lab loads adds a reactive-power adjustment line.
  - One meter swap keeps the same account but issues a new synthetic meter number.
  - The generator account keeps none of its export credit, so it always pays a small bill (customer charge, station service, reactive power, tax); in a still winter month station service makes that bill larger.
  - The same export credit appears on two bills, as a transfer out on the generator account and as a credit received on the Central Plant account. Count it once.
  - The generator bill states export in MWh; the interval data is kWh.
