manifestVersion: 2
id: northlake_eem_stage1_setup_v1
customerScenarioId: demo_university_v1
stage: 1
displayName: Northlake EEM Stage 1 DBAdmin Setup
purpose: >
  App-facing setup manifest for building the blank Northlake EEM system through
  DBAdmin before bills, archive data, gateways, workflows, or scheduled tasks
  are configured. The physical estate (sites, buildings, meters) is owned by the
  scenario manifest; this file adds only the EEM company shells, level names and
  security groups. See implementation/northlake-inventory-standard.pdf.

sourceReferences:
  customerInventoryWorkbook: documents/intake-package/data-collection-workbook.xlsx
  sourceScenarioManifest: data/scenarios/demo-university-v1.yaml
  securityManifest: data/security/northlake-eem-security-v1.yaml
  inventoryStandard: implementation/northlake-inventory-standard.pdf

setupPrinciples:
  - Drive this through the EEM applications, not direct seed inserts.
  - Record generated EEM ids after each save; do not preassign positive CompanyIDs.
  - Use the built-in system company for implementation and support access.
  - Every company uses the same four levels (Site, Building, Meter, Point); Site and Building nodes are created from the scenario sites the company owns.
  - Do not create billing accounts, GL accounts, bill validation, weather stations, bills, interval archives, gateways, workflows, or task schedules in this stage.

systemCompany:
  companyId: -1
  displayName: System
  createInDbAdmin: false
  purpose: Built-in full-system context for DB/admin/setup access.
  useFor:
    - Bootstrap and setup users.
    - EEM implementation/support users.
    - Full-system groups that should not belong to a Northlake customer company.
  groupsFromSecurityManifest:
    - id: eem_system_db_admins
      displayName: EEM System DB Admins
    - id: eem_implementation_admins
      displayName: EEM Implementation Admins
    - id: eem_gateway_stage2_preppers
      displayName: EEM Gateway Stage 2 Preppers
    - id: eem_support_readonly
      displayName: EEM Support Read Only
  usersFromSecurityManifest:
    - avery.singh
    - morgan.patel
    - taylor.bennett

deferredDbAdminSections:
  - section: Definitions / Weather Stations
    reason: Stage 1 company shell only; weather mappings are needed later when hierarchy and weather-related points exist.
  - section: Utility Accountant / Billing Accounts
    reason: Stage 1 company setup can define utility providers later, but billing accounts are Stage 2/3 setup data.
  - section: GL Accounts
    reason: GL coding is not needed until bill entry/import behavior is exercised.
  - section: Bill Validation
    reason: Validation rules are only meaningful once bill scenarios and accounts exist.
  - section: Bill Scenarios
    reason: Company_Save creates the default Actual scenario; no custom scenarios are needed yet.

companyDefaults:
  definitions:
    archiveIntervalMinutes: 60
    timeZone:
      eemTimeZoneId: 33
      uiLabel: "(GMT-08:00) Pacific Time (US & Canada); Tijuana"
      ianaName: America/Los_Angeles
    country:
      uiLabel: UNITED STATES
      databaseValue: USA
    analogAlarmSeverityDefaults:
      highAlarm:
        colorHex: "#FF0000"
        text: High-Alarm
      highWarning:
        colorHex: "#FF8000"
        text: High-Warning
      normal:
        colorHex: "#008040"
        text: Ret-Norm
      lowWarning:
        colorHex: "#0098E1"
        text: Low-Warning
      lowAlarm:
        colorHex: "#0000FF"
        text: Low-Alarm
    digitalStateColors:
      state0:
        colorHex: "#000000"
      state1:
        colorHex: "#008000"
      state2:
        colorHex: "#FF0000"
      state3:
        colorHex: "#FC8040"
  # The same level list is used by every company. Physical meters sit under
  # their Building and points under their meter; aggregate points and weather
  # station meters may sit directly under a Site (EEM allows any node under a
  # broader node).
  levels:
    - levelNumber: 1
      description: Site
      type: Site
      internalLevelNbr: 1
      fontAwesome: fa-location-dot
      userDefinedField: Site Code
      purpose: A campus, property, plant or reference-station grouping.
    - levelNumber: 2
      description: Building
      type: Location
      internalLevelNbr: 2
      fontAwesome: fa-building
      userDefinedField: Building Code
      purpose: One physical building or outdoor service area; appears once in the whole system.
    - levelNumber: 3
      description: Meter
      type: Meter
      internalLevelNbr: 4
      fontAwesome: fa-diagram-project
      userDefinedField: Meter Tag
      purpose: One utility meter, owned submeter, production meter, sensor group or logical source.
    - levelNumber: 4
      description: Point
      type: Point
      internalLevelNbr: 5
      fontAwesome: fa-circle
      userDefinedField: Source Channel
      purpose: One measured, read, derived or aggregated channel.

