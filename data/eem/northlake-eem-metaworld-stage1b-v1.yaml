sourceGapsToResolveBeforeStage2:
  - Confirm PointTypes rows and measure type/unit ids in the restored EEMSuite seed database.
  - Capture the register and automatically related usage point ids from UI setup for every Neptune and MVRS route point; symbolic register references are in the source gateway bindings.
  - Create and verify source-format fixtures for gateways beyond the supplied AcquiSuite onboarding sample, including the fixed-network submeter file and the Cedar Row submeter route.
  - Provide an input path for the chiller digital status and the later Student Center activity index.
  - Decide how the manual deduct-meter readings enter EEM (bill entry, HMR or a route file) before they are claimed as data.
  - Add expected aggregate totals and baseline values once generated interval data exists.
  - Decide whether a cross-company loop-loss aggregate (plant production minus university deliveries) is supported before adding it.

validationChecklist:
  - Every scenario account maps to a billing account, cost center, or PPA agreement shell of the kind its provider's billing model implies.
  - Every bill image artifact maps to at least one scenario meter.
  - Every scenario channel that is not a bill fact maps to one EEM point; every bill fact maps to none.
  - All Stage 2 gateway point bindings, including expanded per-unit templates, resolve to Stage 1B point definitions.
  - Aggregates only include members with matching unit and interval.
  - Baseline point definitions have the same unit and interval as their measured point.
  - Weather temperature points create HDD/CDD related points before weather station mapping is validated.
  - No building appears in more than one company or more than once in a company.
  - Cedar Row and Central Plant nodes are not duplicated in the Northlake University company.


