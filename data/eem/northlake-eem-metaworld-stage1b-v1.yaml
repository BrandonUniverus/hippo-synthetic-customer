        - {sourceChannelId: ch_weather_ksmf_forecast_wind_kph_hourly, name: KSMF Forecast Wind Speed, pointType: Analog, measureType: Wind Speed, unit: kph, intervalMinutes: 60, stage2GatewayProfiles: [gw_noaa_ksac_observations]}
        - {sourceChannelId: ch_weather_ksmf_forecast_wind_direction_hourly, name: KSMF Forecast Wind Direction, pointType: Analog, measureType: Wind Direction, unit: deg, intervalMinutes: 60, stage2GatewayProfiles: [gw_noaa_ksac_observations]}
        - {sourceChannelId: ch_weather_ksmf_forecast_precip_probability_hourly, name: KSMF Forecast Precipitation Probability, pointType: Analog, measureType: Precipitation Probability, unit: pct, intervalMinutes: 60, stage2GatewayProfiles: [gw_noaa_ksac_observations]}
        - {sourceChannelId: ch_weather_ksmf_wind_kph_hourly, name: KSMF Wind Speed, pointType: Analog, measureType: Wind Speed, unit: kph, intervalMinutes: 60, stage2GatewayProfiles: [gw_noaa_ksac_observations]}
    # The Ridgeline site's reference: the met mast measures the wind the turbines see, KSUU the
    # long record it is checked and extended against. Wind in knots, the only knots in the estate.
    - id: weather_ksuu
      name: KSUU Travis Air Force Base
      stationId: KSUU
      measureType: Weather
      latitude: 38.26270
      longitude: -121.92750
      points:
        - {sourceChannelId: ch_weather_ksuu_temp_c_hourly, name: KSUU Outside Air Temperature, pointType: Analog, measureType: Temperature, unit: degC, intervalMinutes: 60, indexType: DegreeDays, createsRelatedPoints: [HDD_C_daily, CDD_C_daily], stage2GatewayProfiles: [gw_noaa_ksac_observations]}
        - {sourceChannelId: ch_weather_ksuu_rh_hourly, name: KSUU Relative Humidity, pointType: Analog, measureType: Relative Humidity, unit: pct, intervalMinutes: 60, stage2GatewayProfiles: [gw_noaa_ksac_observations]}
        - {sourceChannelId: ch_weather_ksuu_forecast_temp_c_hourly, name: KSUU Forecast Temperature, pointType: Analog, measureType: Temperature, unit: degC, intervalMinutes: 60, stage2GatewayProfiles: [gw_noaa_ksac_observations]}
        - {sourceChannelId: ch_weather_ksuu_forecast_dewpoint_c_hourly, name: KSUU Forecast Dew Point, pointType: Analog, measureType: Dew Point, unit: degC, intervalMinutes: 60, stage2GatewayProfiles: [gw_noaa_ksac_observations]}
        - {sourceChannelId: ch_weather_ksuu_forecast_rh_hourly, name: KSUU Forecast Relative Humidity, pointType: Analog, measureType: Relative Humidity, unit: pct, intervalMinutes: 60, stage2GatewayProfiles: [gw_noaa_ksac_observations]}
        - {sourceChannelId: ch_weather_ksuu_forecast_wind_knots_hourly, name: KSUU Forecast Wind Speed, pointType: Analog, measureType: Wind Speed, unit: knots, intervalMinutes: 60, stage2GatewayProfiles: [gw_noaa_ksac_observations]}
        - {sourceChannelId: ch_weather_ksuu_forecast_wind_direction_hourly, name: KSUU Forecast Wind Direction, pointType: Analog, measureType: Wind Direction, unit: deg, intervalMinutes: 60, stage2GatewayProfiles: [gw_noaa_ksac_observations]}
        - {sourceChannelId: ch_weather_ksuu_forecast_precip_probability_hourly, name: KSUU Forecast Precipitation Probability, pointType: Analog, measureType: Precipitation Probability, unit: pct, intervalMinutes: 60, stage2GatewayProfiles: [gw_noaa_ksac_observations]}
        - {sourceChannelId: ch_weather_ksuu_wind_knots_hourly, name: KSUU Wind Speed, pointType: Analog, measureType: Wind Speed, unit: knots, intervalMinutes: 60, stage2GatewayProfiles: [gw_noaa_ksac_observations]}
        - {sourceChannelId: ch_weather_ksuu_dewpoint_c_hourly, name: KSUU Dew Point, pointType: Analog, measureType: Dew Point, unit: degC, intervalMinutes: 60, stage2GatewayProfiles: [gw_noaa_ksac_observations]}
  # Every building in every company is assigned the default station unless listed.
  # Cedar Row's property manager benchmarks its portfolio on KSMF, which also puts
  # both stations (and both degree-day unit systems) to work. The Ridgeline site, fifty
  # miles from Sacramento, takes KSUU.
  stationAssignments:
    defaultStationId: KSAC
    exceptions:
      - {companyId: cedar_row_apartments, buildingId: cedar_row_a, stationId: KSMF}
      - {companyId: cedar_row_apartments, buildingId: cedar_row_b, stationId: KSMF}
      - {companyId: cedar_row_apartments, buildingId: cedar_row_common_house, stationId: KSMF}
      - {companyId: cedar_row_apartments, buildingId: cedar_row_carport_grounds, stationId: KSMF}
      - {companyId: northlake_thermal_plant, buildingId: ridgeline_turbine_field, stationId: KSUU}
      - {companyId: northlake_thermal_plant, buildingId: ridgeline_substation, stationId: KSUU}

# Aggregates are points placed directly under the node they summarise.
aggregateTargets:
  - id: agg_nlu_campus_electric_kwh_15m
    companyId: northlake_university
    parentPath: System / Northlake University / Northlake Main Campus
    aggregatePointName: Campus Interval Electric kWh Total
    pointType: Analog
    unit: kWh
    intervalMinutes: 15
    formula: sum
    boundary: Interval-metered campus buildings only; bill-only buildings are not in this total.
    members:
      - {sourceChannelId: ch_ved_science_center_kwh_15m, multiplier: 1, required: true}
      - {sourceChannelId: ch_ved_student_center_kwh_15m, multiplier: 1, required: true}
      - {sourceChannelId: ch_ved_lakeview_hall_kwh_15m, multiplier: 1, required: true}
      - {sourceChannelId: ch_ved_recreation_center_kwh_15m, multiplier: 1, required: true}
  - id: agg_nlu_campus_electric_kw_15m
    companyId: northlake_university
    parentPath: System / Northlake University / Northlake Main Campus
    aggregatePointName: Campus Coincident Electric kW
    pointType: Analog
    unit: kW
    intervalMinutes: 15
    formula: sum
    boundary: Interval-metered campus buildings only; bill-only buildings are not in this total.
    members:
      - {sourceChannelId: ch_ved_science_center_kw_15m, multiplier: 1, required: true}
      - {sourceChannelId: ch_ved_student_center_kw_15m, multiplier: 1, required: true}
      - {sourceChannelId: ch_ved_lakeview_hall_kw_15m, multiplier: 1, required: true}
      - {sourceChannelId: ch_ved_recreation_center_kw_15m, multiplier: 1, required: true}
  - id: agg_nlu_campus_solar_generation_kwh_15m
    companyId: northlake_university
    parentPath: System / Northlake University / Northlake Main Campus
    aggregatePointName: Campus PV Generated kWh
    pointType: Analog
    unit: kWh
    intervalMinutes: 15
    formula: sum
    boundary: Campus arrays only; the Cedar Row carport belongs to Cedar Row.
    members:
      - {sourceChannelId: ch_hos_science_center_gen_kwh_15m, multiplier: 1, required: true}
      - {sourceChannelId: ch_hos_student_center_gen_kwh_15m, multiplier: 1, required: true}
  - id: agg_nlu_campus_chw_ton_hours_hourly
    companyId: northlake_university
    parentPath: System / Northlake University / Northlake Main Campus
    aggregatePointName: Campus Chilled Water Delivered Ton-Hours
    pointType: Analog
    unit: ton_hours
    intervalMinutes: 60
    formula: sum
    boundary: Served-building BTU meters; compare with the plant's production meter for loop loss.
    members:
      - {sourceChannelId: ch_ntp_science_center_chw_ton_hours_hourly, multiplier: 1, required: true}
      - {sourceChannelId: ch_ntp_recreation_center_chw_ton_hours_hourly, multiplier: 1, required: true}
  - id: agg_nlu_science_net_electric_kwh_15m
    companyId: northlake_university
    parentPath: System / Northlake University / Northlake Main Campus / Science Center
    aggregatePointName: Science Center Net Electric kWh
    pointType: Analog
    unit: kWh
    intervalMinutes: 15
    formula: weighted_sum
    boundary: Delivered minus generated; an analysis series, not a supplier bill total.
    members:
      - {sourceChannelId: ch_ved_science_center_kwh_15m, multiplier: 1, required: true}
      - {sourceChannelId: ch_hos_science_center_gen_kwh_15m, multiplier: -1, required: false}
  - id: agg_cra_a_submeter_electric_kwh_60m
    companyId: cedar_row_apartments
    parentPath: System / Cedar Row Apartments / Cedar Row Apartments / Cedar Row A
    aggregatePointName: Cedar Row A Submetered kWh Total
    pointType: Analog
    unit: kWh
    intervalMinutes: 60
    formula: sum
    boundary: All apartment and house submeters; compare with the master meter bill for unaccounted load.
    memberTemplate: {perUnitOf: cedar_row_a, channelTemplate: "ch_cedar_row_a_unit_{unit}_kwh_60m", multiplier: 1, required: false}
    members:
      - {sourceChannelId: ch_cedar_row_a_house_kwh_60m, multiplier: 1, required: true}
  - id: agg_cra_b_submeter_electric_kwh_60m
    companyId: cedar_row_apartments
    parentPath: System / Cedar Row Apartments / Cedar Row Apartments / Cedar Row B
    aggregatePointName: Cedar Row B Submetered kWh Total
    pointType: Analog
    unit: kWh
    intervalMinutes: 60
    formula: sum
    boundary: All apartment and house submeters; compare with the master meter bill for unaccounted load.
    memberTemplate: {perUnitOf: cedar_row_b, channelTemplate: "ch_cedar_row_b_unit_{unit}_kwh_60m", multiplier: 1, required: false}
    members:
      - {sourceChannelId: ch_cedar_row_b_house_kwh_60m, multiplier: 1, required: true}
  # Ridgeline: the farm totals the research and the expected-versus-actual goal start from.
  # A turbine down for repair keeps reporting (zero energy, full possible power), so every
  # member is required; a turbine whose rows stop arriving is a data problem, not an outage.
  - id: agg_ntp_ridgeline_generated_kwh_10m
    companyId: northlake_thermal_plant
    # Placed under the logical billing meter, not the site: Bill Generation prices the points under one meter, and
    # this aggregate is the quantity the monthly transfer statement prices (Stage 7 step 8, product finding 66).
    parentPath: System / Northlake Thermal Plant / Ridgeline Wind Site / Ridgeline Turbine Field / Ridgeline Farm Transfer Meter
    aggregatePointName: Ridgeline Farm Generated kWh 10m
    pointType: Analog
    unit: kWh
    intervalMinutes: 10
    formula: sum
    boundary: The ten turbine pad meters; collection losses lie between this and the substation export. The transfer statement prices it.
    members:
      - {sourceChannelId: ch_rwl_wtg01_kwh_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg02_kwh_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg03_kwh_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg04_kwh_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg05_kwh_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg06_kwh_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg07_kwh_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg08_kwh_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg09_kwh_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg10_kwh_10m, multiplier: 1, required: true}
  - id: agg_ntp_ridgeline_active_kw_10m
    companyId: northlake_thermal_plant
    parentPath: System / Northlake Thermal Plant / Ridgeline Wind Site
    aggregatePointName: Ridgeline Farm Active Power kW 10m
    pointType: Analog
    unit: kW
    intervalMinutes: 10
    formula: sum
    boundary: The ten turbines' active power.
    members:
      - {sourceChannelId: ch_rwl_wtg01_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg02_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg03_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg04_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg05_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg06_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg07_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg08_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg09_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg10_kw_10m, multiplier: 1, required: true}
  - id: agg_ntp_ridgeline_possible_kw_10m
    companyId: northlake_thermal_plant
    parentPath: System / Northlake Thermal Plant / Ridgeline Wind Site
    aggregatePointName: Ridgeline Farm Possible Power kW 10m
    pointType: Analog
    unit: kW
    intervalMinutes: 10
    formula: sum
    boundary: What the ten turbines could have made at the measured wind; the expected side of the goal.
    members:
      - {sourceChannelId: ch_rwl_wtg01_possible_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg02_possible_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg03_possible_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg04_possible_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg05_possible_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg06_possible_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg07_possible_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg08_possible_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg09_possible_kw_10m, multiplier: 1, required: true}
      - {sourceChannelId: ch_rwl_wtg10_possible_kw_10m, multiplier: 1, required: true}
  - id: agg_ntp_ridgeline_net_export_kwh_15m
    companyId: northlake_thermal_plant
    parentPath: System / Northlake Thermal Plant / Ridgeline Wind Site / Ridgeline Substation
    aggregatePointName: Ridgeline Net Export kWh 15m
    pointType: Analog
    unit: kWh
    intervalMinutes: 15
    formula: weighted_sum
    boundary: Export minus station service at the point of interconnection; the bill credits export and charges station service separately.
    members:
      - {sourceChannelId: ch_ved_ridgeline_received_kwh_15m, multiplier: 1, required: true}
      - {sourceChannelId: ch_ved_ridgeline_delivered_kwh_15m, multiplier: -1, required: true}

