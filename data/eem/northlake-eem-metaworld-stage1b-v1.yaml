# The provider's billing model decides which EEM shell an account becomes.
billingAccountKinds:
  tariff_metered: externalUtilityAccounts
  bundled_municipal: externalUtilityAccounts
  internal_allocation: internalCostCenters
  ppa_generation: ppaAgreements
  internal_generation_transfer: generationTransfers   # EEM generates the statement from the turbine meters

# Everything else the Billing Account editor asks for. Each rule resolves per account;
# the AP upload flag, GL defaults and validation overrides belong to Phase 3
# (data/eem/northlake-ap-gl-v1.yaml), and the bills' entry method to Phase 1
# (data/eem/northlake-bill-entry-v1.yaml).
# The Meter editor beyond the account: the provider's own meter number, the
# multiplier between what a source delivers and what the meter records, and the
# provider bill cycle the meter bills on.
meterSetup:
  providerMeterNumber: the provider's badge number, formatted per the provider's meterModel.providerNumberFormat; owned meters have none
  billCycle: the cycle the provider runs for that meter's company; Meter.BillCycle stores the number alone, so a provider must be set first
  multipliers:            # every other meter records what its source delivers
    - { meterId: ved_science_center_lab_wing, value: 40, why: 200:5 current transformers on the lab wing service }
    - { meterId: ntp_central_plant_steam_production, value: 10, why: the plant header counts each pulse as 10 klb }
    - { meterId: sgu_central_plant_boiler_gas, value: 3.0367, why: pressure factor of the 30 psig boiler delivery, (30 + 14.73) / 14.73 }
    - { meterId: ved_ridgeline_interconnection, value: 12000, why: "34.5 kV metering: 300:1 potential transformers times 200:5 current transformers" }

billingAccountSetup:
  serviceAddress: building          # the account bills a building, so it takes that building's address
  remitAddress: provider            # the provider's billing.remitAddress, entered on the Utility Provider editor
  accountRepresentative:            # Account Contact and Account Address sections
    contact: onboarding contact whose providerId matches the account's provider
    address: the provider's billing.businessAddress
    internalProviders:              # an internal counterparty has no external representative
      northlake_thermal_plant: devon.brooks
      ridgeline_wind: mateo.alvarez   # the plant's own wind company; its site manager signs the transfer statement
  invoiceTemplate: Bill Table Invoice Default      # seeded row 1; internal cost centers use row 2, Billing Charges Report
  internalCostCenterInvoiceTemplate: Billing Charges Report
  billEntryTypeCodes:               # Global_Type_Code 'BA2'; the method per account comes from the Phase 1 entry plan
    import: Bill Importer
    manual: Bill Entry
    manual allocation: Bill Allocation
    generate: Bill Generation       # Ridgeline's transfer statement; tenant rebilling (Stage 7) uses it too
    unusedCodes: [Other]

