      - {code: sewer_base, description: Sewer base charge, quantity: 1, unit: month, rate: 28.50, amount: 28.50}
      - {code: sewer_volume, description: Sewer volume (billed on the metered water), quantity: 140, unit: kgal, rate: 7.95, amount: 1113.00}
    total: 2128.00
