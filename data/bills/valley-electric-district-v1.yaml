manifestVersion: 1
id: valley_electric_district_bills_v1
customerScenarioId: demo_university_v1
purpose: >
  The four Valley Electric campus sample bills, 01 to 04 of documents/utility-bills/valley-electric-district/,
  rendered from data by generators/render_bills.py. They replace hand-made images whose meter and charge tables
  were empty and whose periods ignored the provider's read cycle. Each bill now covers one Stage 1 cycle 1 period,
  names Stage 2's meters, badges and multipliers, and prices every line at the tariff's own rate; the four stories
  are kept (a standard month, a summer demand month on two services, a meter exchange, and the FY2025 rate change).

# Each line: description, then quantity x rate = amount (rounded half-up to the cent), or percent + percentOf (the
# line codes it applies to). `code` is the provider's billCharges code (data/providers/valley-electric-district.yaml).
# Valley Electric cycle 1 reads on the 5th: a period runs from the 5th to the 4th and posts to the month it ends in
# (Stage 1 02-utility-providers.yaml). Stage 5 enters a Valley Electric bill on its period end + 3 days, so each
# statement is dated just after the read and falls due 30 days later (the next Monday when that is a weekend).
# Summer (June to September) has on-peak, part-peak and off-peak energy; winter (October to May) has part-peak and
# off-peak only, so a winter bill has no on-peak line.
bills:
  # ------------------------------------------------------------------ Admin Hall: a standard winter month
  - id: ved_admin_hall_2024_04
    file: documents/utility-bills/valley-electric-district/01-Valley-Electric-Admin-Hall-Standard-Monthly.pdf
    providerId: valley_electric_district
    accountId: ved_admin_hall
    title: Electric Service Statement
    customer: Northlake University
    accountNumber: SYN-VED-A-0010001
    rateSchedules: [VED-TOU-GS]
    billDate: 2024-04-05          # the April 2024 period, March 5 to April 4
    dueDate: 2024-05-06
    period: {start: 2024-03-05, end: 2024-04-04}
    notice: >
      A standard monthly bill from a monthly-read meter. Its time-of-use registers were read on April 4 for the
      March 5 to April 4 cycle (the April 2024 period). Winter has no on-peak period, so the on-peak register does
      not run and the bill carries part-peak and off-peak energy only, plus billing demand and the facility charge.
    meters:
      - {meterNumber: SYN-VED-M-0040001, badge: VED-BADGE-0040001, channel: Part-peak register, previous: 73905, present: 88165, quantity: 14260, unit: kWh}
      - {meterNumber: SYN-VED-M-0040001, badge: VED-BADGE-0040001, channel: Off-peak register, previous: 66210, present: 79630, quantity: 13420, unit: kWh}
      - {meterNumber: SYN-VED-M-0040001, badge: VED-BADGE-0040001, channel: Billing demand, quantity: 138, unit: kW}
    lines:
      - {code: energy_part_peak, description: "Energy, part-peak (winter)", quantity: 14260, unit: kWh, rate: 0.168, amount: 2395.68}
      - {code: energy_off_peak, description: "Energy, off-peak (winter)", quantity: 13420, unit: kWh, rate: 0.112, amount: 1503.04}
      - {code: demand_charge, description: "Demand, maximum 15-minute kW", quantity: 138, unit: kW, rate: 18.40, amount: 2539.20}
      - {code: facility_charge, description: Facility charge, quantity: 1, unit: month, rate: 64.00, amount: 64.00}
      - {code: public_purpose_program, description: Public purpose program, percent: 1.5, percentOf: [energy_part_peak, energy_off_peak], amount: 58.48}
      - {code: utility_users_tax, description: Utility users tax, percent: 5.0, percentOf: [energy_part_peak, energy_off_peak, demand_charge, facility_charge, public_purpose_program], amount: 328.02}
    total: 6888.42

