      SYN-VED-M-0040002; the lab wing's second service, SYN-VED-M-0040007, is read monthly and its registers are
      multiplied by 40 (200:5 current transformers). Energy adds the two meters' kWh in each time-of-use period.
      Billing demand adds each service's highest 15-minute kW (206 + 62 = 268 kW), and the account pays one
