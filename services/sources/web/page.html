<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{title}}</title>
  <link rel="icon" href="{{root}}branding/northlake-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{root}}branding/brand.css">
  <link rel="stylesheet" href="{{root}}branding/site.css">
  <link rel="stylesheet" href="{{root}}assets/sources.css">
</head>
<body class="{{palette}}">
  <header class="nl-masthead">
    <div class="nl-masthead__inner">
      <div class="nl-masthead__brand">
        <a class="nl-lockup" href="{{root}}"><img class="nl-lockup__image" src="{{root}}branding/northlake-logo-reversed.svg" alt="Northlake University" width="237" height="64"></a>
        <span class="nl-masthead__title">Utility services</span>
      </div>
      <span class="nl-masthead__chip">Synthetic customer</span>
    </div>
  </header>
  <main class="nl-main source-main">{{body}}</main>
  <footer class="nl-page-footer"><div class="nl-page-footer__inner">{{footer}}</div></footer>
</body>
</html>
