# EEM companies are operating and security boundaries, not legal entities. Each
# site below names the company that owns it; a building, meter or point belongs
# to exactly one company and is never duplicated in another.
# See docs/northlake-inventory-standard.md.
companies:
  - id: northlake_university
    displayName: Northlake University
    companyType: campus_operations_company
    responsibleDepartment: Facilities Operations
  - id: cedar_row_apartments
    displayName: Cedar Row Apartments
    companyType: operating_company
    responsibleDepartment: Housing Operations
  - id: northlake_thermal_plant
    displayName: Northlake Thermal Plant
    companyType: internal_service_company
    responsibleDepartment: Thermal Plant Operations

weather:
  primaryStation: KSAC
  secondaryStation: KSMF

dateRange:
  start: 2024-01-01
  end: 2025-12-31

