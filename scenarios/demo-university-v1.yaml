# Five fully-configured providers, split 3 everyday + 2 unique identities.
# Full definitions (services, units, channels, rate schedules, charges, file
# formats, environmental attributes, scenario hooks) live in providers/<id>.yaml.
# Owned submeters, deduct meters, production meters and logical sources have no
# provider; they are listed under ownedMeters.
providers:
  # --- 3 everyday utilities ---
  - id: valley_electric_district
    displayName: Valley Electric District
    identityClass: everyday
    providerKind: distribution_utility
    billingModel: tariff_metered
    categories: [electric]
    supplies: [monthly_bill, interval_15min, billing_demand, unmetered_lighting]
    configRef: providers/valley-electric-district.yaml
  - id: sierra_gas_utility
    displayName: Sierra Gas Utility
    identityClass: everyday
    providerKind: distribution_utility
    billingModel: tariff_metered
    categories: [natural_gas]
    supplies: [monthly_bill]
    configRef: providers/sierra-gas-utility.yaml
  - id: river_city_utilities
    displayName: River City Utilities
    identityClass: everyday
    providerKind: municipal_multi_service
    billingModel: bundled_municipal
    categories: [water, sewer, stormwater, irrigation, fire_service]
    supplies: [monthly_bill]
    configRef: providers/river-city-utilities.yaml
    replaces: [river_city_water, capital_sewer_district]
  # --- 2 unique provider identities (not everyday utilities) ---
  - id: northlake_thermal_plant
    displayName: Northlake Thermal Plant
    identityClass: unique
    providerKind: district_energy_plant
    billingModel: internal_allocation
    categories: [chilled_water, steam]
    supplies: [interval_hourly, monthly_allocation]
    configRef: providers/northlake-thermal-plant.yaml
  - id: helios_onsite_solar
    displayName: Helios Onsite Solar
    identityClass: unique
    providerKind: onsite_generation_ppa
    billingModel: ppa_generation
    categories: [solar_generation]
    supplies: [interval_15min, monthly_ppa_invoice, rec_statement]
    configRef: providers/helios-onsite-solar.yaml

# External reference streams that belong to no building: the two weather
# stations. Building sensors, historians, controllers and test signals are
# owned meters of the building they describe (see ownedMeters).
referenceChannels:
  - id: ch_weather_ksac_temp_f_hourly
    sourceKind: weather_station
    sourceId: KSAC
    commodity: weather
    role: observation
    unit: degF
    intervalMinutes: 60
    pointType: temp_f
  - id: ch_weather_ksac_rh_hourly
    sourceKind: weather_station
    sourceId: KSAC
    commodity: weather
    role: observation
    unit: pct
    intervalMinutes: 60
    pointType: relative_humidity
  - id: ch_weather_ksac_wind_mph_hourly
    sourceKind: weather_station
    sourceId: KSAC
    commodity: weather
    role: observation
    unit: mph
    intervalMinutes: 60
    pointType: wind_mph
  - id: ch_weather_ksmf_temp_f_hourly
    sourceKind: weather_station
    sourceId: KSMF
    commodity: weather
    role: observation
    unit: degF
    intervalMinutes: 60
    pointType: tempF
  - id: ch_weather_ksmf_forecast_temp_f_hourly
    sourceKind: weather_station
    sourceId: KSMF
    commodity: weather
    role: forecast
    unit: degF
    intervalMinutes: 60
    pointType: tempF

# Provider accounts and the utility meters on them. Every meter names the
# building it serves; the building's site names the owning EEM company.
# Channel roles decide what EEM stores (eem/northlake-eem-metaworld-stage1b-v1.yaml
# pointRules): billing_*, derived_billing_*, flat_service_fee and
# monthly_allocation are bill facts with no point; interval, route, register,
# sensor and equipment channels become points.
accounts:
  # ---------------------------------------------------------------- Valley Electric District
  - id: ved_admin_hall
    providerId: valley_electric_district
    siteId: northlake_main_campus
    buildingId: admin_hall
    syntheticAccountNumber: SYN-VED-A-0010001
    rateScheduleId: VED-TOU-GS
    effectiveStart: 2024-01-01
    meters:
      - id: ved_admin_hall_main
        displayName: Admin Hall Electric Main
        syntheticMeterNumber: SYN-VED-M-0040001
        meterType: monthly_kwh
        channels:
          - {id: ch_ved_admin_hall_kwh_monthly, commodity: electric, role: billing_usage, unit: kWh, direction: delivered, intervalMinutes: null, pointType: kWh}
          - {id: ch_ved_admin_hall_kw_monthly, commodity: electric, role: billing_demand, unit: kW, direction: delivered, intervalMinutes: null, pointType: kW}
  - id: ved_science_center
    providerId: valley_electric_district
    siteId: northlake_main_campus
    buildingId: science_center
    syntheticAccountNumber: SYN-VED-A-0010002
    rateScheduleId: VED-TOU-GS
    effectiveStart: 2024-01-01
    meters:
      - id: ved_science_center_interval
        displayName: Science Center Electric Main
        syntheticMeterNumber: SYN-VED-M-0040002
        meterType: interval_demand
        gatewayProfiles: [gw_mv90_valley_mdef]
