# Meters the customer owns behind a utility meter, and data sources that behave
# like meters (sensors, historians, controllers, test signals). They have no
# provider account. An entry with perUnit: true is a template; the generator
# expands it once per apartment using the building's unitNumbering, replacing
# {unit} in ids, names, tags and channel ids. Unit numbers are floor * 100 +
# position (101..120, 201..220, ...).
ownedMeters:
  # ---------------------------------------------------------------- Northlake Main Campus
  - id: science_center_environmental_sensors
    buildingId: science_center
    displayName: Science Center Lab Environment
    syntheticMeterNumber: SCIENCE-CENTER-ENVIRONMENTAL-SENSORS
    kind: sensor_group
    gatewayProfiles: [gw_spinwave_science_lab]
    channels:
      - {id: ch_spinwave_science_lab_temp_f_15m, commodity: indoor_air, role: sensor_observation, unit: degF, intervalMinutes: 15, pointType: temp_f, pointName: Lab Air Temperature}
      - {id: ch_spinwave_science_lab_rh_15m, commodity: indoor_air, role: sensor_observation, unit: pct, intervalMinutes: 15, pointType: relative_humidity, pointName: Lab Relative Humidity}
  - id: library_historian_electric_interval
    buildingId: library
    displayName: Library Electric Historian
    syntheticMeterNumber: LIBRARY-HISTORIAN-ELECTRIC-INTERVAL
    kind: logical_source
    overlapsMeterId: ved_library_main_after_replacement
    gatewayProfiles: [gw_odbc_library_historian]
    notes: SQL historian mirror of the electric service; never added to the utility meter.
    channels:
      - {id: ch_odbc_library_electric_kwh_15m, commodity: electric, role: interval_usage, unit: kWh, intervalMinutes: 15, pointType: kWh, pointName: Historian Delivered kWh 15m}
  - id: student_center_kitchen_deduct_water
    buildingId: student_center
    displayName: Student Center Kitchen Sewer Deduct
    syntheticMeterNumber: SYN-DED-W-SC01
    kind: deduct_submeter
    behindMeterId: rcu_student_center_water
    notes: Water that leaves in food-service waste, not the sewer; read monthly by Facilities and submitted for the sewer credit.
    channels:
      - {id: ch_student_center_kitchen_deduct_register, commodity: water, role: manual_register_reading, unit: Reading, intervalMinutes: 43200, pointType: Reading}
      - {id: ch_student_center_kitchen_deduct_kgal_monthly, commodity: water, role: manual_usage_delta, unit: kgal, intervalMinutes: 43200, pointType: kgal, derivedFromChannelId: ch_student_center_kitchen_deduct_register}
  - id: fake_gateway_smoke_meter
