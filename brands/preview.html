<!doctype html>
<html lang="en">
<head>

  <meta name="robots" content="noindex, nofollow">

    window.BRAND_ID = Object.prototype.hasOwnProperty.call(window.BRAND_CONTENT, new URLSearchParams(location.search).get("brand"))
      ? new URLSearchParams(location.search).get("brand") : "northlake";
    for (const file of ["fonts.css", "tokens.css"]) {
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = window.BRAND_ID + "/" + file;
      document.head.appendChild(link);

  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: var(--font-text); color: var(--ink); background: var(--canvas); font-size: var(--size-body); line-height: var(--leading-body); }
    .top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 6px 24px; background: var(--topbar-bg); color: var(--topbar-ink); font-size: 13px; }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding: 14px 24px; background: var(--header-bg); color: var(--header-ink); border-bottom: var(--rule-accent) solid var(--header-rule); }
    .head img { display: block; height: var(--logo-height); width: auto; }
    .nav { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; font-weight: var(--weight-strong); text-transform: var(--case-button); }
    main { padding: var(--space-7) 24px var(--space-6); }
    .kicker { margin: 0 0 var(--space-2); font-size: var(--size-label); font-weight: var(--weight-strong); text-transform: var(--case-label); letter-spacing: 0.04em; color: var(--accent-ink); }
    h1 { margin: 0 0 var(--space-3); font-family: var(--font-display); font-weight: var(--weight-display); font-size: calc(var(--size-h1) * 0.8); line-height: 1.12; letter-spacing: var(--tracking-display); text-transform: var(--case-heading); color: var(--heading-ink); font-stretch: var(--stretch-display, 100%); }
    .lede { margin: 0 0 var(--space-5); max-width: 620px; color: var(--muted); }
    .actions { display: flex; gap: var(--space-3); flex-wrap: wrap; }
    .button { display: inline-flex; align-items: center; min-height: 42px; padding: 0 18px; border: 2px solid var(--primary); border-radius: var(--radius); background: var(--primary); color: var(--on-primary); font: inherit; font-size: 14px; font-weight: var(--weight-strong); text-transform: var(--case-button); }
    .button.alt { background: transparent; color: var(--primary); }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); margin-top: var(--space-6); }
    .card { background: var(--surface); border: var(--rule) solid var(--line); border-radius: var(--radius); padding: var(--space-4); }
    .card h2 { margin: 0 0 var(--space-1); font-family: var(--font-display); font-weight: var(--weight-display); font-size: 17px; text-transform: var(--case-heading); color: var(--heading-ink); font-stretch: var(--stretch-display, 100%); }
    .card strong { display: block; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 22px; color: var(--heading-ink); }
    .card p { margin: 0; color: var(--muted); font-size: var(--size-small); }
    .statement { margin-top: var(--space-6); background: #fff; border: 1px solid var(--line); }
    .statement header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 14px 18px; background: var(--header-bg); color: var(--header-ink); border-bottom: var(--rule-accent) solid var(--header-rule); }
    .statement header img { height: calc(var(--logo-height) * 0.9); width: auto; }
    .statement b { display: block; text-align: right; font-family: var(--font-display); font-weight: var(--weight-display); text-transform: var(--case-heading); font-stretch: var(--stretch-display, 100%); }
    .statement small { display: block; text-align: right; opacity: 0.85; }
    .due { margin: 14px 18px; padding: 10px 12px; background: var(--tint); border-top: 3px solid var(--primary); text-align: right; color: var(--muted); }
    .due strong { display: block; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 24px; color: var(--heading-ink); }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: var(--space-6); }
    .swatch { width: 112px; font-size: 12px; }
    .swatch i { display: block; height: 44px; border: 1px solid rgba(0, 0, 0, 0.12); }
    .swatch code { color: var(--muted); }
    footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 24px; background: var(--footer-bg); color: var(--footer-ink); font-size: 12.5px; }
    @media (max-width: 760px) { .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <script>
    (function () {
      const c = window.BRAND_CONTENT[window.BRAND_ID];
      const logo = window.BRAND_ID + "/" + (c.darkHeader ? "logo-reversed.svg" : "logo.svg");
      const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[ch]));
      document.title = c.name + " · brand preview";
      let html = "";
      if (c.top) html += `<div class="top"><span>${esc(c.top[0])}</span><span>${esc(c.top[1])}</span></div>`;
      html += `<div class="head"><img src="${logo}" alt="${esc(c.name)}"><nav class="nav">${c.nav.map((n) => `<span>${esc(n)}</span>`).join("")}</nav></div>`;
      html += `<main><p class="kicker">${esc(c.kicker)}</p><h1>${esc(c.title)}</h1><p class="lede">${esc(c.lede)}</p>`;
      html += `<div class="actions"><span class="button">${esc(c.actions[0])}</span><span class="button alt">${esc(c.actions[1])}</span></div>`;
      html += `<div class="cards">${c.cards.map(([t, f, p]) => `<div class="card"><h2>${esc(t)}</h2>${f ? `<strong>${esc(f)}</strong>` : ""}<p>${esc(p)}</p></div>`).join("")}</div>`;
      if (c.statement) {
        html += `<section class="statement"><header><img src="${logo}" alt=""><div><b>${esc(c.statement[0])}</b><small>${esc(c.statement[1])}</small></div></header>`;
        html += `<div class="due">${esc(c.statement[2])}<strong>${esc(c.statement[3])}</strong></div></section>`;
      }
      html += `<div class="swatches" id="swatches"></div></main>`;
      html += `<footer><span>${esc(c.foot[0])}</span><span>${esc(c.foot[1])}</span></footer>`;
      document.body.insertAdjacentHTML("beforeend", html);
      // Swatches read the live token values, so they always match tokens.css.
      window.addEventListener("load", () => {
        const style = getComputedStyle(document.documentElement);
        const names = ["primary", "accent", "support", "heading-ink", "ink", "muted", "canvas", "tint", "line",
          "service-water", "service-sewer", "service-storm", "commodity-chilled", "commodity-steam"];
        document.getElementById("swatches").innerHTML = names
          .map((name) => [name, style.getPropertyValue("--" + name).trim()])
          .filter(([, value]) => value)
          .map(([name, value]) => `<div class="swatch"><i style="background:${esc(value)}"></i>${esc(value)}<br><code>--${esc(name)}</code></div>`)
          .join("");
      });
    })();
  </script>
</body>
</html>
