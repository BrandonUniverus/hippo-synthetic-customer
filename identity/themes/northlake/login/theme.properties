parent=keycloak.v2
import=common/keycloak

# PatternFly 5 (stylesCommon) is inherited from keycloak.v2. The parent's own
# styles.css is kept for its small utility rules; brand.css supplies the
# Northlake tokens and font faces; northlake.css owns the page.
styles=css/styles.css branding/brand.css css/northlake.css

darkMode=false

favicons.mark=branding/northlake-mark.svg
favicons.mark.type=image/svg+xml
favicons.png=branding/favicon-32.png
favicons.png.type=image/png

# Where the masthead lockup and "Back to Northlake" link go.
kcLogoLink=/

# Appended to every stylesheet URL below so browsers that cached an older
# copy of these files fetch the new ones. Bump it when the CSS changes.
assetVersion=20260914-2
