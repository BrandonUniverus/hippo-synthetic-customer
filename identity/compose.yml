name: hippo-synthetic-identity

services:
  postgres:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run Initialize-Identity.ps1 first}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - identity-backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    restart: unless-stopped
    command:
      - start
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run Initialize-Identity.ps1 first}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Run Initialize-Identity.ps1 first}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run Initialize-Identity.ps1 first}
      KC_HOSTNAME: ${IDENTITY_PUBLIC_BASE_URL:-https://localhost:8443}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_CACHE: local
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./.runtime/import:/opt/keycloak/data/import:ro
    networks:
      - identity-backend

  configuration:
    image: hippo-synthetic-identity-configuration:local
    build:
      context: ..
      dockerfile: identity/configuration/Dockerfile
    restart: unless-stopped
    environment:
      NORTHLAKE_RUNTIME_DIRECTORY: /runtime
      NORTHLAKE_MANIFEST_PATH: /app/security/northlake-eem-security-v1.yaml
      NORTHLAKE_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      NORTHLAKE_VERIFIER_HOST_ALIAS: caddy
      NORTHLAKE_PROVIDER_DISPLAY_NAME: ${NORTHLAKE_PROVIDER_DISPLAY_NAME:-Northlake Synthetic Identity}
      NORTHLAKE_REALM_KEY: ${NORTHLAKE_REALM_KEY:-northlake}
      NORTHLAKE_ENABLE_OIDC: ${NORTHLAKE_ENABLE_OIDC:-true}
      NORTHLAKE_ENABLE_SAML: ${NORTHLAKE_ENABLE_SAML:-true}
      IDENTITY_PUBLIC_BASE_URL: ${IDENTITY_PUBLIC_BASE_URL:-https://localhost:8443}
      IDENTITY_HTTPS_PORT: ${IDENTITY_HTTPS_PORT:-8443}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Run Initialize-Identity.ps1 first}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run Initialize-Identity.ps1 first}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run Initialize-Identity.ps1 first}
      EEMSUITE_OIDC_CLIENT_SECRET: ${EEMSUITE_OIDC_CLIENT_SECRET:?Run Initialize-Identity.ps1 first}
      EEMSUITE_OIDC_LEGACY_CLIENT_SECRET: ${EEMSUITE_OIDC_LEGACY_CLIENT_SECRET:?Run Initialize-Identity.ps1 first}
      SYNTHETIC_USER_PASSWORD: ${SYNTHETIC_USER_PASSWORD:?Run Initialize-Identity.ps1 first}
      EEMSUITE_APPLICATION_HOME_URL: ${EEMSUITE_APPLICATION_HOME_URL:-https://localdev.energyhippo.com/Hippo/}
      EEMSUITE_OIDC_REDIRECT_URIS: ${EEMSUITE_OIDC_REDIRECT_URIS:-https://localhost:7310/signin-oidc}
      EEMSUITE_SAML_PROFILES: ${EEMSUITE_SAML_PROFILES:-Standard}
      EEMSUITE_SAML_STANDARD_ENTITY_ID: ${EEMSUITE_SAML_STANDARD_ENTITY_ID:-urn:energyhippo:eemsuite-web:saml:standard}
      EEMSUITE_SAML_STANDARD_ACS_URLS: ${EEMSUITE_SAML_STANDARD_ACS_URLS:-https://localhost:7310/saml/northlake-saml-standard/acs}
      EEMSUITE_SAML_STANDARD_LOGOUT_URLS: ${EEMSUITE_SAML_STANDARD_LOGOUT_URLS:-https://localhost:7310/saml/northlake-saml-standard/logout}
      EEMSUITE_SAML2INT_ENTITY_ID: ${EEMSUITE_SAML2INT_ENTITY_ID:-urn:energyhippo:eemsuite-web:saml:saml2int}
      EEMSUITE_SAML2INT_ACS_URLS: ${EEMSUITE_SAML2INT_ACS_URLS:-https://localhost/Hippo/saml/northlake-saml2int/acs}
      EEMSUITE_SAML2INT_LOGOUT_URLS: ${EEMSUITE_SAML2INT_LOGOUT_URLS:-https://localhost/Hippo/saml/northlake-saml2int/logout}
      EEMSUITE_SAML2INT_SP_CERTIFICATE_FILE: /runtime/certs/saml2int-sp-public.cer
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/configure/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - ./.runtime:/runtime
    networks:
      - identity-backend

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      IDENTITY_HOST: ${IDENTITY_HOST:-localhost}
      EEMSUITE_APPLICATION_HOME_URL: ${EEMSUITE_APPLICATION_HOME_URL:-https://localdev.energyhippo.com/Hippo/}
    ports:
      - "${IDENTITY_BIND_ADDRESS:-127.0.0.1}:${IDENTITY_HTTPS_PORT:-8443}:8443"
    depends_on:
      keycloak:
        condition: service_started
      configuration:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portal:/srv/northlake-portal:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - identity-backend
      - identity-edge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  identity-backend:
    internal: true
  identity-edge:
