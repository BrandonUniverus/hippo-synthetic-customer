manifestVersion: 2
id: northlake_eem_metaworld_stage1b_v1
customerScenarioId: demo_university_v1
stage: 1b
displayName: Northlake EEM MetaWorld Stage 1B Setup
purpose: >
  App-facing rules for finishing the blank Northlake EEM system after the
  company shells exist: how the scenario's sites, buildings, accounts, meters
  and channels become EEM hierarchy nodes, utility setup, billing account
  shells, meter nodes, point nodes, weather station mappings, aggregates and
  baselines. The scenario manifest owns the inventory; this file owns only the
  mapping rules and the EEM-only objects (weather stations, aggregates,
  baselines). See docs/northlake-inventory-standard.md.

sourceReferences:
  onboardingDecisions: scenarios/northlake-onboarding-v1.yaml
  stage1CompanySetup: eem/northlake-eem-stage1-setup-v1.yaml
  sourceScenarioManifest: scenarios/demo-university-v1.yaml
  securityManifest: security/northlake-eem-security-v1.yaml
  addressCoordinates: docs/northlake-address-coordinates.md
  customerOverview: customer-provided/northlake-university/northlake-facilities-and-utility-overview.md
  inventoryStandard: docs/northlake-inventory-standard.md

eemResearchBasis:
  hierarchyNodeTypes:
    source: C:/Hippo/Git/univerus/energyhippo/src/Domain/EEMSuite.Domain/Organizations/Hierarchy/Models/HierarchyNodes/HierarchyNodeTypes.cs
    supported:
      - {name: Company, internalLevelNbr: -1, use: Existing company/security boundary.}
      - {name: UserDefined, internalLevelNbr: 0, use: Not used by Northlake.}
      - {name: Site, internalLevelNbr: 1, use: Campus, property, plant, and weather-reference groupings.}
      - {name: Location, internalLevelNbr: 2, use: Buildings and outdoor service areas.}
      - {name: Meter, internalLevelNbr: 4, use: Utility meters, owned submeters, production meters, weather stations, sensor groups, controllers and logical sources.}
      - {name: Point, internalLevelNbr: 5, use: Measured, read, derived and aggregated channels, weather indices, and baselines.}
    placement: >
      EEM places a node under any node of broader scope and refuses the same or
      narrower scope (HierarchyNode.CanAddNode); depth is not fixed. Northlake keeps
      physical meters under their Building and points under their meter by
      convention; aggregate points sit directly under the Site or Building they
      summarise and weather station meters sit directly under the Weather Reference
      site.
  meterStorage:
    sourceTables: [MetaWorld_TBL, Meter]
    saveProc: Meter_Save
    keyFields:
      - ProviderID
      - RateScheduleOID
      - BA_BillingAccountID
      - SM_Code
      - SM_SerialNumber
      - SM_Multiplier
      - BillCycle
  pointStorage:
    sourceTables: [MetaWorld_TBL, PointDef_TBL, PtRelatedData_TBL]
    saveProc: Point_Save
    supportedPointTypes:
      - {name: Analog, expectedPtType: 1, use: Most interval, weather, and calculated values.}
      - {name: Digital, expectedPtType: 2, use: Status/state points using company digital colors.}
      - {name: Accumulator, expectedPtType: 3, use: Register readings that produce usage deltas.}
      - {name: AccumulatorDelta, expectedPtType: 4, use: Usage delta related to an accumulator.}
      - {name: AccumulatorROC, expectedPtType: 5, use: Rate-of-change related point where enabled.}
    note: Confirm exact PointTypes rows in the restored target database before app setup.
  billData:
    behavior:
      - Bill usage, demand and cost are bill records on the meter's billing account, not point archives.
      - A meter whose channels are all bill facts (billing usage, billing demand, derived sewer, flat fees, monthly allocations) has no points.
  weatherAndIndex:
    sourceObjects:
      - C:/Hippo/Git/univerus/energyhippo/Database/EEMSuite/Procs/IndexPoints_Save.sql
      - C:/Hippo/Git/univerus/energyhippo/Database/EEMSuite/Views/wh_WeatherRelatedPoints.sql
      - C:/Hippo/Git/univerus/energyhippo/Database/EEMSuite/Tables/WeatherStationMap_TBL.sql
    behavior:
      - Weather stations are meter nodes with Weather measure type, not a separate hierarchy type.
      - Temperature points use degF or degC units.
      - IndexType 0 on a temperature point creates related HDD and CDD points.
      - HDD/CDD are linked through PtRelatedData_TBL reason types H and C.
      - WeatherStationMap_tbl maps a weather station meter to company location nodes; children inherit the mapping.
  aggregates:
    sourceObjects:
      - C:/Hippo/Git/univerus/energyhippo/Database/EEMSuite/Tables/PointAggregates_TBL.sql
      - C:/Hippo/Git/univerus/energyhippo/Database/EEMSuite/Tables/PointAggregatePoints.sql
      - C:/Hippo/Git/univerus/energyhippo/Database/EEMSuite/Procs/PointAggregation_Save.sql
    behavior:
      - An aggregate is still a point node.
      - The aggregate point is registered in PointAggregates_TBL.
      - Members in PointAggregatePoints must match interval and unit.
      - Multipliers and Required flags are available per member.
  baselines:
    sourceObjects:
      - C:/Hippo/Git/univerus/energyhippo/Database/EEMSuite/Tables/PointBaseLine.sql
      - C:/Hippo/Git/univerus/energyhippo/Database/EEMSuite/Procs/PtRelatedData_Save.sql
      - C:/Hippo/Git/univerus/energyhippo/Database/EEMSuite/Procs/BaselinePoints_Lookup.sql
    behavior:
      - Baseline points are real point nodes.
      - PointBaseline assigns the baseline calculation.
      - PtRelatedData_TBL reason type B links the measured point to its baseline point.
  gatewayComponentsCovered:
    sourceProject: C:/Hippo/Git/univerus/energyhippo/EEMSuite/src/Tasks/EEMSuite.Tasks.Gateways/EEMSuite.Tasks.Gateways.csproj
    components:
      - {componentId: AcquiSuiteGateway, executorKey: gateway.acquisuite, gatewayType: ACQUISUITE}
      - {componentId: MV90Gateway, executorKey: gateway.mv90, gatewayType: MDEF}
      - {componentId: MV90Gateway, executorKey: gateway.mv90, gatewayType: MV9}
      - {componentId: BACnetGateway, executorKey: gateway.bacnet, gatewayType: BACNET}
      - {componentId: NOAAGateway, executorKey: gateway.noaa, gatewayType: NOAA}
      - {componentId: AerisWeatherGateway, executorKey: gateway.aerisweather, gatewayType: AERISWEATHER}
      - {componentId: SpinwaveGateway, executorKey: gateway.spinwave, gatewayType: SPINWAVE}
      - {componentId: FIGGateway, executorKey: gateway.fig, gatewayType: FIG}
      - {componentId: FIGGateway, executorKey: gateway.fig, gatewayType: SIEMANSREPORT}
      - {componentId: FIGGateway, executorKey: gateway.fig, gatewayType: MEDIATOR}
      - {componentId: FIGGateway, executorKey: gateway.fig, gatewayType: EATON}
      - {componentId: FIGGateway, executorKey: gateway.fig, gatewayType: XML}
      - {componentId: FIGGateway, executorKey: gateway.fig, gatewayType: FIXEDNETWORKS}
      - {componentId: FIGGateway, executorKey: gateway.fig, gatewayType: CMEP}
      - {componentId: ModbusGateway, executorKey: gateway.modbus, gatewayType: MODBUS}
      - {componentId: ODBCGateway, executorKey: gateway.odbc, gatewayType: ODBC}
      - {componentId: FakeGateway, executorKey: gateway.fake, gatewayType: FAKE}
      - {componentId: NeptuneGateway, executorKey: gateway.neptune, gatewayType: NEPTUNE}
      - {componentId: MVRSGateway, executorKey: gateway.mvrs, gatewayType: MVRS}
      - {componentId: HmrEventsPublish, executorKey: hmr.events.publish, gatewayType: HMR_EVENTS}

stageBoundaries:
  stage1aCompanyShell:
    alreadyModeledIn: eem/northlake-eem-stage1-setup-v1.yaml
    includes: [companies, definitions, levels, users, groups]
  stage1bMetaWorldSetup:
    includes:
      - Site and Building nodes for every scenario site, in the owning company.
      - Utility provider and rate schedule shells.
      - Billing account, cost center, and agreement shells with no bills loaded.
      - Meter nodes for utility meters, owned submeters, production meters, sensor groups and logical sources.
      - Point nodes for interval, route, register, sensor and equipment channels, with archive interval settings but no archive rows.
      - Weather station meter nodes, HDD/CDD related points, and weather station assignments.
      - Aggregate point definitions and member selections.
      - Baseline point shells and measured-to-baseline relationships.
    excludes:
      - Bill records and bill images attached to records.
      - AnalogArchive_TBL and DigitalArchive_TBL scenario data.
      - Gateway runtime object registry rows, workflow definitions, and task schedules.
      - Enabled gateway execution.
  stage2GatewayPrep:
    includes:
      - Gateway objects, gateway nodes, and gateway point bindings.
      - Workflows and schedules created disabled.
      - Local service configuration for fake providers and local SMTP.
  stage3Consumption:
    includes:
      - Generated bills, bill images, interval archives, weather observations, gateway artifacts, task runs, and validation assertions.

ownershipRules:
  - A site, building, meter or point belongs to the company that owns its scenario site; nothing is copied into another company.
  - Northlake University owns the campus buildings and every meter that serves them, including the chilled-water and steam meters whose provider is the Northlake Thermal Plant, the campus solar arrays, the weather references and the campus aggregates.
  - Cedar Row Apartments owns the property buildings, the utility master meters, every apartment and house submeter, the carport solar array and the property's own bills.
  - Northlake Thermal Plant owns only the Central Plant: its utility services, production meters, deduct meter and plant controller. It is also the provider record used by the university's thermal meters.
  - Weather station reference meters are created once under the university's Weather Reference site and mapped to every building through WeatherStationMap_tbl.
  - Cross-company visibility (for example a plant operator reading a served building's thermal meter) is a group grant into the other company's subtree, never a duplicate node.

hierarchyRules:
  levels: [Site, Building, Meter, Point]
  companyPath: "System / {companyName}"
  sitePath: "{companyPath} / {siteName}"
  buildingPath: "{sitePath} / {buildingName}"
  meterParent: building
  aggregateParent: site_or_building
  weatherSite: Weather Reference
  weatherParentPath: "System / Northlake University / Weather Reference"

# Commodity on a meter's first channel (or its kind) decides the EEM measure type.
measureTypes:
  byCommodity:
    electric: Electric
    natural_gas: Natural Gas
    water: Water
    sewer: Water
    stormwater: Water
    chilled_water: Chilled Water
    steam: Steam
    solar_generation: Solar Generation
    indoor_air: Weather
    weather: Weather
  byMeterType:
    unmetered_area_lighting: Electric
    fire_service_detector_check: Water

# Which scenario channel roles become EEM points, and what they are called.
pointRules:
  billOnlyRoles: [billing_usage, billing_demand, derived_billing_usage, flat_service_fee, monthly_allocation]
  pointTypeByRole:
    interval_usage: Analog
    interval_demand: Analog
    interval_generation: Analog
    interval_export: Analog
    interval_generation_demand: Analog
    interval_production: Analog
    interval_production_demand: Analog
    submeter_interval_usage: Analog
    sensor_observation: Analog
    equipment_demand: Analog
    equipment_status: Digital
    generated_smoke_test: Analog
    observation: Analog
    forecast: Analog
    handheld_register_reading: Accumulator
    handheld_usage_delta: AccumulatorDelta
    manual_register_reading: Accumulator
    manual_usage_delta: AccumulatorDelta
  # A channel's explicit pointName wins; otherwise the role template applies.
  pointNameByRole:
    interval_usage: "Delivered {unit} {interval}"
    interval_demand: "Demand {unit} {interval}"
    interval_generation: "Generated {unit} {interval}"
    interval_export: "Exported {unit} {interval}"
    interval_generation_demand: "Generated {unit} {interval}"
    interval_production: "Produced {unit} {interval}"
    interval_production_demand: "Production Rate {unit} {interval}"
    submeter_interval_usage: "Submeter {unit} {interval}"
    handheld_register_reading: "Register Reading"
    handheld_usage_delta: "Route Usage {unit}"
    manual_register_reading: "Register Reading"
    manual_usage_delta: "Monthly Usage {unit}"
  unitLabels:
    kWh: kWh
    kW: kW
    ton_hours: Ton-Hours
    tons: Tons
    klb: klb
    lb_per_hour: lb/h
    kgal: kgal
    therms: Therms
    degF: degF
    pct: pct
    mph: mph
    state: State
    Reading: Reading
  intervalLabels:
    5: 5m
    15: 15m
    60: 60m
    1440: daily
    43200: route
  # Register + usage pairs are one EEM relationship; the usage point is created
  # by the register point's setting, never as an unrelated second point.
  registerUsageReasonText: Usage from register difference

