    companiesUsingProvider: [northlake_university, cedar_row_apartments, northlake_thermal_plant]
  - id: sierra_gas_utility
    displayName: Sierra Gas Utility
    commoditySetup: [natural_gas]
    rateSchedules: [SGU-GN-1, SGU-GL-1]
    companiesUsingProvider: [northlake_university, cedar_row_apartments, northlake_thermal_plant]
  - id: river_city_utilities
    displayName: River City Utilities
    commoditySetup: [water, sewer, stormwater, irrigation, fire_service]
    rateSchedules: [RCU-W-TIER, RCU-S-VOL, RCU-SW-ERU, RCU-IRR, RCU-FIRE]
