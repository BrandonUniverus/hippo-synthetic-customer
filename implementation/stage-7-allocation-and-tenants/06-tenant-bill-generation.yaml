# Stage 7, step 6: two screens that finish the tenant-billing story. Database Administrator's Tenant Rebill tab
# (Nodes > meter node > Tenant Rebill) assigns each Town Center tenant meter its rate and its Bill Generation
# type and schedule. The web Bill Allocation Configuration screen (same screen as file 04, method 2 again) then
# holds Cedar Row's residential configs. Rewritten 2026-11-10: the rates are Stage 7's own (file 09), the tenants
# have the provider, measure type and points the tab needs (file 02), and Cedar Row's rate rows are gone.
stage: 7
step: 6
title: Tenant bill generation types and Cedar Row residential allocation
app: Database Administrator (records) + Web (cedarRowAllocationConfigs)
screen: Nodes > meter node > Tenant Rebill tab; "#/reporting/BillAllocationConfiguration"
source:
- generators/documents/sources/implementation/dream-customer/phase4-tenant-rebilling-spec.md
- documents/guides/tenant-and-lease-roster.pdf
- data/scenarios/demo-university-v1.yaml
- 09-town-center-tenant-rates.yaml
- 10-town-center-data-and-bills.yaml
notes:
- 'Tenant Rebill tab fields (src/Apps/EEMSuite.Apps.DatabaseAdministrator/Views/Controls/TenantRebillView.xaml): the Bill Scenarios
  sub-tab''s Rate Configuration grid has Rate, Start Date, End Date and a Bill checkbox whose backing field is EnableBillReconcilliation
  (the product''s own spelling); its Point Assignment grid excludes points from rebilling. The Bill Generation sub-tab''s grid has Assigned
  Rates, Fiscal Start, Fiscal End, Schedule, Status (the generation type), Available % and Offset. Status values are the 4 dbo.BillGenerationType
  rows: 1 Off, 2 Manual, 3 Auto, 4 Auto w/ Auto Regen. The Bill Generation row is backed by dbo.UtilityMeterRatesBillGen, one row per
  meter per Bill Scenario.'
- 'WHY THE TENANT METERS COULD NOT TAKE A RATE, and what changed (confirmed in the product, 2026-11-10). The Tenant Rebill tab lists
  the rates of the METER''S PROVIDER whose measure type is the METER''S measure type (TenantRebillViewModel.ChangeHierarchyIDAsync passes
  node.MeterInfo.ProviderID and MeasureType.Id; UpdateAvailableRates filters on MeasureTypeId; an empty list shows ShowNoProviderRatesMessage).
  UtilityRateMeterAssignment_Save then refuses a rate whose measure type differs from Meter.MT_MeasureTypeID (''Rate measure type must
  match meter measure type!''). UtilityGenerationConfig_Save refuses a Bill Generation row on a meter with no child node (''No interval
  points assigned to meter!'', source Interval). The tenant meters of the earlier file 02 had no measure type, no provider (the provider
  is copied from the billing account, Meter_Save, and the Add Billing Account dialog will not save an account without one) and, for
  most, no points. File 02 now gives every Town Center meter Measure Type Electricity and a Valley Electric District account, and the
  four tenants this file generates for carry the points: Anchor Store kWh and kW, Food Court, In-line Shop 1 and In-line Shop 2 kWh.'
- 'Per tenant, what each generation path needs: a Utility Provider (through the billing account) and Measure Type Electricity on the
  meter; one or more child points of the right kind (kWh for TC-FLAT-GS, kWh and kW for TC-STEP-DEMAND) with data for the whole period
  at Available % 100 (file 10); a Rate Configuration row whose Start Date is on or before the first period; a company administrator
  to save the Bill Generation row (the proc refuses anyone else); and for Manual, a user with Bill Entry Web at level 3 (tc_company_admins,
  file 01) to press Create on Generated Bills.'
- Generation windows are 2026-01 only (Fiscal Start and End both 2026-1), on purpose. Mall-Main's method 1 configs allocate bills to
  these same tenants for 2024 and 2025 (file 04), and a generated bill for the same period would be a second bill on the account. 2026
  is the year with no method 1 window, so the Off, Manual, Auto and Auto w/ Auto Regen tenants show their behaviour without double billing.
  Anchor Store's Actual rate row starts 2024-01-01, for the reconciliation of file 07; its generation stays Off.
- 'Anchor Store''s Bill checkbox is ticked. UtilityRateMeterAssignment_Save then (a) copies the rate onto the company''s Bill Meter
  Reconciliation scenario (file 01 adds it to Used) and (b) saves a Bill Generation row on that scenario by itself: schedule BL, status
  4 (Auto w/ Auto Regen), data source Interval, from the rate''s start period, no end. Nothing is typed for that second row; it is the
  reconciliation of file 07. Only an Actual-scenario row can tick Bill, and the other scenarios in the Rate Configuration scenario picker
  exclude the reconciliation one on purpose.'
- 'Cedar Row: Valley Electric bills Cedar Row A/B Electric Master and River City bills Cedar Row A/B Water Master; no resident is billed
  directly (tenant-and-lease-roster.pdf). The earlier version of this file assigned NL-RES-Tiered and NL-MULTI-Commodity to the four
  masters. They are gone: the masters keep the real tariffs Stage 4 assigns (VED-TOU-GS on the electric masters, RCU-W-TIER and RCU-S-VOL
  on the water masters, 06-rate-assignments.yaml); a meter prices on one rate at a time; allocation of the master''s bill needs no rate
  (it splits dollars already billed); and a Bill checkbox on a Cedar Row master would need the Reconciliation scenario on a company
  that uses Actual only. The four allocation configs below stay.'
- CEDAR ROW IS NOT ENTERABLE AS WRITTEN, and does nothing if it were. (1) Every apartment submeter in Stage 2 is an owned meter with
  no billing account, and BillAllocationEligibleMeters_Get refuses a candidate with no billing account (error 3, errorAllocatedMeterDoesNotHaveBillingAccount),
  so Add Allocated Meters offers none of the 248 rows; Stage 2 must give each of the 124 apartments an account (and a Bill Allocation
  entry type) per commodity, the Cedar Row accounts not being required by anything else. (2) Method 2 has no calculator (file 04 notes),
  so no allocated bill would follow. The configs are kept as the intended shape and for the day both are fixed; checks.sql reports them
  as configs and does not expect a bill.
- 'House submeters (Cedar Row A/B Electric House, Cedar Row A/B Water House) are not candidates: their usage is recovered as overhead
  per the Phase 4 spec. Overhead % = 2 on every apartment row (type the same value into every row''s Overhead % column). Sewer is billed
  on the water submeter''s usage capped at each apartment''s winter average; that cap is a rate-engine rule (Phase 2), not a Bill Allocation
  Configuration field. Cedar Row C (48 water submeters plus house and laundry, opened 2025-09-01, Stage 2) has no config here.'
- Records marked kind 'Cedar Row allocation config (#/reporting/BillAllocationConfiguration)' were entered on that other editor; they
  sit in this file because they belong to this step.
