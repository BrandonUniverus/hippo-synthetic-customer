# Stage 7, step 6: two screens that finish the tenant-billing story. Database Administrator's Tenant Rebill
# tab (Nodes > meter node > Tenant Rebill) assigns each Town Center tenant meter its rate, its Bill
# Generation type/schedule, and the reconciliation flag. The web Bill Allocation Configuration screen (same
# screen as file 04, method 2 again) then does Cedar Row's residential case: 124 apartments, two commodities,
# no resident ever sees a utility bill. Two editors in one file because they are one story — file 04 already
# covers Town Center's 7-method showcase, and Cedar Row's 248 detail rows are the "big repetitive list" this
# stage's version of Stage 1's Cedar Row submeter count, so it gets its own file rather than bloating file 04.
stage: 7
step: 6
title: Tenant bill generation types and Cedar Row residential allocation
app: Database Administrator (records) + Web (cedarRowAllocationConfigs)
screen: Nodes > meter node > Tenant Rebill tab; "#/reporting/BillAllocationConfiguration"
source:
- generators/documents/sources/implementation/dream-customer/phase4-tenant-rebilling-spec.md
- documents/guides/tenant-and-lease-roster.pdf
- data/scenarios/demo-university-v1.yaml
notes:
- 'OPEN since the Stage 4 rework of 2026-11-09: the three rates this file assigns (NL-STEP-Demand, NL-RES-Tiered and
  NL-MULTI-Commodity) are no longer in Stage 4''s 05-rates.yaml. The first two moved, unchanged, to
  stage-4-rates/08-rate-lab.yaml, which is not ready to enter; NL-MULTI-Commodity was never defined anywhere. The
  tenant rates need a home (the Rate Lab, or rates of Town Center''s own) before this step can be entered.'
- 'Tenant Rebill tab fields (src/Apps/EEMSuite.Apps.DatabaseAdministrator/Views/Controls/TenantRebillView.xaml):
  the Bill Scenarios sub-tab''s Rate Configuration grid has Rate, Start Date, End Date and a Bill checkbox whose
  backing field is EnableBillReconcilliation (note the product''s own spelling); its Point Assignment grid excludes
  points from rebilling. The Bill Generation sub-tab''s grid has Assigned Rates, Fiscal Start, Fiscal End, Schedule,
  Status (the generation type), Available % and Offset. Status values are the 4 dbo.BillGenerationType rows: 1 Off,
  2 Manual, 3 Auto, 4 Auto w/ Auto Regen (confirmed against both the Northlake and reference databases). The Bill
  Generation grid''s row is backed by dbo.UtilityMeterRatesBillGen (MetaWorldID, BillScenarioID, FiscalStart, FiscalEnd,
  BillGenStatusID, BillGenReconDataSourceID, BillGenScheduleCode, DataThreshold, OffsetDays — confirmed by column),
  one row per meter per Bill Scenario; the reconciliation source (file 07) is a column on this same row, not a separate
  screen.'
- Every rate below must exist first (Stage 2/Rate Modeler); NL-STEP-Demand is purpose-built for a Town Center anchor
  per data/eem/northlake-rates-v1.yaml ("fires type 210 + 600"). Assign it under both the Actual (-1) scenario and
  Budget (file 01) per Phase 4 spec section D's "assign under both Actual and a non-actual scenario."
- 'Cedar Row: Valley Electric bills Cedar Row A/B Electric Master and River City bills Cedar Row A/B Water Master;
  no resident is ever billed directly (tenant-and-lease-roster.pdf). The 4 configs below are Method 2, Fully Submetered,
  same screen and mechanic as file 04''s Tower-Main config, just at real scale: every apartment''s own submeter
  (data/scenarios/demo-university-v1.yaml, SYN-SUB-E-* / SYN-SUB-W-*) is a candidate; the engine computes each apartment''s
  Allocation % from its own interval/route consumption when Process Meter Allocations runs (file 07), so no percentage
  is typed for any of the 248 rows below.'
- House submeters (Cedar Row A/B Electric House, Cedar Row A/B Water House) are not candidates — their usage is
  recovered as overhead per the Phase 4 spec, not charged to one apartment. This file sets Overhead % = 2 uniformly
  on every apartment row rather than repeating it 248 times below; type the same value into every row's Overhead
  % column. The real percentage should be recomputed each period from the house submeter's actual reading against
  the master (a later refinement, not this stage's job).
- Sewer is billed on the water submeter's usage capped at each apartment's winter average; that cap is a rate-engine
  rule (Phase 2), not a Bill Allocation Configuration field, so it is not modeled on this screen.
- 'Reconciliation: each Cedar Row master meter''s Tenant Rebill tab gets its real utility rate (already assigned
  by whichever stage enters Cedar Row''s rates) with Bill (EnableBillReconcilliation) turned on, so rp_BillReconciliation
  can compare the submetered total against the master bill (file 07).'
- Records marked kind 'Cedar Row allocation config (#/reporting/BillAllocationConfiguration)' were entered on that
  other editor; they sit in this file because they belong to this step.
