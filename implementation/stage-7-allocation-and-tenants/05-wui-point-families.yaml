# Stage 7, step 5: WUI point families (Web, Master Point Configuration modal). Reached from
# #/reporting/PointFamilyConfiguration (rp_WUIPointFamilyConfig), which lists every point already
# configured as a WUI master; its row action opens the modal (reportActionCapabilities.ts,
# "masterPointConfiguration.open") where children are added. This is point-level allocation (splitting a
# MASTER POINT's use across child points, dbo.PtAllocationConfig), a different feature from Bill Allocation
# (file 04, which splits a bill's dollar cost across meters) even though both live under Tenant Rebilling.
# Unlike methods 2 to 7 of Bill Allocation, this one has a working engine: the expected values are in file 10.
stage: 7
step: 5
title: WUI point families and fail-reason fixtures
app: Web
screen: '#/reporting/PointFamilyConfiguration -> Master Point Configuration modal'
source:
- generators/documents/sources/implementation/dream-customer/phase4-tenant-rebilling-spec.md
- data/eem/northlake-town-center-v1.yaml
notes:
- Grid columns on the modal are Child Point Name, Start Date, End Date and Allocation Method (src/Web/EEMSuite.Web/frontend/src/scripts/hippo/views/viewMasterPointConfiguration.ts);
  dropdown options come from api/TenantRebilling/GetPointAllocationMethods, i.e. dbo.PtAllocationMethod.
- 'PRODUCT FINDING: dbo.PtAllocationMethod on EEMSuite_Northlake has only 2 rows today (1 Weighted Use Index, 2 Measured Use); the reference
  EEMSuite database also carries a 3rd, Percentage Based, added 2019-08-14. Install that row before this step or the method-3 fixture
  below (percentageBasedIgnored) cannot be selected.'
- INDEX VALUES HAVE A SCREEN (this corrects the earlier version of this note, which said none exists). The Web report WUI Point Use
  History (rp_WUIPointUseHistory) lists every Weighted Use Index child point with its Allocation_Name, Allocation_Unit, Allocation_Value,
  Allocation_Fiscal Start and Allocation_Fiscal End, and its create and edit actions open the custom view CustomWUIAdd (src/Web/EEMSuite.Web/Views/Custom/CustomWUIAdd.cshtml)
  with three inputs, Unit, Fiscal Start and Index Value, which post to WUIPtAllocationIndex_Save. The units on offer are the ones whose
  class is EnergyUseIndex or VolumeUseIndex (WUIAllocationUnits_Get). The index is stored from the first day of the Fiscal Start period
  and a later period reads the latest earlier index (WUIPtAllocUseIndex_Get), so one entry at 2024-01 serves the 2024-01 to 2024-03
  runs of file 07. Floor area is the node's own Area tab (file 02).
- A child with no index fails NoUseIndex. The Estimated kWh children below each get an index from the table in their record; their values
  and the allocated results are in file 10.
- 'The Estimated kWh children of the Mall-Main family are under Shop 3, Shop 4 and Common Area (file 02), not under Anchor Store and
  Food Court as an earlier version had it: Anchor Store and Food Court now carry measured data and a rate (file 06), and a meter''s
  generation prices every energy point under it, so an estimated point beside a measured one would be billed twice.'
- 'Fixture points are new, dedicated to this exercise, under a new WUI Fixture Meter under Market Hall rather than retrofitted onto
  real tenant spaces, so the deliberate failures cannot be mistaken for a real data problem. KNOWN PROBLEM, not fixed here: the fixture
  nodes (WUI Fixture Meter, its six points, the master point, Fixture Chain Mid and Fixture Chain Leaf) are in no hierarchy file, and
  ''No Area'' needs the node''s Area empty while ''No Rate'' and ''Chain Leaf'' need a valid index and area on the same meter, which
  one Area value cannot be. Each fixture needs its own meter.'
- InsufficientIntervalData (reason 1) needs a real gap in a Measured Use child's imported interval data, Stage 3's concern. Stage 3
  has no Town Center node (file 10 lists what it must supply), so that gap does not exist yet either.
