# Stage 7, step 2: Northlake Town Center hierarchy (Database Administrator > Nodes tree). One record per
# node, in tree order: Property > Buildings > Meters > Points, then Billing Accounts (the Add Billing Account
# dialog opened from a meter). Shape follows Stage 2's node conventions (Definitions/Address/Area/Meter
# Definitions/Point Definitions pages) — Stage 2 is being written in parallel; its own YAML is not committed
# yet, so meters and points here are new Town Center nodes only and do not depend on Stage 2's IDs. Every
# tenant space is a real Meter-level node even where it has no physical device, because Bill Allocation
# details point at a Metaworld ID with a Billing Account, not at a bare tenant name.
stage: 7
step: 2
title: Town Center site, buildings, meters, points and billing accounts
app: Database Administrator
screen: Nodes > (Property / Location / Meter / Point) node > Definitions, Address, Area, Meter Definitions, Point
  Definitions; Add Billing Account dialog from a Meter node
source:
- data/eem/northlake-town-center-v1.yaml
- documents/guides/tenant-and-lease-roster.pdf
- generators/documents/sources/implementation/dream-customer/phase4-tenant-rebilling-spec.md
notes:
- 'Order inside the tree: add the Property node under Northlake Town Center (Stage 7 step 1), save, then each Building
  (Location), save, then each Meter under its building, save, then each Meter''s Point. A Billing Account must exist
  before a meter can be attached to one, so run the Add Billing Account dialog first for each row in billingAccounts
  below, then set BA_BillingAccountID on the matching meter.'
- 'Two meter kinds appear here: a master meter (real utility interval + monthly bill from Valley Electric District,
  Type Code 1 AP Upload Only, Bill Type Importer) and an allocation meter (a tenant space with no physical device
  — no Point Definitions page needed — that exists only to hold a Billing Account, Bill Type Allocation, so it can
  appear as a row in a Bill Allocation Configuration Detail grid). Floor 1-4, Bldg A/B/C and Substation 1/2 are
  a third kind: an owned submeter with a real interval point but no utility bill of its own (Bill Type Allocation,
  no provider), matching Cedar Row''s owned-submeter pattern from Stage 2.'
- Vendor numbers for Town Center's four Valley Electric District accounts are assigned on the Utility Providers
  > Associated Companies page (Stage 1 step 2), e.g. VED-3005-TC through VED-3008-TC.
- Floor area values (Area tab) are entered in SqFt on every tenant-space node used by the Building Areas method
  (file 04) so that method has something to divide by; other tenant spaces get an area value too so the WUI fail-reason
  fixture (file 05) has a real "has area" baseline to contrast against.
- All synthetic meter numbers are new and assumed, in Valley Electric District's existing format (SYN-VED-M-#######,
  see data/providers/valley-electric-district.yaml) since Town Center buys its electricity from the same provider
  as the rest of the portfolio.
- Records marked kind 'Billing account (Utility Accountant tab, Stage 2 shape)' were entered on that other editor;
  they sit in this file because they belong to this step.
