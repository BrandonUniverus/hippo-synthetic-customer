# Stage 7, step 2: Northlake Town Center hierarchy (Database Administrator > Nodes tree). One record per
# node, in tree order: Property > Buildings > Meters > Points, then Billing Accounts (the Add Billing Account
# dialog opened from a meter). Shape follows Stage 2's node conventions (Definitions/Address/Area/Meter
# Definitions/Point Definitions pages). Every tenant space is a real Meter-level node even where it has no
# physical device, because Bill Allocation details point at a node with a billing account, not at a bare tenant
# name; the notes below say what each kind of meter needs to take part in allocation, rates and generation.
stage: 7
step: 2
title: Town Center site, buildings, meters, points and billing accounts
app: Database Administrator
screen: Nodes > (Property / Location / Meter / Point) node > Definitions, Address, Area, Meter Definitions, Point Definitions; Add Billing
  Account dialog from a Meter node
source:
- data/eem/northlake-town-center-v1.yaml
- documents/guides/tenant-and-lease-roster.pdf
- generators/documents/sources/implementation/dream-customer/phase4-tenant-rebilling-spec.md
notes:
- 'Order inside the tree: add the Property node under Northlake Town Center (Stage 7 step 1), save, then each Building (Location), save,
  then each Meter under its building, save, then each Meter''s Point. A Billing Account must exist before a meter can be attached to
  one, so run the Add Billing Account dialog first for each row in billingAccounts below, then set BA_BillingAccountID on the matching
  meter.'
- 'Every Town Center meter needs a Measure Type (Electricity) and a billing account that has a Utility Provider, and the reason is in
  the product. The Add Billing Account dialog refuses an account with no provider (AddBillingAccountViewModel.ConfirmCommand: select
  a utility), and Meter_Save copies the account''s ProviderID onto the node (MetaWorld_TBL.ProviderID), so a meter''s Utility Provider
  is whatever its account carries (MeterDefinitionViewModel: the account brings its provider). Both matter. (1) The Tenant Rebill rate
  list is the meter''s provider''s rates filtered by the meter''s measure type (TenantRebillViewModel.ChangeHierarchyIDAsync and UpdateAvailableRates),
  and UtilityRateMeterAssignment_Save refuses a rate whose measure type is not the meter''s. (2) The Add Allocated Meters picker rejects
  a candidate with another measure type than the master (error 2), no billing account (3) or another currency (5) (BillAllocationEligibleMeters_Get.sql).
  The earlier version of this file left the 18 tenant, floor, building and aggregate meters with neither, which made each of them unusable
  for rates, generation and allocation.'
- 'All 22 accounts are therefore Valley Electric District accounts in US Dollar (# assumed: the landlord resells Valley Electric power,
  which is also what Stage 12 scenario 4 does with its tenant rate). The four masters are Bill Entry accounts (Town Center has no Bill
  Importer source, and the master bills of file 10 are keyed on Bill Entry Web); the four tenants that file 06 generates bills for are
  Bill Generation accounts; the rest receive allocated bills (Bill Allocation). Neither engine reads the account''s Bill Entry Type
  (UtilityGenBill_Create and BillAlloc_CreateBill do not), it is classification only, so a Bill Generation tenant can also receive an
  allocated bill.'
- Meter Number is optional (Meter.SM_Code is NULL-able), so the allocation-only tenant meters carry none. Masters and submeters keep
  their SYN-VED-M-30xxxxx numbers, in Valley Electric District's existing format.
- 'Points are Analog interval points in the shape of Stage 2 (Reading Type Analog, Unit KilowattHours - (kWh) or Kilowatt - (kW), Archive
  Interval 60). Two kinds exist: the measured kWh and kW points that Stage 3 loads (file 10 lists the values) and the four Estimated
  kWh points that Weighted Use Index writes into (file 05; they get no imported data). The Estimated points sit under Shop 3, Shop 4,
  Common Area and Landlord/House, none of which generates a bill, so a rate never prices an estimated and a measured kWh point on one
  meter twice (generation prices every energy point under the meter). 26 points in all.'
- Floor area (Area tab, SqFt) is on every tenant space that Building Areas (file 04) and Weighted Use Index (file 05) read.
- 'Vendor numbers for Town Center''s Valley Electric District accounts are assigned on the Utility Providers > Associated Companies
  page (Stage 1 step 2), e.g. VED-3005-TC (# assumed): one vendor number for the company covers all 22 accounts, since they are one
  company''s accounts with one provider.'
- Records marked kind 'Billing account (Utility Accountant tab, Stage 2 shape)' were entered on that other editor; they sit in this
  file because they belong to this step. Account Number, Description, Currency Unit, Utility Provider, Bill Service Type, Bill Entry
  Type and Bill Invoice Template are the Definitions fields of Stage 2's accounts; the Service Address, Account Address and Account
  Contact pages are left blank (nothing reads them here).
