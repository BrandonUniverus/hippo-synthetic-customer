- key: tc_market_main_method1_separate
  installed:
    billAllocationConfigId: null
  Master Meter: Mall-Main
  Commodity: Electric
  Method: Fixed Amount and %
  Effective From:
    Fiscal Year Start: 2024
    Fiscal Period Start: 1
    Fiscal Year End: 2024
    Fiscal Period End: 12
  Combine Overhead: false
  Add Allocated Meters:
  - order: 1
    meter: Anchor Store
    Allocation Amount: 2000
    Fixed: true
    Overhead %: 2
  - order: 2
    meter: Food Court
    Allocation %: 15
    Overhead %: 2
  - order: 3
    meter: In-line Shop 1
    Allocation %: 8
    Overhead %: 2
  - order: 4
    meter: In-line Shop 2
    Allocation %: 8
    Overhead %: 2
  - order: 5
    meter: In-line Shop 3
    Allocation %: 8
    Overhead %: 2
  - order: 6
    meter: In-line Shop 4
    Allocation %: 8
    Overhead %: 2
  - order: 7
    meter: Common Area
    Allocation %: 53
    Overhead %: 2
  notes: 'Percent rows (excluding Anchor''s fixed amount) total 15+8+8+8+8+53 = 100, satisfying RequiredAllocationPercentTotal. Overhead
    is its own line per tenant (Combine Overhead off). With the 2024-01 master bill of file 10 (30,000.00) each tenant is billed its
    share plus 2%: Anchor Store 2,040.00, Food Court 4,284.00, Shops 1 to 4 2,284.80 each, Common Area 15,136.80, 30,600.00 in all.'
  expect:
    allocated base (no overhead): 30000.0
    overhead: 600.0
    tenant bills: 30600.0
