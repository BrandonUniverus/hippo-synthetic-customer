# Stage 7, step 4: one Bill Allocation Configuration per method, methods 1-7, on Town Center's four master
# meters from file 02 (Web, #/reporting/BillAllocationConfiguration). Field labels below are the screen's own
# (Master Meter, Commodity, Method, Effective From, Combine Overhead, Add Allocated Meters, the grid's
# Allocation %/Allocation Amount/Fixed/Overhead % /Overhead Amount columns), verified in
# src/Web/EEMSuite.Web/frontend/src/scripts/hippo/reports/billAllocationConfiguration.ts.
stage: 7
step: 4
title: Bill Allocation Configuration, one config per method
app: Web
screen: "#/reporting/BillAllocationConfiguration"
source:
- documents/guides/tenant-and-lease-roster.pdf
- generators/documents/sources/implementation/dream-customer/phase4-tenant-rebilling-spec.md
- generators/documents/sources/implementation/dream-customer/product-gap-backlog.md
notes:
- 'PRODUCT FINDING, verify before typing: the installed EEMSuite_Northlake database''s dbo.BillAllocationMethod
  table has only method 1 (Fixed Amount and %) seeded today; methods 2-7 exist in the reference EEMSuite demo
  database (Fully Submetered Space, Partially Submetered Space, Building Areas, Partially Submetered w/
  Coincident Demand, Bill Aggregation, Metered Substations From Master Bills — confirmed by querying both
  databases directly) but are not yet loaded on this instance, so the Method dropdown on this screen will
  show only one choice until they are. Per entry-path-and-gaps.md this catalog is product install data, not
  customer data, from the same class of ".bak, not in git" lookups as PtAllocationMethod — install the
  missing rows before this step, do not type around it with SQL.'
- 'Tenant & Lease Roster (documents/guides/tenant-and-lease-roster.pdf) describes Market Hall and Office
  Tower each with ONE table covering multiple cost-split rules; the product applies one method per master per
  fiscal window, so this file re-maps the roster''s language onto separate, non-overlapping windows on the
  same master meter — exactly what the roster''s own preamble asks for ("please map these to the appropriate
  allocation method").'
- 'Methods 2, 3, 4, 5 and 7 compute their Allocation % automatically from each candidate meter''s interval
  consumption (2, 3, 5), floor area (4) or usage share (7) when Process Meter Allocations runs (file 07); only
  method 1''s rows need Allocation Amount/Allocation %/Overhead typed by hand. Add each candidate through
  Add Allocated Meters > Eligible Meters and leave its Allocation % at 0 unless noted otherwise.'
- Order inside the editor is Master Meter, Commodity, Method and Effective From first, save, then add
  candidates through Add Allocated Meters, then Combine Overhead, then Balance to 100% if the percentages
  do not already sum to the method's RequiredAllocationPercentTotal (100 for method 1).
