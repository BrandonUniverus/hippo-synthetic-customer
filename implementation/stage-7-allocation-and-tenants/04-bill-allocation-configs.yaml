# Stage 7, step 4: one Bill Allocation Configuration per method, methods 1-7, on Town Center's four master
# meters from file 02 (Web, #/reporting/BillAllocationConfiguration). Field labels below are the screen's own
# (Master Meter, Commodity, Method, Effective From, Combine Overhead, Add Allocated Meters, the grid's
# Allocation %/Allocation Amount/Fixed/Overhead % /Overhead Amount columns), verified in
# src/Web/EEMSuite.Web/frontend/src/scripts/hippo/reports/billAllocationConfiguration.ts.
stage: 7
step: 4
title: Bill Allocation Configuration, one config per method
app: Web
screen: '#/reporting/BillAllocationConfiguration'
source:
- documents/guides/tenant-and-lease-roster.pdf
- generators/documents/sources/implementation/dream-customer/phase4-tenant-rebilling-spec.md
- generators/documents/sources/implementation/dream-customer/product-gap-backlog.md
notes:
- 'WHAT THE STOCK ENGINE DOES (read in the product, 2026-11-10). Only method 1 (Fixed Amount and %) and method 6 (Bill Aggregation)
  compute anything. BillAlloc_ProcessBills selects every master bill whose config method uses the default procedure, but BillAlloc_ProcessBillItems
  then goes on only if the master meter has a METHOD 1 config for the bill''s period (two guards, ''goto AllocationAbort'' otherwise),
  and BillAlloc_ProcessAllocatedItems never branches on the method: it splits by the typed Allocation % and Allocation Amount. Methods
  2, 3, 4, 5 and 7 have no calculator (src/Documentation/TODO/ADR-015-Versioned-Bill-Allocation-Handlers.md, ''Current core behavior'':
  ''Distinct stock calculator: None''). So the five configs below that use them can be ENTERED, and a master bill in their window produces
  NO allocated bill. The earlier text of this file (''the engine computes each share from interval consumption when Process Meter Allocations
  runs'') described a feature the product does not have; Process Meter Allocations is the WUI run of file 05 and does not touch bill
  allocation.'
- 'What each config is for, therefore: methods 1 and 6 give known dollar values (file 10 computes them: the master bill, each tenant''s
  allocated amount, the overhead, and the Property Total aggregate). Methods 2, 3, 4, 5 and 7 are entered to prove the configuration
  screen takes them and to hold a place for the day the calculators exist; file 10 keeps a reference table of what a plain reading of
  each method would allocate (use share, remainder, area share), marked NOT expected today, and checks.sql asserts today''s behaviour:
  the master bill exists and no BillAllocationMap row exists for it. When a calculator ships, that assertion fails and file 10''s reference
  table becomes the expectation.'
- 'PRODUCT FINDING: dbo.BillAllocationMethod on EEMSuite_Northlake may hold only method 1 (Fixed Amount and %). Methods 2-7 exist in
  the reference EEMSuite demo database (Fully Submetered Space, Partially Submetered Space, Building Areas, Partially Submetered w/
  Coincident Demand, Bill Aggregation, Metered Substations From Master Bills) but there is no seed for them under Database/EEMSuite
  (no Script or Migration inserts them), so the Method list may show one choice until the rows are installed. They are product install
  data, not customer data: install them before this step, do not type around it with SQL. Method 6 also needs AllocationType ''Aggregation''
  on its row (BillAgg_GetBills filters on it).'
- 'Every candidate must pass BillAllocationEligibleMeters_Get: the master''s measure type (Electricity, file 02), a billing account,
  the master''s currency (US Dollar) and the same company calendar; a method 1 candidate also cannot be a method 1 master or sit in
  another method 1 config whose window overlaps (the FY2024 and FY2025 Mall-Main configs do not overlap).'
- Order inside the editor is Master Meter, Commodity, Method and Effective From first, save, then add candidates through Add Allocated
  Meters, then Combine Overhead, then Balance to 100% if the percentages do not already sum to the method's RequiredAllocationPercentTotal
  (100 for method 1).
- 'Overhead % is ADDED on top of the allocated amount, not carved out of it (BillAlloc_ProcessOverhead: a tenant''s overhead is Overhead
  % of its allocated item, rounded to the cent, written as an extra line in the commodity named ''Electricity Overhead'', or folded
  into the tenant''s own items when Combine Overhead is on). So a tenant''s bill is its share plus 2%, the shares add up to the master
  bill, and the overhead adds 2% of the master bill to what the tenants owe in all. The earlier ''every allocated child sums to its
  parent'' reading was wrong whenever Overhead % is above 0 (file 10 and checks.sql separate the two).'
- 'Method 6 is the other way round. BillAgg_GetBills multiplies each feeder item by the row''s Allocation % divided by 100, so a method
  6 row left at 0 aggregates nothing: every row below is typed 100. An aggregate is written for a period when at least one feeder has
  a bill item in it (missing feeders do not block it, because the proc defaults to ForceCalc ''y'').'
