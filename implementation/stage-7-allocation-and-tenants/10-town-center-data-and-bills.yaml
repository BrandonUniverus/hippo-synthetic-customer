  How it splits: 'BillAlloc_ProcessAllocatedItems, per master line: the fixed row first, Anchor Store 2,000.00 spread over the lines
    in proportion to each (1,600.00 of the energy line, 400.00 of the demand line); then each percent row takes its percent of what
    is left after the fixed amount (28,000.00: 22,400.00 energy and 5,600.00 demand), so Food Court 15% is 3,360.00 + 840.00. Overhead
    is 2% of each tenant line, rounded to the cent, added on top (BillAlloc_ProcessOverhead). Each of the seven tenants gets one allocated
    bill on its own account.'
