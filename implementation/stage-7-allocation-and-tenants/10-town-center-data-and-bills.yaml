  notes: 'Seven bills, one line per commodity, each line carrying its meter (Bill Items have a Meter column; the allocation reads the
    line''s meter, BillAlloc_ProcessBills requires a bill item whose meter is the config''s master). The amounts are round figures (#
    assumed): kWh x 0.12 for the Tower, Annex and Substation lines, and 24,000.00 + 6,000.00 for Mall-Main (the unit prices are not
    tied to a tariff because nothing rates these meters). Bill Entry takes the period dates as typed; the months are calendar months,
    which is the Town Center fiscal period (file 01). 2026-01 is the month of file 06''s generation and carries the same Mall-Main bill
    so Building Areas (method 4, FY2026 periods 1 to 6) has a bill to refuse.'
