# Stage 7, step 10: the smallest data set that gives every Town Center allocation, generation, WUI and reconciliation
# case a known value. Everything is constant, so every number is a product of two others and was checked by a
# script (every sum below adds to its parent). Read this file with 04 (the configs), 05 (WUI), 06 (rates and
# generation) and 07 (runs). Nothing in it is a screen to type into except the master bills (Bill Entry Web); the
# interval values come from Stage 3 (see tc_interval_data).
stage: 7
step: 10
title: Town Center data, master bills and expected values
app: Web SPA (Bill Entry); Stage 3 (interval data)
screen: '#/BillEntry; Stage 3 gateway'
source:
- 04-bill-allocation-configs.yaml
- 05-wui-point-families.yaml
- 06-tenant-bill-generation.yaml
- 09-town-center-tenant-rates.yaml
notes:
- 'Why this file exists. Town Center had no interval data, no bills and no source file, so no allocation, generation, WUI or reconciliation
  case had a value to compare with. This file is that source: the loads of the points, the master bills to key, and the allocated amounts
  each case must produce. The tables are scripted: each tenant row is the engine''s own arithmetic (read in BillAlloc_ProcessAllocatedItems
  and BillAlloc_ProcessOverhead), every column adds to the master and the overhead to 2% of it.'
- 'Order: file 01 and 02 (company, hierarchy), 09 (rates), Stage 3 supplies the interval data, then the master bills here, then 03 to
  08.'
records:
- key: tc_interval_data
  What: 'Hourly values for 22 of file 02''s points. Each point holds one constant value for every hour from 2024-01-01 00:00 to 2026-02-01
    00:00 (interval-end stamps, as Stage 3 stores them: a month is the stamps after 00:00 on the 1st up to and including 00:00 on the
    next 1st, the engine''s cut, UtilityRates_LoadData). The three proof months are the Januaries of 2024, 2025 and 2026, 744 hours
    each, so every monthly total is the hourly value times 744. A kW point holds the demand in kW for each hour; a kWh point the energy
    of that hour.'
