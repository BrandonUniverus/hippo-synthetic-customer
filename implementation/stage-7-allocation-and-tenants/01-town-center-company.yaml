# Stage 7, step 1: Northlake Town Center company (Database Administrator > Nodes > company node > Definitions
# tab, plus Users & Groups). Same shape as Stage 1's 01-companies.yaml and 04-groups.yaml/05-users.yaml: a
# company is a node, its Definitions tab pages unlock after the first save, and groups/users are separate
# editors under the company. Town Center is the Phase 4 mixed-use property: a new commercial company added
# after Stage 1's three (Northlake University 6, Cedar Row Apartments 3, Northlake Thermal Plant 5).
stage: 7
step: 1
title: Northlake Town Center company
app: Database Administrator
screen: Nodes > company node > Definitions tab; Users & Groups > Groups; Users & Groups > Users
source:
- data/eem/northlake-town-center-v1.yaml
- generators/documents/sources/implementation/dream-customer/phase4-tenant-rebilling-spec.md
- documents/guides/tenant-and-lease-roster.pdf
notes:
- Enter Definitions first (name, archive interval, time zone, country, alarm defaults) and save; Levels, Company
  Address, Company Contact and Bill Scenarios unlock after that first save, same order as Stage 1 step 1. Saving
  creates the Actual bill scenario and a 1990-2013 fiscal calendar on its own; leave both.
- Archive Interval 60 minutes and Pacific time match every other Northlake company so interval imports behave the
  same way across the portfolio.
- 'Levels: the four base types (Site, Location, Meter, Point) are fixed by the product. Town Center''s wording follows
  Cedar Row''s pattern (a single property, not a campus of sites) rather than Northlake University''s.'
- Company Address and Company Contact are invented for Town Center (assumed); no source names them, since neither
  tenant-and-lease-roster.pdf nor northlake-town-center-v1.yaml gives Town Center a street address or a staff contact.
- 'Bill Scenarios > Used adds two scenarios beyond Actual: Budget, so Step 4''s multi-component rate can be assigned
  under both Actual (-1) and a non-actual scenario per the Phase 4 spec section D; and Bill Meter Reconciliation
  (ScenarioTypeID 20, confirmed present in dbo.ScenarioType), which Step 7''s reconciliation fixture needs on the
  Anchor Store meter.'
- 'Town Center needs a vendor number with Valley Electric District once this company exists: go back to Database
  Administrator > Utility Providers > Valley Electric District > Associated Companies (Stage 1 step 2''s screen)
  and add Northlake Town Center with a new vendor number, e.g. VED-3005-TC # assumed. Not repeated here because
  it is Stage 1''s editor, not this stage''s.'
- 'Groups and users: the Phase 4 sources do not specify Town Center staff, so this file adds the minimum needed
  to operate the property (one admin group, one property manager) on Stage 1''s shapes, marked # assumed throughout.
  If the customer later supplies a real Town Center org chart, replace this record.'
- Records marked kind 'Group (Users & Groups > Groups, Stage 1 shape)' were entered on that other editor; they sit
  in this file because they belong to this step.
- Records marked kind 'User (Users & Groups > Users, Stage 1 shape)' were entered on that other editor; they sit
  in this file because they belong to this step.
