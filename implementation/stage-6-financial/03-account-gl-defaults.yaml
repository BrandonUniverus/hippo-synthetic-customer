# Stage 6, step 3: per-account GL and AP defaults (Utility Accountant tab > Billing Account > Definitions page,
# Associated G/L Accounts section; and the Bill Validation Tests page for account-scoped overrides, entered in
# Stage 5). Fields verified against BillAccountDefinitionsSectionView.xaml: Bill Service Type, Bill Entry Type,
# Liability Account, Default Expense Account. Accounts are Stage 2 keys, referenced here by synthetic number.
stage: 6
step: 3
title: Account GL defaults
app: Database Administrator
screen: Nodes > company node > Utility Accountant > billing account > Definitions
source:
- data/eem/northlake-ap-gl-v1.yaml
- generators/northlake_packet.py (account_setup, read only)
- documents/guides/chart-of-accounts-and-gl-guide.pdf
notes:
- 'Bill Service Type is Global_Type_Code Table_Code=''BA'', verified by direct query against
  EEMSuite_Northlake: 0 No AP Upload, 1 AP Upload Only, 2 Bill Payment. This is three values, not the AP/GL
  plan''s four (No Upload / AP / GL / AP and GL) - see the Stage 5 Findings. There is no GL-only or AP-and-GL
  option; GL coding is the Liability Account and Default Expense Account fields below, present on every account
  regardless of its Bill Service Type.'
- 'Bill Entry Type is Global_Status_Code ''BA2'': 0 Bill Entry, 1 Bill Importer, 2 Bill Generation, 3 Bill
  Allocation, 10 Other. RECONCILED 2026-11-10 with Stage 2 (01-billing-accounts.yaml), Stage 5 and the plan
  (data/eem/northlake-bill-entry-v1.yaml): Valley Electric and River City accounts are Bill Importer (1) in EVERY company, Cedar
  Row Apartments included (31 accounts: 14 + 17; the earlier version of this file made Cedar Row''s 10 manual, which is wrong:
  the plan, Stage 2 and the importer step say nora.chen imports them); Sierra Gas and Helios Solar accounts are Bill Entry (0), 13
  in all; the Thermal Plant''s six internal allocations are Bill Allocation (3); the Ridgeline transfer statement is Bill
  Generation (2), the one account whose bill EEM generates. Totals 31 + 13 + 6 + 1 = 51.'
- 'Liability Account is 2000-AP on every account in its own company''s chart, including the two negative
  controls below and Ridgeline''s GL-only transfer account - the AP/GL plan is explicit that the liability
  account is set "on every account, including the ones that never upload."'
- 'Default Expense Account is chosen by provider (generators/northlake_packet.py account_setup, read only):
  Valley Electric -> 5100-ELEC, Sierra Gas -> 5110-GAS, River City -> 5120-WATER, Northlake Thermal Plant ->
  5130-THERMAL (charged to the receiving company, Northlake University - see 01-gl-accounts.yaml), Helios Solar
  -> 5140-SOLAR, Ridgeline Wind -> 5150-WIND (charged to the Thermal Plant company, the only company it bills).
  All seven GL codes must already exist in that account''s own company''s chart (Step 1).'
- 'Bill Service Type, RECONCILED with Stage 2 and the plan (accountUploadFlags): AP Upload Only for every external utility
  account (Valley Electric, Sierra Gas, River City) and for the six Thermal Plant cost centers ("internal allocations post to
  the GL and settle between companies", the plan''s AP and GL); Bill Payment for the three Helios PPA accounts ("payment runs
  outside AP", the plan''s GL) and for Ridgeline''s transfer account (GL only); No AP Upload for River City''s Cedar Row B, the
  negative control that must never appear in an export (checked by `account_defaults` and `ap_export_run` in checks.sql).
  The earlier version of this file had the Thermal Plant on Bill Payment and Helios on AP Upload Only, the reverse of Stage 2;
  Stage 2 is what the screen holds, so this file follows it. A Helios account is Bill Payment, which is also what makes Pay
  Amount appear on its bills (Stage 5, header_field_bills). Ridgeline''s transfer account is the one that must stay out of every
  AP file, checked by `ridgeline_gl_only` in checks.sql.'
- 'Added 2026-10-01 (Ridgeline Wind): two accounts join the Thermal Plant company. SYN-VED-A-0010014 (Ridgeline
  Substation / VED) is the Valley Electric generator account. It takes the Valley Electric defaults below (AP
  Upload Only, Bill Importer, 2000-AP, 5100-ELEC); in the customer''s terms it is "AP and GL", the AP/GL plan''s
  value for every account the plant company holds. SYN-RWL-G-0000001 (Ridgeline Turbine Field / RWL) is "GL
  only": the chart-of-accounts guide calls the transfer statement "a journal between the plant and its own wind
  company", with no payment leaving the plant. EEM has no GL-only Bill Service Type, so the account takes Bill
  Payment (the plan''s "payment runs outside AP", as in Stage 2) with Bill Generation, 2000-AP and 5150-WIND; the
  export builders, not this field, keep it out of AP files (04-ap-export-formats.yaml). The bill credit transfer
  adds no coding to these defaults: the credit is coded once, on the Central Plant account where it lands
  (SYN-VED-A-0010013, 5100-ELEC; 05-ap-approval-and-upload.yaml).'
