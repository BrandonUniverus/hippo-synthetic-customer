- key: per_line_coding
  installed: {}
  Purpose: >-
    The Expense Account of individual bill lines (BillItem.BI_EXpAcctID), which no bill set before: every line fell back to the
    account's Default Expense Account. Do this after step 1 (the GL accounts exist) and the defaults above. Where a line has an
    Expense Account it wins over the account default (the GL builder reads COALESCE(BI_EXpAcctID, BA_DefExpAcctID)).
  Bill Entry accounts (Bill Items grid column Expense Account, or the line item drawer's Expense Account):
  - {Bill: SGU Student Center estimated bill (2024-10-15 to 2024-11-14), Lines: every line including the Gas therm Exclude line, Expense Account: 5110-GAS}
  - {Bill: SGU Student Center corrected bill (same period), Lines: every line, Expense Account: 5110-GAS}
  - {Bill: HOS Science Center Feb-25 (SYN-HOS-P-0000001), Lines: ppa_energy, net_metering_credit and rec_transfer, Expense Account: 5140-SOLAR}
  Imported accounts (Bill Importer > Mappings > Commodity Mapping, the field labelled Expense code on each mapping row; it is stamped on the lines of bills imported AFTER it is set, so the bills imported in Stage 5 keep the account default unless the GL accounts were entered before them. Either enter step 1 before Stage 5's imports, or, for the three Ridgeline bills ved_ridgeline_generator_2024_07, ved_ridgeline_generator_2025_01 and ved_central_plant_2024_09, remove their import in the Workspace and import them again after the Expense codes are set):
  - {Provider: Valley Electric District, Rows: every row of the VED commodity mapping (Electric, TOU; Demand; Fixed; Adjustment; Rider; Tax; Non-TOU energy; Reactive energy; Credit), Expense code: 5100-ELEC}
  - {Provider: River City Utilities, Rows: Water, Sewer, Stormwater, Expense code: 5120-WATER}
  Expect: >-
    Every line of the three Bill Entry bills above, and of the three Ridgeline bills once re-imported, has BI_EXpAcctID set (checks.sql per_line_coding). Because the Bill Importer commodity mapping is per
    commodity and the generator's generation_credit, bct_credit_transferred and the Central Plant's bct_credit_received all map to
    the one commodity "Electric, Credit", the credit lines of the three bills carry the same account (5100-ELEC); the credit cannot
    be coded to a different account on the generator than on the Central Plant. The credit is still coded once where it lands because
    the generator's pair nets to 0.00 (ridgeline_bct_coded_once).
  Finding candidate: >-
    The chart has one expense account per provider, so no bill can be mixed-coded to two different expense accounts within a
    provider (tax or credit lines to an account of their own, the most common real case); the Expense Account column works but
    has nothing different to choose. Adding an account (for example 5190-TAX) to a chart is a Stage 6 step 1 change, not made here.
