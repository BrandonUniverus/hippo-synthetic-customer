# Stage 6, step 6: Accruals. The OPEN accrual is enterable through ordinary screens once two prerequisites exist;
# the TRUED-UP REVERSAL PAIR IS NOT - see Findings. Verified against EEMSuite_Northlake: SysConstants has no
# 'MPA Accruals' / 'MPA Reversals' rows and Commodity has no row 2300 or 2301 for any company (both empty today).
# The EEMSuite upgraded-demo database has both SysConstants rows (Value_I 2300 / 2301, described as "used by
# Massport (MPA) accrual processing"), confirming rp_OpenAccruals reads a customer-chosen Item name that happens
# to carry a different customer's abbreviation - harmless to reuse verbatim for Northlake.
stage: 6
step: 6
title: Accruals
app: Configuration Tool, Database Administrator, Web SPA
screen: System Constants (Add Constant); Commodities (Add Commodity); '#/BillEntry'
source:
- generators/documents/sources/implementation/dream-customer/phase3-ap-gl-validation-spec.md
- generators/documents/sources/implementation/dream-customer/product-gap-backlog.md
notes:
- 'Verified: SysConstantsView.xaml has an AddConstantCommand, so a brand-new Item can be created, not just an
  existing one edited - "MPA Accruals" and "MPA Reversals" do not need to pre-exist.'
- 'Verified: Database Administrator''s top-level "Commodities" nav item (CommodityViewModel) has an Add
  Commodity dialog (AddCommodityViewModel); Commodity is company-scoped (CY_CommodityID carries a CompanyID),
  so Northlake University needs its own Accruals/Reversals commodity rows, not a shared one.'
- 'rp_OpenAccruals (Database/EEMSuite/Procs/rp_OpenAccruals.sql) takes @Reverse and @BillID; @Reverse=0 lists
  open accruals, @Reverse=1 creates the reversal and the Accrual_Bill/BillAccrualMap pairing. A comment in the
  proc names a "CustomReverseBill" caller that would run @Reverse=1 - that caller is not present anywhere in
  this repository (grep confirmed), so it is a different customer''s bespoke script, not a Northlake asset.'
- 'The proc is worse than unwired: its first executable statement deletes stale rows from dbo.Accrual_Bill
  unconditionally (before checking @Reverse), and EEMSuite_Northlake has no dbo.Accrual_Bill table at all
  (verified via sys.tables: only dbo.BillAccrualMap exists here). The EEMSuite upgraded-demo database has both
  dbo.Accrual_Bill and dbo.BillAccrualMap. Calling rp_OpenAccruals against Northlake today - with @Reverse=0 or
  1 - fails immediately with "Invalid object name ''Accrual_Bill''"; this is an installation gap on top of the
  missing UI, not just a missing screen.'
records:
- key: accrual_prerequisites
  installed: {}
  System Constants (Add Constant):
  - {Item: MPA Accruals, Type: Integer, Value: '# the CY_CommodityID created below for Accruals'}
  - {Item: MPA Reversals, Type: Integer, Value: '# the CY_CommodityID created below for Reversals'}
  Commodities (Add Commodity, Northlake University):
  - {Category: Other, Commodity Name: Accruals, Measure Type: Currency, Unit: USD}  # assumed - confirm the
      # Category/Measure Type/Unit options actually offered on screen
  - {Category: Other, Commodity Name: Reversals, Measure Type: Currency, Unit: USD}  # assumed
- key: open_accrual_fixture
  installed: {}
  Fixture: open_accrual
  Account: SYN-SGU-A-0020001 (Admin Hall gas, Sierra Gas Utility, a Bill Entry account; the earlier choice, Admin Hall's Valley Electric account SYN-VED-A-0010001, is a Bill Importer account that Bill Entry cannot open)
  Action: enter a manual bill in Bill Entry for the first period after the series, 2026-01-15 to 2026-02-14 (fiscal 2026-02), Bill Type Accrual, with one Bill Item on the Accruals commodity and no linked reversal.
  Header: {Bill Type: Accrual, Issue Date: 2026-02-16, Due Date: 2026-03-18, Invoice Number: SYN-SGU-sgu_admin_hall-202602-ACR}  # Invoice Number # assumed
  Bill Items:
  - {Description: accrual_estimate, Commodity: Accruals, Amount: 3400.00}  # assumed - estimated cost of the period's gas before the real Sierra Gas bill arrives
  Expected: 'this bill appears in rp_OpenAccruals with @Reverse=0 (the proc finds accruals by the Accruals commodity); validation test 99 (Company NLU, 01-bill-validation-rules.yaml) reports it, because it is a Bill Type 2 bill with no BillAccrualMap row, and so reports on the other bills of that account too; the AP and GL approval builders leave it out (Bill Type is not 0); it has no Accrual_Bill row.'
  Note: 'Bill Type Accrual is the engine''s marker of an accrual (BillValidation_CalcUnmappedAccruals.sql reads BillType = 2; BillAccrualMap pairs an accrual bill with its reversal). The Accruals commodity is what rp_OpenAccruals reads. The older text set only the commodity, so the validation test never saw an accrual.'
- key: trued_up_reversal_status
  installed: {}
  Status: BLOCKED, two ways (product-gap-backlog.md item 4) - no UI or API calls rp_OpenAccruals with
    @Reverse=1, and the proc itself cannot run against this instance regardless (it deletes from dbo.Accrual_Bill
    unconditionally, and that table does not exist in EEMSuite_Northlake - see the note above). Once the real
    Sierra Gas bill for Admin Hall's gas period arrives, the open accrual above cannot be paired with an
    automatically-created reversal through any screen; the Accrual_Bill/BillAccrualMap pair and the Reversals
    commodity line stay unentered until both the missing table and the missing caller are addressed.
