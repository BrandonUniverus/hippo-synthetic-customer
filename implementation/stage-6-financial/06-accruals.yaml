  Commodities (Add Commodity, Northlake University):
  - {Category: Other, Commodity Name: Accruals, Measure Type: Currency, Unit: USD}  # assumed - confirm the
      # Category/Measure Type/Unit options actually offered on screen
  - {Category: Other, Commodity Name: Reversals, Measure Type: Currency, Unit: USD}  # assumed
- key: open_accrual_fixture
  installed: {}
  Fixture: open_accrual
  Account: SYN-VED-A-0010001 (Admin Hall)
  Action: enter a manual bill in Bill Entry for the current, not-yet-billed period, with one Bill Item on the
    Accruals commodity and no linked reversal.
  Bill Items:
  - {Description: accrual_estimate, Commodity: Accruals, Amount: 3400.00}  # assumed - estimated cost of the
      # period's usage before the real Valley Electric bill arrives
  Expected: this bill appears in rp_OpenAccruals with @Reverse=0; it has no Accrual_Bill row.
- key: trued_up_reversal_status
  installed: {}
  Status: BLOCKED, two ways (product-gap-backlog.md item 4) - no UI or API calls rp_OpenAccruals with
    @Reverse=1, and the proc itself cannot run against this instance regardless (it deletes from dbo.Accrual_Bill
    unconditionally, and that table does not exist in EEMSuite_Northlake - see the note above). Once the real
    Valley Electric bill for Admin Hall's period arrives, the open accrual above cannot be paired with an
    automatically-created reversal through any screen; the Accrual_Bill/BillAccrualMap pair and the Reversals
    commodity line stay unentered until both the missing table and the missing caller are addressed.
