# Stage 6, step 6: Accruals. The OPEN accrual is enterable through ordinary screens once two prerequisites exist;
# the TRUED-UP REVERSAL PAIR IS NOT - see Findings. Verified against EEMSuite_Northlake: SysConstants has no
# 'MPA Accruals' / 'MPA Reversals' rows and Commodity has no row 2300 or 2301 for any company (both empty today).
# The EEMSuite upgraded-demo database has both SysConstants rows (Value_I 2300 / 2301, described as "used by
# Massport (MPA) accrual processing"), confirming rp_OpenAccruals reads a customer-chosen Item name that happens
# to carry a different customer's abbreviation - harmless to reuse verbatim for Northlake.
stage: 6
step: 6
title: Accruals
app: Configuration Tool, Database Administrator, Web SPA
screen: System Constants (Add Constant); Commodities (Add Commodity); '#/BillEntry'
source:
- generators/documents/sources/implementation/dream-customer/phase3-ap-gl-validation-spec.md
- generators/documents/sources/implementation/dream-customer/product-gap-backlog.md
notes:
- 'Verified: SysConstantsView.xaml has an AddConstantCommand, so a brand-new Item can be created, not just an
  existing one edited - "MPA Accruals" and "MPA Reversals" do not need to pre-exist.'
- 'Verified: Database Administrator''s top-level "Commodities" nav item (CommodityViewModel) has an Add
  Commodity dialog (AddCommodityViewModel); Commodity is company-scoped (CY_CommodityID carries a CompanyID),
  so Northlake University needs its own Accruals/Reversals commodity rows, not a shared one.'
- 'rp_OpenAccruals (Database/EEMSuite/Procs/rp_OpenAccruals.sql) takes @Reverse and @BillID; @Reverse=0 lists
  open accruals, @Reverse=1 creates the reversal and the Accrual_Bill/BillAccrualMap pairing. A comment in the
  proc names a "CustomReverseBill" caller that would run @Reverse=1 - that caller is not present anywhere in
  this repository (grep confirmed), so it is a different customer''s bespoke script, not a Northlake asset.'
- 'The proc is worse than unwired: its first executable statement deletes stale rows from dbo.Accrual_Bill
  unconditionally (before checking @Reverse), and EEMSuite_Northlake has no dbo.Accrual_Bill table at all
  (verified via sys.tables: only dbo.BillAccrualMap exists here). The EEMSuite upgraded-demo database has both
  dbo.Accrual_Bill and dbo.BillAccrualMap. Calling rp_OpenAccruals against Northlake today - with @Reverse=0 or
  1 - fails immediately with "Invalid object name ''Accrual_Bill''"; this is an installation gap on top of the
  missing UI, not just a missing screen.'
