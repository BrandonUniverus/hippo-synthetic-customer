  - {GL Account: 5110-GAS, Fund: 110 Operating, Department: Facilities, Program: Administration, Activity / Project: '', Object: ''}
  - {GL Account: 5120-WATER, Fund: 110 Operating, Department: Facilities, Program: Administration, Activity / Project: '', Object: ''}
  - {GL Account: 5130-THERMAL, Fund: 700 Plant, Department: Facilities, Program: Administration, Activity / Project: Central Plant Allocation, Object: ''}
  - {GL Account: 5140-SOLAR, Fund: 110 Operating, Department: Facilities, Program: Instruction, Activity / Project: Solar PPA, Object: ''}
  - {GL Account: 2000-AP, Fund: 110 Operating, Department: Facilities, Program: '', Activity / Project: '', Object: ''}
  Science Center override: the two Science Center expense lines (5100-ELEC, 5130-THERMAL for its lab wing and
