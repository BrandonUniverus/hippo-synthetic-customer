# Stage 6, step 5: AP approval and upload (Web SPA #/reporting/APApprovalAndUpload). Today the page opens but its format
# picker is empty (no ExportSetup row, 04-ap-export-formats.yaml), so the queue and the run below are what the screen WILL do
# once nl_ap_invoice and nl_gl_journal are installed. The queue rules are stated against the builders 04 defines; the run itself
# (ap_export_run, gl_export_run, export_revert) is specified in 04. Do not fabricate a file the screen cannot produce.
stage: 6
step: 5
title: AP approval and upload
app: Web SPA
screen: '#/reporting/APApprovalAndUpload'
source:
- data/eem/northlake-ap-gl-v1.yaml
- generators/documents/sources/implementation/dream-customer/phase3-ap-gl-validation-spec.md
- documents/guides/chart-of-accounts-and-gl-guide.pdf
notes:
- Eligible bills (the nl_ap_invoice approval builder) are Status_Code 2 (QC Approval, Stage 5 step 5) Bill Type 0 bills on an
  Active account whose Bill Service Type is AP Upload Only or Bill Payment (03-account-gl-defaults.yaml) and whose Bill Entry Type
  is not Bill Generation, with no BillValidation_Tbl row. A No AP Upload account (River City Cedar Row B, SYN-RCU-A-0030004) never
  appears in this queue at all, approved or not, and neither does the GL-only Ridgeline transfer account (SYN-RWL-G-0000001),
  although its Bill Service Type, Bill Payment, is one the queue otherwise admits; Helios accounts are Bill Payment too and ARE in the
  queue. The six Thermal Plant cost centers are AP Upload Only and join the queue when Stage 7 has produced their bills.
- 'A bill with an open BillValidation_Tbl row (a finding against a Batch Test rule, 01-bill-validation-rules.yaml) is excluded from
  the approval queue. BillValidation_Tbl rows are written only by the validation job; the job also takes a bill with a finding back to
  Status_Code 1 (Stage 5, 05-approval.yaml), so in practice a held bill is both un-approved and out of the queue, and the builder''s own
  exclusion is the second lock, the one that keeps a bill out when someone approves it by hand afterwards (Validate runs no tests). The
  chart-of-accounts guide''s AP setup note: "a bill with an open validation alert must be held from export".'
- 'Added 2026-10-01 (Ridgeline Wind): Ridgeline puts three rules on this screen. (1) The transfer statement EEM generates for
  SYN-RWL-G-0000001 is GL only, "a journal between the plant and its own wind company", with no payment leaving the plant
  (chart-of-accounts guide, AP setup), so it never appears in an AP queue or file, even after QC Approval, and only the GL journal
  format carries it (04-ap-export-formats.yaml). (2) The Valley Electric generator account, SYN-VED-A-0010014, "pays only its own
  small charges", so its bill is an ordinary AP bill. (3) Its export credit moves to the Central Plant account (the bill credit
  transfer), so the guide''s rule applies, "code the credit once, where it lands": on the Central Plant bill, coded 5100-ELEC, while
  the generator bill''s own credit and transferred lines net to zero.'
records:
- key: approval_queue
  installed: {}
  Action: 'Open #/reporting/APApprovalAndUpload, pick Accounts Payable (AP) Northlake, filter the Fiscal column to 2024-09, and read
    the totals grid: Approved (ticked), Un-approved (valid but not ticked) and Exceptions (bills with error tags).'
  Format: nl_ap_invoice (target, 04-ap-export-formats.yaml)
  Expected: the queue holds the 2024-09 bills that are approved, AP-eligible and finding-free (at most 42 at this point, see ap_export_run), every valid bill is Un-approved until ticked, and the run of 04 writes one ExportFile row, one ExportLog row per bill and a StatusHistory (BL, 3) row per bill.
- key: blocked_by_validation_example
  installed: {}
  Purpose: prove an open validation alert holds a bill out of the queue, even an approved one.
  Account: SYN-SGU-A-0020004 (Student Center, Sierra Gas Utility)
  Bills: {Estimated bill: 'SGU Student Center 2024-10-15 to 2024-11-14, Bill Type Estimated, 935.90 (Stage 5 03-bills.yaml estimated_then_corrected_fixture), approved by hand in Stage 5 step 5', Corrected bill: 'same period, 885.32'}
  Result: the estimate has findings for validation test 3 (estimated bill) and test 15 (duplicate bills in the fiscal period) and the corrected bill has test 15 and test 47 (issued 32 days after the period end), all from the Batch Test rules (01-bill-validation-rules.yaml, Company Defaults). After the job runs, the estimate is back at Status_Code 1 and neither bill appears in the approval queue; the pair stays out until the findings are cleared (the product has no way to retire the estimate, so a person deletes one of the two, or removes the rule). The earlier example (Recreation and Aquatics Center, November 2024 5,800.00 and December 2024 8,200.00) is dropped, because that account is a Valley Electric import, its bills come from the source service and cannot be given invented totals.
  Check: blocked_by_validation in checks.sql (lists the open findings by bill and the bill's status; none of them may be at Status_Code 2 after the job's first pass).
- key: ridgeline_transfer_gl_only_example
  installed: {}
  Purpose: prove the GL-only transfer statement never reaches an AP queue or an AP file.
  Account: SYN-RWL-G-0000001 (Ridgeline Turbine Field / RWL, Northlake Thermal Plant; Bill Payment, Bill Generation)
  Bills: {July 2024 Total: 129330.27}  # the statement EEM generates in Stage 7; it must match the hand-made sample to the cent
  Result: even after the statement is marked Status_Code 2, it does not appear in the approval queue for nl_ap_invoice, and no AP-type ExportLog row ever names it (checks.sql ridgeline_gl_only); no AP file line is written under vendor RWL-INTERNAL.
  Carried by (target): the GL journal only, one balanced pair of 129330.27, 5150-WIND against 2000-AP  # assumed - the pairing follows nl_gl_journal's one debit and one credit per bill
- key: ridgeline_bill_credit_transfer_example
  installed: {}
  Purpose: prove the generator's bill is an ordinary AP bill and the bill credit transfer is coded once, where it lands.
  Accounts: {Generator: SYN-VED-A-0010014 (Ridgeline Substation / VED), Beneficiary: SYN-VED-A-0010013 (Central Plant / VED)}
  Bills: {Generator first bill Total: 1077.45, Central Plant September 2024 Total: 151171.47}
  Result: the generator's first bill (2024-07-01..2024-08-04, ved_ridgeline_generator_2024_07) is eligible once approved
    and pays 1077.45 (285.00 + 580.07 + 161.07 + 51.31), every line coded 5100-ELEC; its generation credit (-152792.65)
    and the transferred line (+152792.65) net to 0.00, so no credit leaves with it. The Central Plant's September 2024
    bill (2024-08-05..2024-09-04, ved_central_plant_2024_09) carries the credit as its received line (-152792.65), coded
    5100-ELEC, the only place the credit reaches the GL; the three lines net to -152792.65 (checks.sql
    ridgeline_bct_coded_once). The generator's first bill is fiscal 2024-08 and the Central Plant's is fiscal 2024-09, so the 2024-09 run of 04
    carries the Central Plant's bill (unless a finding holds it; validation test 21 probably does, because the credit takes the bill to about half of its August charges) and the generator's
    comes with the 2024-08 run.
