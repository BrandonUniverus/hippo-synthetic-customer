    Permission groups:
    - eem_cra_points_read
  cra_points_modify:
    Company: Cedar Row Apartments
    Permission groups:
    - eem_cra_points_modify
  cra_points_admin:
    Company: Cedar Row Apartments
    Permission groups:
    - eem_cra_points_admin
  ntp_points_read:
    Company: Northlake Thermal Plant
    Permission groups:
    - eem_ntp_points_read
  ntp_points_modify:
    Company: Northlake Thermal Plant
    Permission groups:
    - eem_ntp_points_modify
  ntp_points_admin:
    Company: Northlake Thermal Plant
    Permission groups:
    - eem_ntp_points_admin
  nlu_rates_admins:
    Company: Northlake University
    Permission groups:
    - eem_rate_allocations
  ntp_rates_allocations:
    Company: Northlake Thermal Plant
    Permission groups:
    - eem_rate_allocations
