verificationAfterSetup:
  Status: Pending application execution. Catalog/key checks are not proof that every action enforces its level.
  Method: Save each group, leave/reopen it, and verify its exact keys, levels and node scope. Use the named non-administrator
    users below after step 5; inspect their combined effective grants first so another membership cannot mask the tested
    level. For temporary task/rate level checks use isolated test membership and restore the intended grants afterward.
    Record actual results, including any unsupported level boundary.
  Cases:
  - Case: Shared masters and company copies
    Expect: Twenty-one Shared masters under Common and one Shared copy of each in every company, except Cedar Row's
      eem_reports, which is made local. Master grant additions, level changes and removals reach each attached copy. A
      company copy rejects direct edits; memberships remain independently editable.
  - Case: Shared permission exclusions
    Expect: No AR rows in any shared master/copy. Shared D rows retain the exact target MetaCompanyID, node path and level.
      Local Science Center remains unchanged when a shared master is edited.
  - Case: Cross-company Points through home-company membership
    Users:
    - {User: nora.chen, Home company: Northlake University, Additional group: eem_cra_points_read, Target company: Cedar Row Apartments, Level: 1}
    - {User: leo.martinez, Home company: Northlake University, Additional group: eem_ntp_points_read, Target company: Northlake Thermal Plant, Level: 1}
    - {User: priya.nandakumar, Home company: Northlake University, Additional group: eem_ntp_points_modify, Target company: Northlake Thermal Plant, Level: 2}
    - {User: keiko.tan, Home company: Northlake Thermal Plant, Additional group: eem_nlu_points_read, Target company: Northlake University, Level: 1}
    - {User: quinn.roberts, Home company: Northlake University, Additional group: eem_cra_points_read, Target company: Cedar Row Apartments, Level: 1}
    - {User: quinn.roberts, Home company: Northlake University, Additional group: eem_ntp_points_read, Target company: Northlake Thermal Plant, Level: 1}
    Expect: Every membership belongs to the user's home company. Save/reload each target MetaCompanyID and level, then verify
      the named user's combined Points scope. Nora has Northlake and Cedar Row only; Leo and Priya have Northlake and Thermal
      Plant only; Keiko has Thermal Plant and Northlake only; Quinn reads all three. Other company copies gain no members.
  - Case: Shared rates and allocations
    Group: eem_rate_allocations
    Users: [priya.nandakumar, keiko.tan]
    Expect: Priya uses the Northlake copy and Keiko the Thermal Plant copy. Both receive the shared rate/schedule/allocation
      capabilities and their separate listed Points levels. The master's Library Rates category grant (Key *, level 3)
      covers the rates Stage 4 creates, so no rate is granted one by one.
  - Case: Common implementation access
    User: avery.singh
    Expect: IsAdmin is true. Common eem_system_db_admins and eem_implementation_admins supply the listed setup functions,
      reports and all-company Points at level 3, including Northlake. No customer-company membership is required.
  - Case: Future company and detach behavior
    Expect: A new company gets the twenty-one copies with their exact Points scopes and without members. Make Local on Cedar
      Row's eem_reports keeps its grants and members (Maya, Valerie) and lets it take its own Tenant Rebilling grants. Then
      change the Common master (add and remove a disposable report) and confirm Cedar Row's copy does not follow while the
      Northlake and Thermal Plant copies do.
  - Case: Level 1 fixed permissions
    Group: eem_support_readonly
    User: taylor.bennett
    Keys:
    - A / HierarchyTab
    - A / RateModelerTab
    - A / UtilityProviderTab
    Expect: Each grant reloads as 1; view succeeds, update/create/delete fail.
  - Case: Level 2 fixed permissions
    Group: cra_housing_ops
    User: valerie.kim
    Keys:
    - A / HierarchyTab
    - A / AggregatesTab
    Expect: Each grant reloads as 2. Exercise view/update/create/delete separately. Installed Admin Module update/insert
      metadata is 3/3, so do not count level 2 as working modify access until the actual screen proves it; record a denied
      required update as a gap.
  - Case: Level 3 fixed permissions
    Group: nlu_facilities_setup
    User: emerson.fox
    Keys:
    - A / HierarchyTab
    - A / AggregatesTab
    Expect: Each grant reloads as 3; create, update and delete a disposable hierarchy/aggregate item in the existing hierarchy.
  - Case: Points levels 1 / 2 / 3
    Groups:
    - eem_nlu_points_read
    - eem_ntp_points_modify
    - eem_nlu_points_admin
    Users:
    - quinn.roberts
    - riley.santos
    - emerson.fox
    Expect: Their company-node grants reload as 1 / 2 / 3 respectively. At a supported node editor verify read-only, modify-existing
      and create/delete boundaries. Check outside-scope denial only where no other membership grants that scope.
  - Case: Bill entry versus approval
    Groups:
    - eem_bill_entry
    - eem_company_setup
    Expect: After Stage 5 data exists, entry can enter bills/images but cannot validate; the company-admin setup can validate.
      The determining function is F / Bill Validation, not G:4 or F / Bill Administration.
    Company: Northlake University (CompanyID 6); test the company copies, not the Common masters.
  - Case: Report and module grants
    Groups:
    - eem_bill_entry
    - eem_bill_import
    - eem_audit_readonly
    Expect: G:21 and report grants save as 1. Entry has Bill Entry and Bill Entry List; import has Bill Importer and Bill
      Entry List; audit has Activity Tracker and Audit Report. No empty category/module grants, and no G:14 All on viewer
      groups.
    Company: Northlake University (CompanyID 6); test the company copies, not the Common masters.
  - Case: Task-group lifecycle and levels
    When: Stage 3 or Stage 5, after a task group is saved.
    Expect: The new exact TS key appears only after group creation. Using an isolated test group, save/reload levels 1,
      2 and 3 and check view, edit, add/delete, enable and Run Now independently. Do not assume that storing a lower level
      proves execution is denied; grant a real viewer only after that boundary passes.
  - Case: Library-rate levels
    When: Stage 4, after a library rate exists.
    Expect: On an isolated test group, save/reload levels 1 / 2 / 3 for that exact rate and verify view / modify / create-delete
      behavior before restoring the intended level 3 rate-admin grants.
  - Case: Science Center scope
    Group: nlu_science_center_scope
    Expect: Dana belongs to Northlake eem_reports and local nlu_science_center_scope only. Her Points grant
      is the existing Science Center path 0.6.22.24, MetaCompanyID 6, at level 1 with no company-root or Common Points grant.
  - Case: Ridgeline site scope at Modify
    When: Stage 2, after the Ridgeline Wind Site Points grant.
    Group: ntp_wind_ops
    Expect: Renee belongs to Northlake Thermal Plant ntp_wind_ops only; Mateo adds eem_reports. Their only Points grant is
      the Ridgeline Wind Site node at level 2 in MetaCompanyID 5. They edit Ridgeline meters and points, cannot create or
      delete nodes, and never see the Central Plant.
  - Case: Cross-company site scope through a shared master
    When: Stage 2, after the Ridgeline Wind Site Points grant.
    Group: eem_ridgeline_research
