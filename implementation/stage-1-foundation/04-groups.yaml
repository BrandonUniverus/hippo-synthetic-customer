# Stage 1, step 4: System/shared groups first, then company-local duties and Science Center.
# Nine shared Points masters provide three access levels for each target company.
stage: 1
step: 4
title: Groups and permissions
app: Database Administrator
screen: Users & Groups > Groups
source:
- data/security/northlake-eem-security-v1.yaml
- documents/intake-package/user-access-request.pdf
verifiedAgainst:
  Server: .
  Database: EEMSuite_Northlake
  Shared Points and fixed permission keys checked on: '2026-09-23'
  Report placement exclusions checked on: '2026-09-21'
  Definitions: [dbo.PermissionCatalog, dbo.PermissionCatalogType]
  Sharing implementation:
  - Database/EEMSuite/Procs/UserGroups_Shared_Sync.sql
  - Database/EEMSuite/Procs/UserGroups_Save.sql
  - Database/EEMSuite/Procs/UserGroups_Delete.sql
  - Database/EEMSuite/Procs/Permissions_Save.sql
  Sharing deployment: The deployed Northlake procedures allow shared Points and preserve MetaCompanyID, MetaKey and level
    in each company copy. Administrator roles remain protected. Source/schema inspection is not a manual application test.
  Live reconciliation: 04-groups-reconciliation.md
companyIds:
  Common (System, CompanyID -1): -1
  Northlake University: 6
  Cedar Row Apartments: 3
  Northlake Thermal Plant: 5
setupOrder:
- Complete Common/System first. All 21 Common records are Shared=true masters, including the three existing system/support
  groups, nine Points groups and eem_ridgeline_research (added 2026-10-01). Keep eem_system_db_admins,
  eem_implementation_admins and eem_support_readonly shared.
- Create/save the ten missing Common masters listed in 04-groups-reconciliation.md, enable Shared and enter their exact
  permissions. The new eem_nlu_points_*, eem_cra_points_* and eem_ntp_points_* IDs allow their copies to be created while
  the old local Points groups still exist. EEMSuite creates the copies; do not enter duplicate copy records manually.
- For each Points master, select the named target company root and level. Sharing preserves that target in every copy;
  it does not retarget the Points to the company that receives the copy. Verify MetaCompanyID as well as the level.
- Correct the existing Common masters and then each company's local groups using the reconciliation checklist. Eight
  local definitions remain, including Northlake's existing Science Center scope, the new ntp_wind_ops and Cedar Row's
  eem_reports, made local. The two Ridgeline Points grants name the Ridgeline Wind Site node, so they are made once
  Stage 2 step 2 has saved it (key 0.5.40).
- Move Samantha and Jordan from Northlake nlu_points_admin to the Northlake copy of eem_nlu_points_admin before removing
  that old local group. Retire only the ten existing local groups identified in the checklist after checking memberships
  and references. The obsolete cross-company-only groups were never installed and need no deletion.
- Finish and verify the groups before entering the remaining users. 05-users.yaml is the authoritative membership and
  IsAdmin list. Samantha, Jordan and Priya already exist in the checked database; reconcile those records instead of recreating them.
- laterPermissions and laterLocalGroups at the end hold only grants that cannot be made yet. The company-specific
  bill-import task groups of Stage 5 do not exist, and the two gateway task viewers need a read-only Task Manager grant,
  a requested capability still to confirm on the installed build (finding 1). A group that needs every task group or
  every library rate takes the
  category grant now, which also covers ones created later.
notes:
- '2026-11-01 upgrade reconciliation: System Manager groups also require the System Health and GHG Reporting module grants added by AddSystemHealthModule.sql. These module entries preserve access to moved pages; report grants still control the pages each group can open. Audit Explorer (audit_explorer) replaces the retired rp_Audit report.'
- Edit shared names and grants on the Common master. Its company copies have independent membership and read-only grants.
  A newly created company receives copies with the same Points scopes and no members. Membership is always assigned in
  the user's home company, including when the group's Points target another company.
- 'Example: Nora joins Northlake eem_bill_import, eem_nlu_points_read and eem_cra_points_read. The Cedar Row Points copy
  still targets MetaCompanyID 3 even though Nora and the copy belong to Northlake (CompanyID 6).'
- Each target company has Read (1), Modify (2) and Insert/Delete (3) Points masters. eem_nlu_points_modify is currently
  unassigned but completes the requested three-level set. Dana keeps the local Science Center-only group, with no company-root grant.
- System-root Points in eem_system_db_admins and eem_implementation_admins are level 3; eem_support_readonly has level 1.
  MetaCompanyID=null means all companies. These grants now remain shared; customer users receive only the groups listed in 05-users.yaml.
- Permissions combine across a user's groups. Shared report/function permissions and Points scopes are not separate
  per-company bundles; check the combined effective scope and level.
- Make Local detaches a company copy and retains its grants/memberships. Deleting a company copy opts it out of future
  synchronization until Restore shared group is used. Deleting a shared Common master also deletes its attached shared
  company copies. The retirement list below contains local groups only; keep all 21 planned masters and their copies.
- Cedar Row's copy of eem_reports is the one copy detached on purpose (record cra_eem_reports_local). Make Local it, save,
  then rename it CRA EEM Billing and Usage Reports and add its local grants. Detach no other copy.
- Name is the English display label; Key is the exact catalog PermissionKey. Enter only the listed grants. Permission
  Profile is a planning label in the old security source, not an EEMSuite object.
- Fixed permissions generally support levels 1 Read/Execute, 2 Modify and 3 Insert/Delete; omitted/0 means no grant.
  Functions are entered at level 3. Bulk Data Entry works only at 3 although the catalog lists it as level 1 only, and
  until 2026-10-02 every upgrade raised a function grant saved at 1 or 2 to 3 (finding 77). Catalog thresholds do not
  prove a screen's behavior at every level.
- Access Management replaces the retired UsersTab/GroupsTab keys with A / AccessManagementTab. Its editor requires both
  an administrator role and this permission; level 1 reads, level 3 manages, and level 2 is treated as read. Avery's system
  setup group includes level 3. Quinn stays a non-administrator and cannot inspect that editor through the audit group alone.
- User Modules and Report Groups save as level 1. A report category marked All is one grant on the category itself (Key *),
  made by setting the level on the category, not on each report. It covers reports added later, such as the Scene reports,
  and reports also need their module grants. A category that lists reports is granted report by report.
- Task Manager Items and Library Rates use the same category grant. Key * covers every task group or library rate,
  including ones created later. A named TS key is one task group's saved Description, never an individual task.
- Library Rates levels hold in the desktop (Read views, Modify edits, Insert/Delete adds and deletes), capped by the Rate
  Modeler tab level. Task Manager never compares the level, so any TS grant gives full control of those tasks. Even
  system administrators see no task without a TS grant. The Rate Analysis and Tenant Rebilling reports show only rates
  the user holds, so groups with those reports and no rate setup hold all library rates at Read.
- F / anonymize_user_data needs no entry. The 2026-09-25 user data upgrade granted it at level 3 to every group then
  holding the Anonymize Data report, so eem_system_db_admins, eem_implementation_admins and eem_company_setup (through
  System Administration Functions All) and their copies have it.
- Administrator Roles (AR) cannot be placed in ordinary/shared groups. Set the User Editor's Administrator checkbox to
  each record's explicit IsAdmin boolean in 05-users.yaml; EEMSuite manages the protected administrator membership.
- Science Center is the existing node 24, path 0.6.22.24, MetaCompanyID 6. Bill approval is F / Bill Validation (only its
  presence is checked); bill entry has bill_entry_web and bill_images without Bill Validation.
- 'This recipe has 29 definitions: 21 shared masters plus eight local groups, one of them Cedar Row''s eem_reports made
  local. The 62 copies that stay shared bring the planned custom-group total to 91. Protected/default groups and
  not-yet-retired old groups are additional rows.'
- 'Ridgeline (2026-10-01): eem_ridgeline_research is the first shared master whose Points name a node inside another
  company, and ntp_wind_ops the first node-scoped group at Modify. Both get their Points once Stage 2 saves the node.'
permissionTypes:
  Admin Modules: A
  Functions: F
  Task Manager Items: TS
  My Import Methods: MI
  Library Rates: $
  Points: D
  User Modules: G:21
  Report Groups: Type is specified beside each report category
catalogExclusions:
  Empty report categories used by the old file:
    Alarm Manager Reports: G:2
    Baseline Performance Reports: G:3
    Bill Administration: G:4
    Bill-Meter Reconciliation: G:7
    Utility Accountant Sub Reports: G:18
    Rate Analysis Configuration: G:23
  Module keys with no report placements:
  - alarms
  - baseline_perf
  - billmeter_rec
  - utility_accountant
  Explanation: These type/module definitions remain in Northlake, but they do not provide selectable report content. Do
    not grant them just because the catalog has a heading. Recheck if a future feature supplies real content.
  Existing task permission keys, not automatic grants:
  - Bill Importer Tasks
  - EEM Gateways
  - Report Tasks
  - Standard Alerts
  - System Tasks
  TaskType without a TS definition: MFR Reports exists in TaskType but has no active TS catalog row; it is not a grantable
    key in this snapshot.
