# Stage 1, step 1: Companies (Database Administrator > Nodes > the company node > Definitions tab).
# One record per company. Section keys are the Definitions tab's pages (Definitions, Levels, Company Address,
# Company Contact, Bill Scenarios); alarm defaults sit on the Definitions page. The company editor's other tabs
# (Users & Groups, Utility Accountant, GL Accounts, Bill Validation) and the Weather Stations page are later steps.
stage: 1
step: 1
title: Companies
app: Database Administrator
screen: Nodes > company node > Definitions
source:
- data/scenarios/demo-university-v1.yaml
- data/eem/northlake-eem-stage1-setup-v1.yaml
- documents/intake-package/facilities-and-meter-register.pdf
notes:
- 'A company is a node: add it at the top of the Nodes tree, fill the Definitions page (name, archive interval,
  time zone, country, alarm defaults) and save; the other pages unlock after the first save.'
- Archive Interval is the default interval new points inherit; every Northlake company uses 60 minutes.
- Saving a company creates the Actual bill scenario and a 1990-2013 fiscal calendar on its own. Leave both; Stage
  1 step 3 adds 2024-2025.
- 'Levels: the four base types (Site, Location, Meter, Point) are fixed by the product; the descriptions are the
  owner''s wording per company. Icons are Font Awesome class names as the desktop icon picker saves them; its map pin
  saves as fa-location-dot (fa-location is the crosshairs).'
- 'Changed 2026-10-01 for Ridgeline Wind: the Thermal Plant''s Level 2 is Facilities, not Served Buildings. It now holds
  the Central Plant, Ridgeline Turbine Field and Ridgeline Substation, and none of them is a building the plant serves.
  Rename it on the installed company; the Central Plant node keeps its place and picks up the new label.'
- Region is the two-letter state code; the editor pads it (RE_RegionCode is char(5)).
- The System company (CompanyID -1, shown as Common) already exists and is never created.
