# Stage 1, step 2: Utility Providers (Database Administrator > Utility Providers).
# One record per provider. Pages in the order the editor wants them: Definitions first (save), then
# Provider Address, Provider Contact, Remit Addresses, Bill Cycles, Associated Companies, Notes.
stage: 1
step: 2
title: Utility providers
app: Database Administrator
screen: Utility Providers
source:
- data/providers/*.yaml
- data/scenarios/northlake-onboarding-v1.yaml (contacts)
- documents/rate-tariffs/*.pdf
- documents/intake-package/facilities-and-meter-register.pdf
notes:
- Create the provider on Definitions and save before the other pages unlock.
- 'Bill Cycles: add one cycle grouping per Cycle number, then its 36 periods (2024-01 to 2026-12; Ridgeline Wind has
  30, from its 2024-07 acquisition; Georgian Shore Hydro, added 2026-11-10, has 12, all 2026). The 2026 periods were added after the first entry, so they are new rows to add
  to an installed cycle. Period and Year
  are the month the bill posts to; a period runs from one read to the day before the next. The page can also Import
  the periods from Excel.'
- 'Days counts both ends (2024-01-01 to 2024-01-31 is 31), as the Bill Cycles grid shows it. The installed cycles
  were saved through a path that stored the end minus the start, one short (30); the save now always counts Days from
  the dates (UtilityProviderService, changed 2026-10-02, needs the build installed). Once it is, open each provider''s
  Bill Cycles and save every grouping again; checks.sql 02 Bill cycles then passes on Days.'
- A meter stores only its provider's cycle number, so the cycles must exist before Stage 2 meters are saved.
- Associated Companies is where each company's vendor number for this provider is entered; the companies from step
  1 must exist first.
- Remit addresses are chosen per billing account in Stage 2; enter them here once.
- 'The Northlake Thermal Plant is an internal counterparty: no website, the plant manager as contact, campus mail
  stops as addresses.'
- Icons are Font Awesome 6 class names as the picker shows them.
