# Stage 1, step 3: Company Calendar (web, Administration > Company Calendar, #/CompanyCalendar).
# 24 monthly fiscal periods per company, 2024-01 to 2025-12, are the ones Northlake's bills use. Bills post to a
# fiscal period; a bill whose period has no row is rejected, which Stage 5 uses on purpose with a bill keyed with
# its year transposed (2052 for 2025), a year no calendar reaches.
stage: 1
step: 3
title: Company calendars
app: Web
screen: Administration > Company Calendar (#/CompanyCalendar)
source:
- data/eem/northlake-company-calendar-v1.yaml
- documents/guides/chart-of-accounts-and-gl-guide.pdf
notes:
- 'Saving a company creates its calendar: the installed companies already run from 1990 to 2026 (Northlake University)
  or 2027 (Cedar Row Apartments and the Thermal Plant), because Company_Save generates periods through next year. Leave
  them, and check that the 2024 and 2025 periods below match; add any that are missing.'
- 'Do not remove later years to make a rejection happen: EEM keeps generating the calendar through next year. Stage 5
  proves the ''Fiscal Year/Period NOT found'' rejection with a bill keyed with its year transposed (2052 for 2025).'
- Fiscal year equals calendar year for every Northlake company; quarters are calendar quarters.
- The System company (Common) needs no calendar.
records:
