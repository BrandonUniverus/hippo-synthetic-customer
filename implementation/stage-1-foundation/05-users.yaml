# Stage 1, step 5: create users with explicit IsAdmin, then assign their home-company groups.
# A shared Group ID has a separate copy and separate membership in each company.
# Casey remains inactive for the disabled-user regression case.
stage: 1
step: 5
title: Users
app: Database Administrator
screen: Users & Groups > Users
source:
- data/security/northlake-eem-security-v1.yaml
- documents/intake-package/user-access-request.pdf
notes:
- 'Create and save the user, set the Administrator checkbox to IsAdmin, then assign Groups in that same home company.
  A shared Group ID occurs in several companies: select the copy in the user''s company.'
- All listed Groups are current assignments. Shared Points groups preserve their target company in every copy. Nora uses
  the Northlake copies of eem_nlu_points_read and eem_cra_points_read to read Northlake and Cedar Row respectively.
- The nine shared Points masters provide Read/Modify/Insert-Delete for each target company. Choose the copy in the user's
  home company; sharing does not copy memberships. Dana's Science Center-only Points group remains local.
- Samantha, Jordan and Priya already exist in the 2026-09-23 snapshot. Finish 04-groups-reconciliation.md before entering
  the remaining users, and reconcile these three existing records rather than creating duplicates. Future task/rate keys
  stay deferred at the end of 04-groups.yaml.
- IsAdmin is explicitly true or false for every user. True means system administrator for a Common user and company
  administrator for a customer-company user. Ordinary groups, including eem_company_setup, do not grant that protected role.
  IsAdmin specifies the User Editor setting; it is not an instruction to add a database column.
- User Name is the sign-in name and the key EEM stores; Display Name is what screens show.
- Authentication Policy LocalAndFederated is the product default for a human user; WorkloadOnly is the only policy the
  Add user drawer offers a Service, ApiClient or Task principal (NewUserRules, UserFormRules.PolicyChoices), and the
  password pair may be left empty for them.
- 'Added 2026-11-10: three workload principals (Service, ApiClient, Task) so the Principal Type and Authentication Policy
  fields take more than one value. The Add user drawer lists all four principal types; a workload id has no spaces and
  is at most 64 characters. They are not people: none is an administrator, none is a Stage 9 recipient.'
- The three energyhippo.example.com people belong to Common (System); they are the implementation and support accounts.
- Do not delete the built-in Admin, SiE_Setup, reportemail, dbo or Worker principals.
