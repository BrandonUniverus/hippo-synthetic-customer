# Emergency generators (route GEN): two registers each, run hours and diesel gallons. The fuel totalizer is an
# Accumulator with its Delta. The run-hour meter cannot be: Point_Save takes a new Accumulator only in an Energy or
# Volume unit or one with a rate unit, and Hour is a Time unit with neither (the Stage 2 import of 2026-11-09 failed
# on it). So run hours are an Analog register and a separate Analog usage point, the pattern Massport uses for all of
# its handheld registers: the import writes the read to the register and the difference to the usage point.
