# Stage 2, step 4: Points (Database Administrator > Nodes > Point nodes; PointDefinitionViewModel).
# One record per point a person enters, key = the source model's channel id (or the baseline
# target's own id for the 3 baseline point shells; see 07). What EEM creates on its own
# (AccumulatorDelta behind every Accumulator, HDD/CDD behind a Degree Days index) is not listed
# as a record; capture its id on the parent's own installed: block instead. Meter names the
# point's meter as the tree shows it (Description) with its Meter Number from 03-meters.yaml.
stage: 2
step: 4
title: Points
app: Database Administrator
screen: Nodes > Point nodes
source:
- data/scenarios/demo-university-v1.yaml (channels)
- data/eem/northlake-eem-metaworld-stage1b-v1.yaml (pointRules, weatherIndexTargets, baselineTargets)
notes:
- '474 points to enter here, including the 3 baseline shells and 18 independent hourly NOAA forecast points.
  EEM adds 197 AccumulatorDelta points and 6 HDD/CDD points behind the three observed station temperatures,
  for 677 ordinary/generated points. Forecast points have no Degree Days index. The handheld routes (added
  2026-11-07) bring 73 of them: Cedar Row C''s 50 water registers, the 4 irrigation registers, the generators'' 9
  (each a fuel register, and an Analog run-hours register with its own Analog usage point) and the switchgear''s 10
  (6 registers and 4 demand points), so 63 more Deltas.'
- 'A new Accumulator must be in an Energy or Volume unit or one with a rate unit (Point_Save; the point editor lists
  only those for a new register). A register in any other unit, like the generators'' run hours in Hour, is an
  Analog register with a separate Analog usage point instead.'
- 'Apply the weather measurement catalog upgrade before configuring these points. Keep existing channel identities,
  point IDs, units and readings. Add the missing KSAC/KSMF dew point and KSMF/KSUU humidity observations. Change the three station wind points from Weather to Wind Speed, and KSUU Dew Point
  from Temperature to Dew Point, so each observation can be associated with its matching forecast measurement.'
- 'Meter multipliers (added 2026-10-04): the last two records put a daily register on the two meters whose multiplier
  would otherwise touch no data, Science Center Electric Lab Wing (x40, its current-transformer ratio) and Central Plant
  Boiler Gas (x3.0367, the pressure factor of its 30 psig delivery). Each register reads the raw dial: secondary kWh for
  the lab wing, line-pressure volume for the boiler gas, which the multiplier turns into billed units. The boiler gas
  register takes Hundreds of Cubic Feet - (ccf), the Volume unit, not Gas Hundreds of Cubic Feet - (ccf), the Energy
  unit with the same label: a pressure factor corrects volume.'
- 'Ridgeline points archive at 10 minutes (the turbine SCADA grain) except the Valley Electric interconnection (15) and
  KSUU (60). Turbine State is the four-state Digital point (0 Stopped, 1 Running, 2 Fault, 3 Curtailed; the plant''s
  digital alarm colors black, green, red, orange). Rotor Speed is Activity Level, the only measure type RPM is
  seeded under. Possible kW is the turbine controller''s own expected output at the measured wind, the expected side
  of the expected-against-actual goal. Air Density takes Kilogram per cubic meter, not the Gas cubic meter unit with
  the same label.'
- 'Values are written the way the editor shows them. Measure Type is the MeasureType name (Electricity, Potable Water,
  Relative Humidity, Activity Level, ...). Units is the list entry "Name - (abbreviation)", for example
  "KilowattHours - (kWh)"; the abbreviation alone is ambiguous (Natural Gas has two units abbreviated ccf). A new point
  starts as Analog, Activity Level, Percent, 60 minutes: change every field before the first save.'
- 'Register points (Reading Type Accumulator): Units on a NEW accumulator is the usage unit the generated Delta point
  will carry (Thousands of Gallons for water, Therm for the kitchen gas route). EEM then stores the register itself as
  Reading. PRODUCT FINDING 39: saving with Reading instead sends Point_Save down a legacy branch that picks the Delta''s
  unit arbitrarily.'
- 'Point_Save creates only the AccumulatorDelta behind a register point, not an AccumulatorROC as well; the stage1b
  model''s ''generatedPointTypes'' list (AccumulatorDelta, AccumulatorROC) overstates what the save proc does. Do not
  expect or wait for a rate-of-change point.'
- 'Index: Degree Days is offered only on a Temperature point and creates daily HDD and CDD children
  (IndexPoints_Save) named <point> HDD and <point> CDD. KSAC Outside Air Temperature is in degrees Fahrenheit and gets
  HDD(F)/CDD(F) children; KSMF Outside Air Temperature is in degrees Centigrade (the Aeris feed''s metric field) and
  gets HDD(C)/CDD(C). Activity Level is offered only on an Activity Level point and creates nothing; the Student Center
  Event Count carries it.'
- 'Archive Interval offers only 1, 5, 10, 15, 30, 60 or 1440 minutes; there is no blank. Monthly route and manual
  register reads use 1440. The file uses every allowed value: 1 (chiller kW), 5 (chiller status), 10 (lab sensors),
  15, 30 (Library historian), 60 and 1440.'
- 'Accumulator and Degree Days points lock Reading Type, Measure Type, Units, Index and Archive Interval after the
  first save, because EEM has created their children. A wrong one is deleted and entered again.'
- 'Five points use units Northlake adds or extends in Step 0 (00-units.yaml), so the unit system is exercised: KSAC
  Wind Speed (Miles per Hour, new), KSMF Wind Speed (Kilometers per Hour, newly associated with Weather),
  Plane-of-Array Irradiance (Watts per Square Meter, a new User-defined unit), Steam Header Pressure (PSIG, newly
  associated with Pressure) and Student Center Event Count (Events, a new Activity Level unit). Since 2026-11-07 a
  sixth does too: the switchgear''s Power Factor at Max Demand (Power Factor, a new User-defined unit). Enter Step 0
  first, or those Units lists come up without them.'
- Time Zone (a Definitions-page field common to every node type, not specific to points) is Pacific for every point,
  inherited from its building; none needs to change it.
- The Baseline group (Baseline Algorithm, Display baseline, Baseline For) on the Point editor is left at its default
  ([None]) for every point here. The 3 baseline point shells are configured in Stage 3, once their measured points
  have a gateway (see stage-3-gateways-and-data/06-baselines.yaml).
- A meter whose channels are all bill facts (for example a flat monthly kWh/kW utility meter with no interval data)
  has no points at all; only meters with at least one non-bill channel appear above.
- 'The Student Center Event Count sits directly under the Student Center building (Parent, not Meter): EEM places a
  point under any broader node, and the event feed has no device.'
