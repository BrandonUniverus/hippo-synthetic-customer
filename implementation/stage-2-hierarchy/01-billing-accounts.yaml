# Stage 2, step 1: Billing Accounts (Database Administrator > Nodes > company node > Utility
# Accountant tab; BillAccountViewModel). One record per account. Section keys are the tab's own
# pages in the order it presents them: Definitions (save first), Service Address, Account
# Address, Account Contact. GL Accounts and Bill Validation Tests belong to Stage 6.
stage: 2
step: 1
title: Billing accounts
app: Database Administrator
screen: Nodes > company node > Utility Accountant tab
source:
- data/scenarios/demo-university-v1.yaml (accounts)
- data/eem/northlake-eem-metaworld-stage1b-v1.yaml (billingAccountKinds, billingAccountSetup)
- data/eem/northlake-bill-entry-v1.yaml (preferredEntry)
- implementation/stage-1-foundation/02-utility-providers.yaml (remit addresses and contacts)
notes:
- Select the company on Nodes, open its Utility Accountant tab, click Add, fill Definitions and save; the other
  pages (Service Address, Account Address, Account Contact, Notes, Status) unlock after the first save.
- 'Currency Unit: a new account starts as Australian Dollar, the first currency by name. Set US
  Dollar before the first save. US Dollar is assumed; nothing in the source model states a currency.'
- 'Service Address is typed text, not a picker: it repeats the building''s street address from
  02-sites-and-buildings.yaml, but nothing links the two records. Latitude and Longitude are that building''s own
  coordinates; type them, or use Find and correct what it returns.'
- 'Account Address and Account Contact are the provider''s business address and Stage 1 contact. The Thermal Plant''s
  representative is its plant manager: the plant line 916-555-4500 as Phone (Stage 1) and his direct line
  916-555-0104 as Cell (facilities-and-meter-register.pdf p4). The Thermal Plant''s mail stop goes in Address 2, the
  same split as its Stage 1 provider address.'
- 'SYN-VED-A-0010012 (Cedar Row Carport and Grounds / VED) has no Account Contact: an unmetered lighting service Valley
  Electric assigns no representative. Its Account Address stays.'
- Remit Address is a combo of the provider's remit addresses, shown as one line ending in the country; every Northlake
  provider has exactly one, so the combo offers a single choice.
- 'Bill Invoice Template: two rows are seeded, Bill Table Invoice Default (BillInvoice.trdp) and Billing Charges Report
  (BillingCharges.trdp). The six Thermal Plant cost centers use Billing Charges Report, because their charges come from
  the plant''s allocation rate schedules (Stage 4), and so does Ridgeline''s transfer agreement, the other internal
  counterparty; every other account uses the default.'
- 'Bill Service Type (Global_Type_Code BA: 0 No AP Upload, 1 AP Upload Only, 2 Bill Payment). The AP/GL plan
  (data/eem/northlake-ap-gl-v1.yaml) speaks in AP, AP and GL, GL and No Upload, which EEM does not have; they map to
  AP Upload Only (AP, and AP and GL: the GL side is Stage 6), Bill Payment (GL: "payment runs outside AP") and No AP
  Upload. So: AP Upload Only for every external utility account and the six Thermal Plant cost centers ("most are AP
  upload; campus electric and thermal accounts are both AP and GL", chart-of-accounts-and-gl-guide.pdf p2); Bill
  Payment for the three Helios PPA accounts and for Ridgeline''s transfer agreement, which the GL guide makes GL only
  (a journal; no payment leaves the plant); No AP Upload for SYN-RCU-A-0030004 (Cedar Row B / RCU), the Cedar Row
  account the guide keeps off the interface as a control (named in the AP/GL plan, not in the guide).'
- 'Bill Entry Type (Global_Status_Code BA2: 0 Bill Entry, 1 Bill Importer, 2 Bill Generation, 3 Bill Allocation, 10
  Other). Bill Importer for every Valley Electric District and River City Utilities account in all three companies:
  the register names Nora Chen as the bill import specialist for Northlake University and Cedar Row
  (facilities-and-meter-register.pdf p4), and the Central Plant''s VED and RCU bills are ordinary utility bills. Bill
  Entry for every Sierra Gas Utility and Helios Onsite Solar account. Bill Allocation for the six Thermal Plant cost
  centers, which receive the plant''s allocated cost. Bill Generation for Ridgeline''s transfer agreement, whose
  statement EEM generates from the turbine meters (Stage 7''s Town Center tenants use it too); Other is unused.'
- 'Bill Entry lists only Bill Entry accounts (BillType_Code 0), so the 31 Bill Importer, 6 Bill Allocation and 1 Bill
  Generation accounts never appear there. That is by design: their bills come through Bill Importer (Stage 5),
  allocation and generation (Stage 7).'
- 'Status (the Status page; saving needs an administrator): every account gets Active Billing Account as of
  2024-01-01, the account start the register gives (facilities-and-meter-register.pdf pp9-13), except the two
  Ridgeline accounts, which start with the acquisition on 2024-07-01. The first save already writes an Active row
  dated the day it is saved; bill validation''s account-opening test reads the earliest Active date, so without the
  backdated row every 2024-2025 bill would predate its account.'
- 'Ridgeline (added 2026-10-01): SYN-VED-A-0010014 is the generator account Valley Electric opened for the plant when
  it bought the site; the seller''s account, SYN-VED-A-0019014, goes in Previous Account Number (assumed, from the
  transfer letter). SYN-RWL-G-0000001''s representative is Mateo Alvarez, the site manager, at the site address.'
- 'SYN-RCU-A-0030003 (Cedar Row A / RCU) was renumbered at the July 2024 lease renewal (river-city-utilities.pdf p2;
  the facilities overview p5 leaves the old number open). Previous Account Number (the field labelled Previous
  Account #) holds the old number, SYN-RCU-A-0030103 (assumed), and a note records the change. River City''s
  September 2024 bill (03-River-City-Cedar-Row-A-Account-Renewal.pdf, 2024-08-15 to 2024-09-14) cites the renewal and
  the old number the same way. (The hand-made image it replaced named SYN-RCU-A-0030013, the Cedar Row A fire service,
  and dated the change 03/01/2025.)'
- 'GL Accounts (Liability and Default Expense Account) appear only once the company has GL accounts, and Bill
  Validation Tests belong to Stage 6; leave both at their defaults here.'
- 'PRODUCT FINDING 34: payment terms, cycle day, current balance, the remit and bill-review contacts and the bank
  account have columns but no field, and every save of this editor writes them as NULL.'
