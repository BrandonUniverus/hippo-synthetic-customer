# Stage 2, step 2: Sites and Buildings (Database Administrator > Nodes; Site and Location
# nodes). One record per node. These 4 sites and 13 buildings, plus the two airport nodes noted
# at the end, already exist on the installed instance (see installed: below); this file records
# their expected values. The Ridgeline Wind Site and its two buildings (added 2026-10-01) are new:
# enter them. So is Cedar Row C (added 2026-11-07), the apartment building that opened September 1, 2025.
stage: 2
step: 2
title: Sites and buildings
app: Database Administrator
screen: Nodes
source:
- data/scenarios/demo-university-v1.yaml (sites, buildings)
- data/eem/northlake-eem-metaworld-stage1b-v1.yaml (weatherIndexTargets, ownershipRules)
- generators/documents/sources/implementation/northlake-address-coordinates.md
notes:
- 'Each record lists every page the node editor shows for that node, in the editor''s order. A null value or an empty
  list is deliberate: leave that page empty. The empty states are part of the test, so do not fill them in.'
- 'Level is the company''s hierarchy level as Stage 1 named it (01-companies.yaml), picked when the node is added. A
  site (Type Site) sits at the top of its company''s tree; a building (Type Location) sits under its site.'
- 'Definitions: Description, Time Zone and the level''s code field, Site Code or Building Code. Northlake University
  codes its campus; Cedar Row and the Thermal Plant leave the code empty.'
- 'Keywords are the values assigned on that node. Department is assigned once on each site, and Inherited Keywords
  lists what each building then shows inherited: verify those, do not assign them again. The Department keyword type
  is seeded.'
- 'Cedar Row A, Cedar Row B and Cedar Row C also carry Meter Type = Sub-Meter, assigned directly on the building: A and
  B''s 124 apartment submeters and 4 house submeters, and C''s 50 water submeters, inherit it, and the utility meters in
  A and B override it with their own Utility Meter (03-meters.yaml). This is the one keyword that exercises inheritance
  and override below a building.'
- 'Status is a building''s Status page (Open or Closed, with an as-of date). A site has no Status page. Campus, Cedar Row
  and Central Plant buildings open 2024-01-01, the start of Northlake''s history in EEM, as their billing accounts do;
  the Ridgeline buildings open on the acquisition date, 2024-07-01, and Cedar Row C on its lease-up date, 2025-09-01.'
- 'Cedar Row C (added 2026-11-07) is a post-onboarding building: it is not in the 2024 intake packet or the ENERGY STAR
  property, and its utility services are outside this recipe. It exists for its 50 owned water submeters, which the
  installer keyed into the handheld system badly (Stage 3 Step 5, route CRCWTR).'
- 'Area is the node''s Area page (Floor Area in SqFt, with an as-of date). The 11 buildings with a floor area already
  hold their history; verify it. Sites, the outdoor nodes (Campus Grounds, Cedar Row Carport and Grounds, the two
  Ridgeline nodes) and Weather Reference carry none.'
- 'Floor area: MetaWorld_TBL.Area (the node''s own area, which rp_BuildingList, rp_BenchMark, rp_IndexList and
  rp_ProjectSummary read) is empty on every building although the Area history is there. A Definitions save writes
  the node''s in-memory area back over it (PRODUCT FINDING 36, not yet reproduced). Do not re-enter areas to repair
  it; record what the reports show.'
- 'Notes is the node''s Notes page (Note History, table code M2), one note per record that has one. Comment is
  guidance for whoever enters the record and is not typed anywhere.'
- 'Ownership: a building exists once, in the company that owns its site. The Northlake Thermal Plant company holds
  Central Plant and, since 2024-07-01, the Ridgeline Wind Site; Northlake University owns every campus building
  including the ones the Thermal Plant serves.'
- 'Ridgeline Wind Site (new, 2026-10-01): a second site in the Thermal Plant company with two outdoor nodes, Ridgeline
  Turbine Field and Ridgeline Substation. Once the site is saved, grant the two Ridgeline Points scopes waiting in
  Stage 1 (04-groups.yaml laterPermissions).'
- 'Added 2026-11-10 (variety; enter these, nothing above changes): the Northlake Toronto Campus site with the Toronto
  Research Hall (Eastern time, Canada, Ontario, area in square metres), and the Lakeshore Boathouse (a Closed status
  and an Area history of two rows). Node Contact is the node editor''s page of that name: it takes the same fields as an
  Account Contact (First Name, Last Name, Title, Phone, Email) and is filled on two nodes only, the Toronto Campus and the
  Ridgeline Wind Site; every other node leaves it empty. The Toronto and Boathouse buildings get no weather
  station (05-weather-stations.yaml is unchanged): the Toronto hall is outside the three Sacramento-area stations''
  reach, and the Boathouse is closed.'
