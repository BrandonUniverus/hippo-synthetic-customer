# Stage 2, step 3: Meters (Database Administrator > Nodes > Meter nodes; MeterDefinitionViewModel).
# One record per meter, key = the source model's meter id. Meter Definition is the group of
# fields under the node's own Definitions page, in the editor's order: Billing Account is the
# account number to pick, then the Utility Provider and Bill Cycle it brings. All three are blank
# for owned meters and the weather stations, which carry no provider or account.
stage: 2
step: 3
title: Meters
app: Database Administrator
screen: Nodes > Meter nodes
source:
- data/scenarios/demo-university-v1.yaml (accounts[].meters, ownedMeters)
- data/eem/northlake-eem-metaworld-stage1b-v1.yaml (meterSetup, weatherIndexTargets)
notes:
- '390 meters: 67 utility meters (on a billing account), 320 owned (no billing account, incl. 248 Cedar Row A and B
  apartment submeters, 124 apartments x electric + water), 3 weather-station meters. Ridgeline Wind (added 2026-10-01)
  brings 14: ten turbine pad meters and the Ridgeline Farm Transfer Meter on the Ridgeline transfer agreement, the
  Valley Electric interconnection meter, the met mast and the KSUU station. The handheld routes (added 2026-11-07) bring
  54 owned meters: Cedar Row C''s 50 water submeters (48 apartments, the house and the laundry, open 2025-09-01), three
  emergency generators and the Central Plant Main Switchgear.'
- 'A record''s Notes is that meter''s node note (Note History, table code M2) and Status its node Status page rows;
  the Stage 2 import enters both, and the Keywords, from the meters workbook.'
- 'Ridgeline Farm Transfer Meter is a logical billing meter: no channels, no keywords, no provider meter number, and its
  only point is the aggregate Ridgeline Farm Generated kWh 10m (06-aggregates.yaml). EEM''s Bill Generation prices the
  points under one meter and writes one bill per meter and month, so the monthly transfer statement
  is generated on this meter (Stage 7 step 8); billing the ten pad meters would write ten statements.'
- 'Ridgeline: the turbines are Electricity meters on SYN-RWL-G-0000001 (Utility Provider Ridgeline Wind, Bill Cycle
  1), with the turbine''s position tag RWL-WTG-01..10 as Provider Meter Number. The interconnection meter has
  multiplier 12000 (300:1 potential transformers, 200:5 current transformers at 34.5 kV). The met mast is an owned
  Weather meter: like the Science Center sensor group it is not a weather station, but unlike it it does carry the
  Weather measure type, so it will appear in the Weather Stations picker beside KSAC, KSMF and KSUU (PRODUCT FINDING 18)
  and must not be picked. Each Ridgeline meter opens on the acquisition date, 2024-07-01 (Status page).'
- 'Keywords for Ridgeline: create the keyword type Generation Source with attributes Wind and Solar on the Keywords
  page (catalog view) and add the attribute 34.5 kV to Service Voltage (the seed has 33.6 kV, not 34.5); both types
  take new values. Generation Source = Wind on the ten turbines and Solar on the three Helios arrays marks generation
  for report filters until the product can tell generation from use (PRODUCT FINDING 44).'
- 'The Meter editor (MeterDefinitionViewModel) has two identifiers: Meter Number, and Provider Meter Number, which is
  bound straight to MeterInfo.SerialNumber. A provider badge number and a manufacturer serial share that one field;
  a third identifier would be a new requirement (PRODUCT FINDING 16).'
- Utility Provider and Bill Cycle are set by choosing the Billing Account first; the account brings its provider
  with it, and Bill Cycle then lists that provider's cycles for the meter's company.
- Meter Number is the customer's own tag (the synthetic meter number below); Provider Meter Number is the provider-formatted
  number extracted from it, blank for owned and weather-station meters.
- 'Two Meter Numbers are longer than 30 characters: SCIENCE-CENTER-ENVIRONMENTAL-SENSORS (36) and
  LIBRARY-HISTORIAN-ELECTRIC-INTERVAL (35). Meter.SM_Code holds 60; builds before the October 2026 fix cut the number
  at 30 without an error, so check both numbers in full after entry.'
- 'Measure Type is the editor''s list (MeasureType names): Electricity, Potable Water, Natural Gas, Steam, Chilled
  Water, Weather and Sensor appear below. The packet''s electric, water and solar generation commodities map to
  Electricity and Potable Water; EEM has no solar measure type, so the three Helios PPA arrays are Electricity meters
  on Helios accounts. A new meter starts as Activity Level: change it before the first save.'
- Meter Multiplier is blank (defaults to 1) except Science Center Electric Lab Wing (40, current-transformer ratio),
  Central Plant Steam Production (10, header pulse value) and Central Plant Boiler Gas (3.0367, the pressure factor of
  its 30 psig delivery, (30 + 14.73) / 14.73).
- The 2 weather-station meters (KSAC, KSMF) carry measure type Weather and sit directly under the Weather Reference
  site (02-sites-and-buildings.yaml), not under a building. Science Center Lab Environment is indoor temperature and
  humidity, so it is a Sensor meter and stays out of the Weather Stations picker.
- 'Keywords (the node''s Keywords page, values already seeded): every utility meter gets Meter Type = Utility Meter and
  every owned submeter Sub-Meter. The Cedar Row A and B apartment and house submeters inherit Sub-Meter from their
  building (02-sites-and-buildings.yaml), and the utility meters in those buildings override it with their own Utility
  Meter. Electric utility services carry their Service Voltage, the plant boiler gas its Service Pressure, and plant,
  lighting, laundry and charging loads a System Component. Production meters and logical sources carry no Meter Type.'
- 'Status (the node''s Status page) is the meter''s SM history, the one bill validation reads (tests 41 and 42), and
  its list is SM''s: Open, Closed - Ex, Closed - Lo, To Be Determined, Temp, Removed, Obsolete, Landlord, Closed -
  Mass Sale. Every meter opens on its in-service date: 2024-01-01, when its billing account turns Active; the
  Ridgeline meters on the acquisition, 2024-07-01; the Library replacement on 2024-08-15, the day after the old meter
  closes as Closed - Ex. Meter_Save writes an Open row dated the day a meter is first saved, and saving the earlier
  Open row folds it in, as saving any status removes a later row of the same status. Without the backdated row,
  tests 41 and 42 would flag the meter''s 2024-2025 bills. Enter a sample on the Status page; the Stage 2 import
  sets every meter''s rows.'
- 'Added 2026-11-10 (variety): SYN-SGU-M-0050011, the Lakeshore Boathouse gas meter, with a Status history of Open then
  Removed (Removed is in the SM list above). It has one register point in 04-points.yaml with a Delta other than 1. It is
  the account''s only meter; Stage 4 owns rate assignments and this file gives it none.'
