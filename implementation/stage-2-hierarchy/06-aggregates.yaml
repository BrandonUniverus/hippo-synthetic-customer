# Stage 2, step 6: Aggregates. Two screens: an aggregate point is CREATED from the Nodes tree's
# "Create Aggregate Point" context menu (ordinary point editor fields, gateway is the
# Aggregation Gateway), then its MEMBERS are added on the top-level Aggregates workspace (nav
# item after Nodes): pick the aggregate, use the Add Points drawer, set Required and Multiplier
# per member, then Recalculate.
stage: 2
step: 6
title: Aggregates
app: Database Administrator
screen: Nodes (Create Aggregate Point) and the Aggregates workspace
source:
- data/eem/northlake-eem-metaworld-stage1b-v1.yaml (aggregateTargets)
notes:
- 'Create Aggregate Point: right-click the parent site or building in the tree, choose Create Aggregate Point, and
  fill it exactly like an ordinary point (Name, Measure Type, Unit, Interval); the gateway is set to Aggregation
  automatically.'
- 'Members: on the Aggregates workspace, select the aggregate, open Add Points, and pick from the eligible list
  (same company, time zone, measure type, interval and unit as the aggregate). Each member names its meter as the
  tree shows it, that meter''s number, and the point under it. Set Required and Multiplier per row;
  Science Center Net Electric kWh has one member at Multiplier -1 and Required unchecked (delivered minus generated,
  and generation may be offline).'
- 'Cedar Row A and B totals use a member template: every apartment''s electric submeter in that building, plus the
  building''s own house submeter (Required).'
- 'PRODUCT FINDING 14: an aggregate is registered (its PointAggregates_TBL row) once it has members; the web
  API''s SaveAggregate, the only path to PointAggregation_Save, refuses an aggregate without them, so no row is
  expected before the members. Database Administrator''s Save writes the members (PointAggregatePoints) and stops,
  so the aggregate is still unregistered after they are saved: the Aggregates workspace''s picker shows ID 0,
  Recalculate fails with error 51081, the aggregation job skips it, and the tree does not mark the node as an
  aggregate, so its Aggregate page stays hidden. Enter the members all the same: they key on the aggregate''s
  point, and PointAggregation_Save registers an existing aggregate point, so the fix (one call after the member
  save when the row is missing) also registers the aggregates entered before it. Recalculate waits for it.'
- 'Measure Type and Unit are written the way the editor shows them (Electricity, "KilowattHours - (kWh)"). The PV
  members are Electricity points (EEM has no solar measure type), which is also what lets the Science Center Net
  Electric aggregate take its generation member: members must match the aggregate''s measure type.'
- '11 aggregates: 4 members each for the two campus electric totals, 2 for the campus solar total, 2 for the campus
  chilled-water total, 2 for Science Center Net Electric, 61 for Cedar Row A (60 apartments + house), 65 for Cedar
  Row B (64 apartments + house), 10 each for the three Ridgeline farm totals (generated kWh, active kW, possible kW)
  and 2 for Ridgeline Net Export.'
- 'Ridgeline (added 2026-10-01): the farm totals are the first 10-minute aggregates. Active and possible power sit on
  the Ridgeline Wind Site; Ridgeline Farm Generated kWh 10m sits under the Ridgeline Farm Transfer Meter (03-meters),
  because it is the quantity the generated transfer statement prices and EEM''s Bill Generation reads only the points
  under one meter. Right-click that meter, not the site, to create it. Every member is Required: a
  turbine down for repair keeps reporting zero energy and full possible power, so a missing member is a data problem,
  not an outage. Generated kWh against possible kW is the
  expected-against-actual goal; the possible side is kW, not kWh, and no aggregate can turn one into the other, which
  is what a calculated point would do (PRODUCT FINDING 41). Ridgeline Net Export sits on Ridgeline Substation: export
  minus station service at 15 minutes, a second weighted sum with a -1 member.'
