# Stage 9, step 4: Task schedules (Web, #/tasks/manager) and two custom workflows plus one custom task
# (Configuration Tool, Workflow Designer). VERIFIED against the installed Task_Tbl (41 rows) and Workflow (18
# built-in rows) before writing this file. `kind` on each record distinguishes a plain schedule on an existing
# task, a new multi-step workflow, and the one new task.
stage: 9
step: 4
title: Tasks and workflows
app: Web, Configuration Tool
screen: tasks/manager, Workflow Designer
source:
- generators/documents/sources/implementation/dream-customer/phase6-operations-engagement-spec.md
notes:
- 'tasks/manager fields (CreateTaskItem): pick a Task, then One Shot / Interval (>=300s, the task''s
  MinIntervalSeconds floor) / Cron, a target machine, and Active. Run Now is available per item. TaskType buckets
  (verified, 6 rows): 1 System Tasks, 2 Standard Alerts, 3 EEM Gateways, 4 Report Tasks, 5 MFR Reports, 6 Bill
  Importer Tasks.'
- 'The 12 standard-schedule records below are all existing Task_Tbl rows (verified: Daily Administration 17,
  Process HDD/CDD Calculations 25, Run DataGap Calculations 28, Run Bill Validation 27, Late Bills 13, Populate
  Warehouse 23, Run Bill Importer 43, Alarm Mail Service 4, Gateway Status 12, Energy Star 19, Energy Star
  Automation Task 20, Weather Normalization Sync 48); nothing to create for these, only a schedule. (Alarm Mail
  Service is also the alarm_mail_task record in 02-alarms.yaml; it appears once here for the full schedule list.)'
- 'Workflow Designer screens (verified file layout): WorkflowsDashboardView lists workflows; WorkflowDesignerView
  opens one on a node-based canvas (WorkflowFlowCanvasView/WorkflowFlowNodeRowView). The installed Workflow table
  ships 18 built-in single-purpose workflows (SQLJobs, SQLEmailer, Alarm Mail Notification, each gateway type,
  BillImporter, AP Upload Emailer, Anonymize User Data); a custom workflow in this stage composes several of
  those components into one multi-step flow and gets its own WorkflowId/WorkflowVersion.'
- 'The custom Northlake task (proposed): "Nightly Campus Load Summary" -- a Report Task built on the existing
  SQLEmailer workflow (id 2, verified: "Runs a SQL emailer command, then sends the result as HTML tables or
  per-result-table CSV attachments"), no new workflow needed. Its SQL summarizes yesterday''s electric kWh, gas
  therms and cost per Northlake Main Campus building and emails it as an HTML table.'
