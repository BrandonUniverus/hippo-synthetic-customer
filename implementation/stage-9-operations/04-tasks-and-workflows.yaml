# Stage 9, step 4: scheduled tasks and workflows. Rewritten 2026-11-10 against the product's current built-in task catalog
# (src/Domain/Services/EEMSuite.Domain.Services/Admin/Tasks/BuiltInTaskCatalog.cs, Revision 4). Three screens, one job each:
#   Web, Task Dashboard > Tasks (#/tasks/manager redirects there): the schedules of the tasks a customer may schedule.
#   Configuration Tool > Maintenance: the built-in maintenance procedures each machine runs, with a schedule apiece.
#   Configuration Tool > Tasks (Task Editor) and Workflow Designer: a custom task, and the two custom workflows.
# Task run history is no longer TaskLog or WorkflowRun (both retired by Scripts/RetireTaskLogs.sql): every run is a
# dbo.TaskRun row (TaskRunId, TaskName, StartedAt, EndedAt, FinalStatus, SummaryText, ErrorCount) shown in the Task Dashboard
# and the Task Log report (rp_TaskLog); log lines are in the application log (Log Viewer).
stage: 9
step: 4
title: Tasks and workflows
app: Web, Configuration Tool
screen: Task Dashboard > Tasks; Configuration Tool > Maintenance; Configuration Tool > Tasks; Workflow Designer
source:
- generators/documents/sources/implementation/dream-customer/phase6-operations-engagement-spec.md
notes:
- 'The catalog today (BuiltInTaskCatalog.Definitions): Workflow Quick Run, Anonymize User Data, Export User Data, Alarm Mail
  Notification, Run WUI Process, Bank of Canada Currency Update and Publisher are SystemOnly (the product owns them; the
  Task Library shows them read-only). AP Emailer Task has CanSchedule false (it runs when an AP file is uploaded, Stage 6).
  BIP Automated Import and Password Expiration Notification are the two built-in tasks a customer schedules. Maintenance SQL
  (SystemOnly) carries 13 maintenance entries, edited on the Configuration Tool Maintenance page, not on the Task Library.
  Gateway tasks (Stage 3) and any task made in the Task Editor are the rest of the library.'
- 'Task Library schedule form (taskScheduleForm.ts, schedule-editor.ts): Description (required), Machine (when the task has more
  than one target), Status Enabled, then Schedule with How often = Once at... / Every N (minute, hour, day, week; the floor is the
  task''s Min Interval, 300 s) / At specific times (Daily, Weekdays, Specific weekdays, Day N of month, Last day of month,
  Nth weekday of month, each at HH:MM) / Custom cron; Start date; Run forever, or an end date; then the task''s parameters.
  The ScheduleKind stored is 0 once, 1 interval, 2 cron (TaskSchedules.sql); the presets store a cron expression.'
- 'Configuration Tool > Maintenance (MaintenanceView, MaintenanceScheduleEditorView): pick a Machine, then each procedure shows
  an Enabled toggle and its schedule (a Quartz cron, with a Time zone); procedures that share a schedule run top to bottom in
  their run order. Assign built-in maintenance (Repair or Full reset) puts the 13 built-in rows on a machine. Built-in rows
  arrive switched off (BuiltInMaintenance_Ensure inserts IsEnabled = 0); the records below say which Northlake switches on.'
- 'Where the old 12 standard schedules went (Task_Tbl ids 4, 12, 13, 17, 19, 20, 23, 25, 27, 28, 43, 48 are history):
  Process HDD/CDD Calculations is the Degree-day calculations entry (DEGREE_DAYS); Run DataGap Calculations is Data gap
  monitoring (DATA_GAPS); Run Bill Validation is Bill validation (BILL_VALIDATION); Populate Warehouse is Warehouse upkeep
  (WAREHOUSE_UPKEEP); Weather Normalization Sync is Weather normalization (WEATHER_NORMALIZATION); Run Bill Importer is BIP
  Automated Import. Removed with no equivalent: Daily Administration (17, also absent per ADR-002c line 273), Late Bills (13) and
  Gateway Status (12) as scheduled tasks (their reports rp_LateBills and rp_GatewayStatus remain), Alarm Mail Service (4, now
  the SystemOnly Alarm Mail Notification, nothing to schedule), Energy Star (19) and Energy Star Automation Task (20) (not in the
  catalog: if Stage 8 step 4 made an ENERGY STAR task in the Task Editor, its schedule is entered there).'
- 'BIP Automated Import is both a built-in task (BIP_AUTOMATED_IMPORT, Task Library) and a maintenance entry
  (BIP_AUTOMATED_IMPORT, procedure BillImportPro_ImportTask, every 5 minutes). Both run the same procedure, so Northlake enables at
  most one. The Task Library schedule below is left Enabled off because Stage 5 imports its bill files by hand and an automatic
  import would race it; the maintenance row stays off too. Whether both should exist is a product question (finding candidate).'
- 'Built-in maintenance with a configuration prerequisite does nothing until it is met: Bill validation needs the system
  constant IsValidateBillsJob on, Configuration audit retention needs ApplicationAudit:RetentionDays. Northlake switches both
  rows on; they run empty until the setting exists.'
- 'Workflow Designer screens (verified file layout): WorkflowsDashboardView lists workflows; WorkflowDesignerView opens one on a
  node-based canvas. A custom workflow composes components (gateway, BillImporter, Sql, SQLEmailer, ...) into one multi-step
  flow and gets its own WorkflowId and WorkflowVersion. A task is then made in Configuration Tool > Tasks (Add Group, Add task:
  Name, Description, Task Code, run kind Workflow with Latest or Pinned, or Executable; Can Schedule, Single Schedule,
  Min Interval; default parameters) and scheduled on the Task Library.'
- 'The custom task, Nightly Campus Load Summary, is a task on the existing SQLEmailer workflow, no new workflow: its SQL
  summarizes yesterday''s electric kWh, gas therms and cost per Northlake Main Campus building and emails it as an HTML
  table. It carries two schedules, so Single Schedule is switched off on its task.'
- 'Alarm Mail Notification (what mails the Stage 9 step 2 alarms) is product-owned and is not scheduled here; see the last
  record of 02-alarms.yaml.'
