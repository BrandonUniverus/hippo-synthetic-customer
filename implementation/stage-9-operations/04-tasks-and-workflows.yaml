- key: sched_password_expiration
  kind: task_schedule
  installed: {taskItemId: }
  Task Dashboard > Tasks:
    Task: Password Expiration Notification
    Description: Password expiration notice, weekdays 06:00
    Status: Enabled
    How often: At specific times, Weekdays at HH:MM
    Time (HH:MM): '06:00'
    Run forever: true
    Parameters: {To: jordan.hale@northlake.example.edu}   # assumed: the Northlake administrator who would handle expiring passwords
- key: sched_bip_automated_import
  kind: task_schedule
  installed: {taskItemId: }
  Task Dashboard > Tasks:
    Task: BIP Automated Import
    Description: BIP automated import
    Status: Enabled off   # assumed, see the note on BIP above
    How often: Every N, 5 minutes
    Run forever: true
