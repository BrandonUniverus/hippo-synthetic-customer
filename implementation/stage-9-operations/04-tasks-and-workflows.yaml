- key: workflow_bill_download_validate_notify
  kind: custom_workflow
  installed:
    workflowId:
    workflowVersionId:
  Workflow Designer:
    Name: "Bill Download, Import, Validate, Notify Finance"
    Steps: "download the provider bill file (existing gateway component appropriate to the file source) -> BillImporter
      workflow component -> Run Bill Validation -> SQLEmailer notifying the NLU Rates Admins group of results"
  scheduledAs: a new task on this workflow, daily 07:00
- key: workflow_gateway_regression_alert
  kind: custom_workflow
  installed:
    workflowId:
    workflowVersionId:
  Workflow Designer:
    Name: "Gateway Read, Publish, Weather Regression, Alert"
    Steps: "run the AcquiSuite/MV90 gateway component for a metered building -> publish normalized interval readings
      (built into the gateway component) -> Weather Normalization Sync -> Alarm Mail Notification if the fit degrades"
  scheduledAs: a new task on this workflow, daily 04:00, after the gateway's own interval schedule
- key: nightly_campus_load_summary
  kind: custom_task
  installed:
    taskId:
    taskItemId:
  Task Manager:
    Task: Nightly Campus Load Summary
    Type: Report Tasks
    "Built On": "SQLEmailer (Workflow 2, existing)"
    Query: "yesterday's electric kWh, gas therms and cost per Northlake Main Campus building"
    Recipients: nlu_facilities_setup
    Schedule: "daily, 06:30"
