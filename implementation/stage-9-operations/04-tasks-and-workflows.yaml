- key: workflow_bill_download_validate_notify
  kind: custom_workflow
  installed:
    workflowId:
    workflowVersionId:
    taskItemId:
  Workflow Designer:
    Name: "Bill Download, Import, Validate, Notify Finance"
    Steps: "download the provider bill file (existing gateway component appropriate to the file source) -> BillImporter
      workflow component -> Sql component calling uaBillValidate_Job (the procedure behind the Bill validation maintenance
      entry; assumed, the component's parameter names are read when it is dropped on the canvas) -> SQLEmailer notifying
      the NLU Rates Admins group of results"
  Task Editor: {Group: Northlake, Task: "Bill Download, Import, Validate, Notify Finance", Run kind: Workflow (Latest), Can Schedule: true}
  Task Dashboard > Tasks:
    Description: Bill download, import, validate, notify finance (daily 07:00)
    Status: Enabled
    How often: At specific times, Daily at HH:MM
    Time (HH:MM): '07:00'
    Run forever: true
- key: workflow_gateway_regression_alert
  kind: custom_workflow
  installed:
    workflowId:
    workflowVersionId:
    taskItemId:
  Workflow Designer:
    Name: "Gateway Read, Publish, Weather Regression, Alert"
    Steps: "run the AcquiSuite/MV90 gateway component for a metered building -> publish normalized interval readings
      (built into the gateway component) -> Sql component calling job_WeatherNormalization (the procedure behind the
      Weather normalization maintenance entry; assumed) -> SQLEmailer mailing the fit result to NLU Rates Admins if it
      degrades (replaces the earlier Alarm Mail Notification step: that workflow is the product's own and is not a
      component to compose)"
  Task Editor: {Group: Northlake, Task: "Gateway Read, Publish, Weather Regression, Alert", Run kind: Workflow (Latest), Can Schedule: true}
  Task Dashboard > Tasks:
    Description: Gateway read, publish, weather regression, alert (daily 04:00)
    Status: Enabled
    How often: Custom cron
    Cron: '0 0 4 * * ?'
    Run forever: true
  note: runs after the gateway's own interval schedule; this one uses the Custom cron mode, the others use presets.
- key: nightly_campus_load_summary
  kind: custom_task
  installed:
    taskId:
    taskItemIds: []
  Task Editor:
    Group: Northlake
    Name: Nightly Campus Load Summary
    Description: Yesterday's electric kWh, gas therms and cost per Northlake Main Campus building
    Task Code: NLU_CAMPUS_LOAD   # assumed; the Optional unique code field
    Run kind: Workflow, SQLEmailer (Workflow 2, existing), Latest
    Can Schedule: true
    Single Schedule: false   # two schedules below
    Default parameters: {Query: "yesterday's electric kWh, gas therms and cost per Northlake Main Campus building", To: nlu_facilities_setup}
  Schedules:
  - {Description: Nightly campus load summary (daily 06:30), Status: Enabled, How often: "At specific times, Daily at HH:MM", Time (HH:MM): '06:30', Run forever: true}
  - {Description: Nightly campus load summary (pilot send), Status: Enabled, How often: "Once at...", Start date: '2026-12-01 06:35'}   # assumed date, the pilot send before the daily one is trusted
