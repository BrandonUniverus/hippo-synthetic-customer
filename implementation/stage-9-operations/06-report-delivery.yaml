- key: monthly_building_energy_delivery
  kind: delivery
  installed:
    mfrDeliveryId:
  MFRDelivery:
    Delivery description: Monthly Building Energy to building representatives
    Email subject: Monthly Building Energy Report
    Delivery status: On
    Reports: Monthly Building Energy
    Recipients: (none individual)
    Groups: "the 12 Bldg Rep groups above (120 users)"
    Schedule: "cron 0 7 1 * *"
    Time zone: (GMT-08:00) Pacific Time (US & Canada); Tijuana
    Run forever: true
    Format: PDF
    PDF orientation: Landscape
  check: "delivery task log shows >=100 resolved recipients"
- key: weekly_cost_rollup_delivery
  kind: delivery
  installed:
    mfrDeliveryId:
  MFRDelivery:
    Delivery description: Weekly Cost Rollup to Finance
    Email subject: Weekly Cost Rollup
    Delivery status: On
    Reports: Weekly Cost Rollup
    Recipients: "samantha.ireland, morgan.patel (individual)"
    Groups: NLU Finance Distribution
    Schedule: "cron 0 6 * * 1"
    Time zone: (GMT-08:00) Pacific Time (US & Canada); Tijuana
