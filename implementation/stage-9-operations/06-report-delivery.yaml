# Stage 9, step 6: Report delivery (Web, MFRDelivery modal: Reports / Recipients / Groups / Schedule tabs, opened
# from a saved report's delivery action), plus the 13 new Database Administrator groups the deliveries recipient
# picker resolves through. `kind` distinguishes a distribution group from a delivery.
stage: 9
step: 6
title: Report delivery
app: Web, Database Administrator
screen: Users & Groups > Groups; MFRDelivery modal
source:
- generators/documents/sources/implementation/dream-customer/phase6-operations-engagement-spec.md
- generators/documents/sources/implementation/dream-customer/product-gap-backlog.md (item 8)
notes:
- 'MFR delivery editor (MFRDelivery.cshtml, viewMFRDelivery.ts, re-read 2026-11-10). Fields: Delivery description (required),
  Email subject (required), Delivery status (On / Off; Off is saved but does not run on schedule), then the Output card:
  Attach as PDF and/or Excel, PDF orientation (Portrait / Landscape, default Landscape), Impersonate reports (shown to
  administrators only: render each report once as the delivery owner and send the same output to every recipient; the
  review''s note that it is not on the editor is stale). Tabs: My Favorite Reports, Recipients, Groups, Schedule. Schedule has a
  Schedule / Run immediately toggle ("This delivery will run once when it is saved"), and under Schedule the shared schedule
  editor: Time zone, How often (Once at... / Every N / At specific times / Custom cron), Start date, Run forever or an end date,
  Next run. The records below set every one of these at least once; the Ridgeline delivery keeps Impersonate reports off.'
- 'Verified two levels deep: the persisted table MFRDeliveryRecipient_TBL DOES have an Email column (alongside
  RecipientKind/UserID/GroupID), so the data model can hold an email-only recipient -- but the picker DTO the web
  view binds (MFRDeliveryRecipientsDTO, viewMFRDelivery.ts) only offers UserID/DisplayName/CompanyID rows sourced
  from systemRecipients/systemGroups, with no free-text email input anywhere in the drawer. Backlog item 8 is
  confirmed exactly as described: the column exists, the picker never writes to it. The two external addresses
  the business wanted on the Weekly Cost Rollup delivery cannot be entered through the UI; recorded on that
  delivery record below as blocked intent, not entered.'
- 'SCALE DECISION: reaching 100+ recipients through individual Users would mean creating and maintaining 120+
  person records for people who exist only to receive a PDF. Proposing instead a Northlake Portfolio group model:
  one small Group per campus building/property, used purely as an MFR distribution list (it does not need to
  grant any permission -- a Group with zero Admin/Function/Report grants is still a valid delivery recipient).
  12 groups x ~10 users each = 120, comfortably over 100. This reuses the exact mechanism Stage 1 already used for
  permission groups, just for a different purpose.'
- 'Roster generation rule (not enumerated, per the brief): for each of the 12 Bldg Rep groups below, create 10
  users named Building Rep <NNN> (NNN 001-120, sequential across the whole roster so no two groups repeat a
  number), User Name bldgrep<NNN>, Email bldgrep<NNN>@northlake.example.edu, Company matching the group''s
  company, Principal Type Human, Authentication Policy LocalAndFederated, member of exactly one group. Group 1
  gets 001-010, group 2 gets 011-020, and so on through group 12 (111-120). The 13th group, NLU Finance
  Distribution, is not part of the 100+ count and uses two already-installed Stage 1 users.'
- A distribution-only group needs no permission tree entries; create it on Users & Groups > Groups, save, and
  skip straight to adding it as an MFR recipient.
- 'Added 2026-10-01 (Ridgeline Wind): a fourth delivery, the monthly Ridgeline performance report, to two individual
  users, Mateo Alvarez (Northlake Thermal Plant) and Elena Vasquez (Northlake University). The delivery picker lists a
  company''s users only to an administrator, and only the author''s own company unless the author is a system
  administrator (DapperUserIdentityDTORepository.GetFrontendUsersAsync, behind UserEditor_RequireAccess), so a delivery
  that crosses two companies has to be authored by a system administrator, who keeps their own copy of the saved report
  (step 5). By default each recipient is rendered as themselves (MFRDelivery_TBL.ImpersonateReports off), so both must
  be able to run the report: Use Analysis on the Ridgeline Wind Site, which both hold. The same author question stands
  for the three deliveries above.'
