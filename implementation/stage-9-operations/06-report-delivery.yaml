- key: ridgeline_monthly_performance_delivery
  kind: delivery
  installed:
    mfrDeliveryId:
  MFRDelivery:
    Delivery description: Ridgeline monthly performance to the plant and the research lab
    Email subject: Ridgeline Monthly Performance
    Delivery status: On
    Reports: Ridgeline Monthly Performance
    Recipients: "mateo.alvarez, elena.vasquez (individual)"
    Groups: (none)
    Time zone: (GMT-08:00) Pacific Time (US & Canada); Tijuana
    Run forever: true
    PDF orientation: Landscape
    Impersonate reports: false   # the default; each recipient runs the report as themselves
    Schedule: "cron 0 7 2 * *"   # assumed: the 2nd, so the last month's final SCADA files are in and it does not queue with Monthly Building Energy (the 1st, 07:00)
    Format: PDF+Excel   # assumed: Excel for the lab's own analysis
  check: "delivery task log shows 2 resolved recipients, each sent a PDF and an Excel attachment"
