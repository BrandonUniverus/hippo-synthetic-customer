# Stage 9, step 2: Point Alarm Definition (Database Administrator, Nodes > point > Definitions > Point Alarm
# Definition tab). The Alarm Mail Notification task that emails when one fires is owned by the product (last record).
stage: 9
step: 2
title: Alarms
app: Database Administrator
screen: Nodes > point > Point Alarm Definition
source:
- generators/documents/sources/implementation/dream-customer/phase6-operations-engagement-spec.md
- data/scenarios/demo-university-v1.yaml
notes:
- 'Screen fields (PointAlarmDefinitionViewModel.cs and PointAlarmDefinitionView.xaml, re-read 2026-11-10): Activation (Normal,
  Disabled, Suspended), Priority (PriorityLevels, verified 5 rows: 1 Informational, 2 Warning, 3 Important, 4 Critical,
  5 Emergency), Notify User, Notify Group, Alarm Type, Deadband, then for an analog point the ladder High Alarm / High
  Warning / Normal / Low Warning / Low Alarm. A digital point instead gets a Severity reference state picker and four
  state colors/text (State 0-3) in place of the five thresholds. Disabled keeps the definition but records nothing;
  Suspended still records every alarm (PointData_UpdateAlarms.sql does not read it) and stops only the mail
  (AlarmNotification.sql filters SuspendAlarms = 0).'
- 'An analog alarm that is enabled needs all four thresholds, strictly ordered Low Alarm < Low Warning < High Warning <
  High Alarm (PointAlarmRules.ValidateThresholds; the screen refuses the save otherwise). Normal is the band between
  them: it has a colour and no value. The earlier records that left Low Warning and Low Alarm blank could not have been
  saved; every enabled analog alarm below now carries all four. Only a Disabled alarm is exempt.'
- 'Not on the screen, so not entered: Log State Change (the view model carries LogStateChangeOptions and writes
  DisableDigitalLogging, but PointAlarmDefinitionView.xaml binds no control to it, grep 2026-11-10) and any accumulator
  alarm (the view model sets IsAccumulator, but the view has a threshold section for analog points and a state section for
  digital points only). Both are product finding candidates. The Alarm Testing command named in last night''s review does
  not exist in the Database Administrator source.'
- 'CORRECTION: AlarmType is a 1-row system lookup (verified: only "default", ResourceSet db_alarming_default).
  There is no per-scenario Alarm Type choice ("high-demand", "chiller-fault", "data-gap", "high-usage" are this
  chapter''s names for what each alarm is watching, not a field value); every record below uses Alarm Type
  default and the distinction lives entirely in the threshold values and Priority.'
- 'CORRECTION: the data-gap alarm point is Student Center''s electric interval, not Science Center''s. Verified in
  data/providers/valley-electric-district.yaml: scenarioHooks lists missing_interval_backfill with
  targets: [student_center] (role primary); Science Center has no backfill scenario. Point on the same building
  as step 7''s Neptune/MVRS handheld work for a different reason is a coincidence, not a dependency.'
- Points are named by their Stage 2/3 scenario channel id since Stages 2-7 are running in parallel; look each one
  up by display name once installed PointIDs are recorded.
- 'Notify User/Group use Stage 1 people and groups (installed already): jordan.hale and NLU Facilities Setup for
  the campus points, valerie.kim and CRA Housing Ops for Cedar Row.'
- 'Added 2026-10-01 (Ridgeline Wind): 11 more alarms, on the ten Turbine State points (digital) and the met mast''s
  Hub-Height Wind Speed 10m (analog), for 15 in all, and two goals that enter nothing. The people notified are the
  plant''s: Mateo Alvarez and ntp_wind_ops, a Northlake Thermal Plant group, which is why the Notify Group is the plant''s
  copy (the group and the node must be in the same company). State text and colours are the Thermal Plant company''s own
  digital defaults (Company_TBL State0 to State3 for CompanyID 5, verified: 000000, 008000, FF0000, FC8040, which are
  black, green, red and orange).'
- 'Normal is the band between the thresholds: the screen shows its colour and no value (PointAlarmDefinitionView.xaml),
  so the Normal figures on the records above are reference baselines, not entries, and the Ridgeline analog record
  leaves it blank.'
- 'What a digital alarm does (read from PointData_UpdateAlarms.sql, PointData_DigitalSave.sql, AlarmNotification.sql and
  the screen''s XAML, not yet run on Ridgeline data): every change of state is recorded as an AlarmData row whose
  Severity is Priority x the distance between the new state and the point''s Severity reference state (line 131 of
  PointData_UpdateAlarms.sql: Priority x ABS(new state - reference)). The Point Alarm Definition screen has had a
  Severity reference state picker since 2026-10-05 (PointAlarmDefinitionViewModel.NormalStateOptions /
  SelectedSeverityReferenceState; label "Severity reference state", cleared = State 0). The earlier note that no screen
  sets it was true on 2026-10-01 and is stale. With the picker left clear (reference State 0) Turbine State gives Stopped
  no severity, Running 1 x Priority, Fault 2 x Priority and Curtailed 3 x Priority. Set to Running (State 1), as on all
  ten turbines below, Running is the quiet state (0) and Stopped and Fault both score 1 x Priority, Curtailed 2 x Priority.
  The picker therefore moves the zero point; it still cannot single out Fault, because severity is a distance and Stopped is
  as far from Running as Fault is. Proposed finding, reworded from 55.'
- 'Coverage across the 15 alarms (so each alarm-editor option is entered at least once): Activation Disabled on the
  data-gap alarm; Activation Suspended on WTG-07; Severity reference state Running on all ten turbines (left clear on the
  chiller); Priority 1 Informational (data gap) and 5 Emergency (met mast); Low Warning and Low Alarm on all three enabled
  analog alarms; every alarm keeps a Notify User and a Notify Group (both pickers have CanClear off, so a blank one is not
  offered). All invented values carry # assumed.'
records:
- key: student_center_demand_alarm
  installed:
    pointAlarmId:
  Point: ch_ved_student_center_kw_15m (Student Center Electric Main, demand kW)
  Activation: Normal
  Priority: 4 Critical
  Notify User: jordan.hale
  Notify Group: nlu_facilities_setup
  Alarm Type: default
  Deadband: 5
  High Alarm: 850     # kW; assumed threshold above the summer-event peak
  High Warning: 750    # assumed
  Normal: 500           # assumed baseline midday demand
  Low Warning: 60       # kW; assumed: the overnight base load sits above it, a dead meter or a tripped feeder falls below
  Low Alarm: 20         # kW; assumed
- key: chiller_enable_fault_alarm
  installed:
    pointAlarmId:
  Point: ch_modbus_ntp_chiller_enable_status (Chiller Enable Status, digital)
  Activation: Normal
  Priority: 3 Important
  Notify User: jordan.hale
  Notify Group: nlu_facilities_setup
  Alarm Type: default
  Severity reference state:   # left clear on purpose: the default, State 0 (Chiller Off), is the quiet state
  State Colors:
  - {State: 0, Text: Chiller Off, Color: '#008040'}
  - {State: 1, Text: Chiller Enabled, Color: '#008040'}
  - {State: 2, Text: Chiller Fault, Color: '#FF0000'}
  - {State: 3, Text: Unknown, Color: '#FF8000'}
- key: student_center_data_gap_alarm
  installed:
    pointAlarmId:
  Point: ch_ved_student_center_kwh_15m (Student Center Electric Main, interval kWh; the missing_interval_backfill target)
  Activation: Disabled   # assumed. A threshold alarm cannot see missing rows (see Note), and an enabled analog alarm would need four thresholds
  Priority: 1 Informational   # assumed
  Notify User: jordan.hale
  Notify Group: eem_gateway_reports # Northlake University copy (CompanyID 6); Avery's membership is pending cross-company support.
  Alarm Type: default
  Deadband: 0
  Note: Data gaps are not found by a point alarm. They are found by the Data gap monitoring maintenance entry
    (DATA_GAPS, hmDataGap_Exec, step 4) and read in the data gap reports; PointData_UpdateAlarms.sql raises an AlarmData row
    only from a value crossing a threshold or a digital state changing. This record keeps the point's notify user and group
    and exercises Activation Disabled; its thresholds stay blank because a disabled alarm is exempt from the four-threshold
    rule. The missing_interval_backfill window is exercised by the monitor, not by this record.
- key: cedar_row_water_alarm
  installed:
    pointAlarmId:
  Point: ch_fig_cedar_row_a_water_kgal_60m (Cedar Row A Water Master, Delivered kgal 60m, hourly analog; the point
    stage-2-hierarchy/04-points.yaml creates for this meter)
  Activation: Normal
  Priority: 2 Warning
  Notify User: valerie.kim
  Notify Group: cra_housing_ops
  Alarm Type: default
  Deadband: 0.2         # kgal per hour; assumed
  High Alarm: 3.0       # kgal per hour; assumed: about 3 times the average hour of a typical occupied month (650 kgal / 720 h = 0.9)
  High Warning: 2.0     # assumed
  Normal: 0.9           # assumed typical occupied-month average hour; reference only, the screen takes no Normal value
  Low Warning: 0.1      # assumed: almost no flow for an hour on the master meter of an occupied building
  Low Alarm: 0.02       # assumed
