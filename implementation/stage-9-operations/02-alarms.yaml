  Notify User: mateo.alvarez
  Notify Group: ntp_wind_ops
  Alarm Type: default
  Deadband: 1           # m/s; assumed
  High Alarm: 25        # m/s; assumed: the usual cut-out speed of a 660 kW class turbine, where it stops itself
  High Warning: 20      # assumed
  Normal:               # a band between the thresholds, no value on the screen
  Low Warning:          # not used; winter calms are ordinary (the generator bill for 2025-01-05 to 2025-02-04 exported 418,836 kWh) and a low reading cannot tell still air from a stuck sensor
  Low Alarm:
- key: goal_turbine_performance_ratio_alarm
  kind: goal
  goal: 41
  installed: {}
  Wanted: "An analog alarm on each turbine's performance ratio (generated energy over possible energy) and on the farm's, with a Low Warning and a Low Alarm, so a turbine that is Running but delivering well under its possible power alarms, which a threshold on a raw value cannot see; WTG-07's outage would read as a ratio of 0. The farm's ratio alone would only fall to about 87% with one of ten turbines down, so the per-turbine ratio is the one that catches it."
  Needs: "A calculated point. EEM cannot derive one point from others by formula, and an aggregate is a weighted sum of like quantities (product finding 41), so it cannot divide Generated kWh 10m by Possible kW 10m x 10/60 either. Until it exists the alarms above watch raw values: a turbine's state and the wind."
  Low Warning: 90   # percent; assumed, against 96.7% for July 2024
  Low Alarm: 80     # percent; assumed, the same 80% the Radar scorecard paints orange at (goal 47)
- key: goal_met_mast_stuck_anemometer_alarm
  kind: goal
  goal: 41
  installed: {}
  Wanted: "An alarm when the met mast's Hub-Height Wind Speed 10m holds one value for hours (a stuck or iced anemometer), which a threshold cannot see: still air and a stuck sensor read alike."
  Needs: "A derived point such as the wind speed's rolling range over the last few hours, which is the same mechanism as the performance ratio (calculated points, goal 41). The data-gap alarm cannot do it: the rows keep arriving."
- key: alarm_mail_task
