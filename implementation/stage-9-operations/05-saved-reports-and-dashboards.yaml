# Stage 9, step 5: My Favorite Reports library (Web, Save-as-Favorite drawer on any report, and
# #/MyFavoriteReports/Index for dashboards). `kind` distinguishes a saved report, a dashboard, the two
# business-proposed "custom reports" (which are saved reports too, see the note below) and a goal (something the
# product cannot do yet; nothing is entered for it).
stage: 9
step: 5
title: Saved reports and dashboards
app: Web
screen: Save-as-Favorite drawer, MyFavoriteReports/Index
source:
- generators/documents/sources/implementation/dream-customer/phase6-operations-engagement-spec.md
notes:
- 'Verified table shape: GUIMFRSavedReports (Title, GuiReportID, ReportRecentID, URI, Dashboardable) is a named,
  parameterized SNAPSHOT of an existing report, not a new report definition; GUIMFRDashboards (Title, PublicFlag,
  Columns) + GUIMFRDashboardReports (Sequence, DashboardColumn, RefreshRateInMinutes) arrange saved reports into
  tiles.'
- 'What "custom report" means in this product: there is no screen to register a brand-new, SQL-backed report type.
  The 2 items below the business calls "custom reports" are entered as named, parameter-locked Favorites of an
  existing report -- the closest the product has to a customer-specific view -- created from that report''s own
  Save-as-Favorite drawer, not from a report-authoring screen.'
- 'Save-as-Favorite fields: Title, which module it files under, and whether it is Dashboardable; the report''s
  current filter/parameter state (building, date range, commodity) is what gets snapshotted.'
- 'Confirmed finding, carried in the chapter''s Findings section: no screen registers a new report type.
  ReportMenuItemDTOController.Save (api/ReportMenuItem/Save) can re-file an EXISTING ReportOptionId into a
  different module/submodule, but nothing in the web frontend (checked routing.ts and views/) or Configuration
  Tool calls it, and it does not create new report logic.'
- 'Added 2026-10-01 (Ridgeline Wind): 14 saved reports, 1 dashboard and 1 goal. Report keys checked in PermissionCatalog
  (rp_ScatterPlot and rp_MultiPointTrend are Use Analysis, G:17; rp_GatewayStatus is System Manager, G:15); "Based On" is
  the report route, as above. Mateo Alvarez (Ridgeline Wind Site Manager) owns three of the saved reports and the Ridgeline
  Operations dashboard, which he shares with his group ntp_wind_ops; the monthly one belongs to whoever authors its
  delivery (step 6). Elena Vasquez (Wind Energy Research Lab Director) owns the ten power curves and shares them with
  eem_ridgeline_research. Ownership follows the product: a shared dashboard can hold only its owner''s own saved reports,
  and a user who does not administer the target company can share only to a group of their own company that they belong
  to (GUIMFRDashboard_Save, GuiMFRPermissions_Save), so the plant''s dashboard cannot reach the university researchers
  and their power curves cannot reach the plant''s staff.'
- 'What the Ridgeline researchers (eem_ridgeline_research, Elena and Kai) can open: every Use Analysis report on the
  Ridgeline Wind Site, Points List and Point Data Map, and the shared power curves (a shared favorite is listed only for a
  user whose modules hold its report). They cannot open Gateway Status, Alarm Data Map or Task Log (the group holds no
  System Manager reports beyond the two), any bill report, or the plant''s dashboard. Dashboards need the function
  allow_dashboards (Allow User Dashboards, level 1) for the owner and every viewer: without it the dashboard list is empty
  (DapperReportingDataAccess.GetAllDashboardInfoByUserId). Stage 1 grants it through three groups: ntp_wind_ops (Mateo and
  the wind team, the Ridgeline Operations dashboard), eem_reports (Samantha and the Executive Overview''s viewers) and
  eem_gateway_reports (Jordan''s Facility Operations). The researchers'' group does not hold it, so Elena''s shared power
  curves reach Kai as favorites, not on a dashboard.'
- 'Reading the two reports for Ridgeline (from rp_MultiPointTrend, rp_ScatterPlot and wh_GetIntervalData, not yet run on
  Ridgeline data): Multi-Point Trend reads both farm points as demand and converts the energy point by its interval, so
  Generated kWh and Possible kW are both kW on one axis and "Use a separate axis for each point" stays off. Scatter Plot
  reads each point as usage, and a unit class outside its usage list (Power, Speed) is the reading times interval/60, so
  on 10-minute data Active Power kW and Nacelle Wind Speed may both plot at one sixth of the reading, with no unit on the
  axes; the shape and the fit are unchanged. The first point selected is the X axis: if power lands on X, reselect with
  wind speed first. Run the first power curve against the point''s own values before relying on its scale.'
- 'Dashboard editor (DashboardEditor.cshtml, viewDashboardConfiguration.ts, re-read 2026-11-10). Details card: Name, Columns
  (1 to 5, default 2), Public link (shown only to a user holding the public_dashboards function), Show data as (the public
  session''s user, "the public link shows only what this user is allowed to see"), Set as my homepage. Per tile, from the
  tile''s options button: Refresh rate (minutes, default 15), Open report (empty = do not open, Same window, New window) and, for
  chart reports only, Zoom mode (empty = none, Rolling, Specific). Shared report controls card: tick a control that two or more
  tiles share to set it once in Report Settings for all of them (the screen lists the candidates it finds). Dashboard Report
  Settings are applied to every viewer, the public session included. Sharing is on the dashboard list, not in the editor.'
- 'Stage 1 grants public_dashboards to no group (only allow_dashboards is granted, in four groups), so the Public link box and
  Show data as are hidden for every Northlake user until a group holds Public Dashboards. The Executive Overview record below
  sets them as intended; Stage 1 needs the grant first (reported to the Stage 1 owner).'
- 'Tiles and owners (changed 2026-11-10): a dashboard holds only its owner''s own saved reports, and the earlier tile lists named
  reports no saved-report record created (Gateway Status, Alarm Data Map, Task Log, GHG History, Benchmark Ranking). Facility
  Operations now lists three saved reports owned by jordan.hale, Executive Overview three owned by samantha.ireland. Daily
  Operations is based on the Task Log report alone: a saved report snapshots one report, and TaskLog plus GatewayStatus was two.
  Weekly Cost Rollup is based on Spend by Commodity (rp_SpendScene, AddSpendSceneReport.sql), not a nameless variant; the name is kept because the delivery is weekly.'
