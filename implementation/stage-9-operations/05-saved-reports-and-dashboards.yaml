# ---- Ridgeline Wind ----
- key: goal_ridgeline_expected_vs_actual_scorecard
  kind: goal
  goal: 47
  installed: {}
  Wanted: {Title: Ridgeline Expected vs Actual Scorecard, Module: Use Analysis, Visual: "Radar chart with its actual-against-target scorecard table", Params: "the ten Ridgeline turbines for one period, for example 2025-02-11 to 2025-04-22"}
  Needs: "A report that returns one row per turbine: the turbine name first (WTG-01 to WTG-10), then two number columns with GraphData on, Generated (the actual, from Generated kWh 10m) and Possible (the reference, from Possible kW 10m x 10/60, the energy the controller says the wind allowed), the second flagged seriesrole = 'reference' in the formatting result so the Radar draws it dashed and unfilled. It is developer work: a stored procedure with a ReportOptions row, a Radar row in ReportCharts, a grid and a Use Analysis permission entry, because no screen registers a report (product finding 23)."
  Scale: both series as a percent of one shared base   # assumed: each turbine's rated energy for the period, 660 kW x the hours in it. The Radar scale is fixed at 0-100% (RadarChartSettingsV1, normalized) and warns on any value outside it, so raw kWh cannot be returned
  Reads as: "The scorecard table beside the radar paints an axis orange when Generated falls below 80% of Possible (radarAlertRatio, default 0.8, in the chart's SettingsJson): WTG-07 from 2025-02-11 to 2025-04-22, and no axis at the fleet's 96.7% of July 2024, when the two outlines almost coincide."
  Today: "No shipped report feeds a Radar (ReportCharts holds none); the one consumer is the developer gallery, src/Documentation/Developers/Testing/ChartDashboardGallery.seed.sql. The farm trend below draws the same two quantities summed over the farm, as two lines."
# The plant's saved reports (Mateo's three, and the monthly one for the delivery). The date ranges are assumed: calendar 2025
# for the farm trend and February to December 2025 for WTG-07, so the outage and the recovery both show; the monthly one is
# relative because it is delivered every month.
