notes:
- 'Verified: AuditConfig already has 12 Active=1 rows tracking Bill.BL_Amount/FiscalYear/Period/PeriodStart/
  PeriodEnd, BillItem.BI_Amount/BI_Quantity, BillingAccount_Tbl.BA_BillingAccountNumber/Description/ProviderID, and
  Meter.SM_Code/BA_BillingAccountID. Nothing to enable; AuditLog fills the moment one of those columns changes
  (LogID, AuditID, KeyID, TableRowID, UserID, AsOfDate, PreviousValue, CurrentValue).'
- 'Verified: rp_ActivityTracker (stored procedure) counts, per user or per company, Logins from UserLogin_Tbl and
  Activity from GuiReportActivityLog (joined to GuiReports/GuiReportTypes, i.e. report views) between two dates.
  There is nothing to configure; sign in and open reports as several users and the counts populate.'
- 'CORRECTION: UserLogin_Tbl records a session once sign-in succeeds; it has no failure flag. casey.holt is
  Inactive (Stage 1), so the "disabled-user failed-auth" case proves itself by ABSENCE -- no UserLogin_Tbl row, no
  session -- not by a special failed-attempt row inside rp_ActivityTracker. If a separate identity/security audit
  table records the rejected attempt (the installed database has a broader AuditEvent table used by SAML/SCIM
  provisioning), that is a bonus signal, not something this report reads; do not chase it into a finding.'
- 'quinn.roberts is Stage 1''s cross-company auditor: assign each company''s eem_audit_readonly copy and local
  Points Read group. Northlake and Cedar Row also have eem_reports membership; Cedar Row has eem_sustainability_reports.
  The exact company/group pairs are in 05-users.yaml. Sign in once and open a report scoped to each other company
  to exercise cross-company access; Quinn has no rate-allocation administration grant.'
- 'Cross-company prerequisite: Quinn''s Cedar Row and Thermal Plant assignments are marked Pending cross-company groups
  in 05-users.yaml because the current membership save rejects additions outside the user''s home company. Keep this
  cross-company acceptance case pending until a supported assignment path exists; sharing does not copy memberships.'
- 'Added 2026-10-01 (Ridgeline Wind): the two university researchers read a site that belongs to another company, which
  makes them the case worth watching in rp_ActivityTracker: their logins and report views are counted under their own
  company, Northlake University (the report aggregates by user or by company), while the points they read belong to the
  Northlake Thermal Plant. One record below exercises it; there is nothing to configure.'
