# Stage 9, step 1: Project Tracking (Web, #/ProjectTracking/Editor, routed from #/reporting/ProjectTrackingConfiguration).
# One record per project. VERIFIED against ProjectTrackingEditorModels.cs and the installed ProjectCategory/
# ProjectType/ActivityCategory/ActivityType/EventCategory lookups -- the real editor is narrower than the phase 6
# design note assumed (see the correction below).
stage: 9
step: 1
title: Projects
app: Web
screen: ProjectTracking Editor
source:
- generators/documents/sources/implementation/dream-customer/phase6-operations-engagement-spec.md
notes:
- 'Editor fields (ProjectTrackingEditorSaveRequest, verified): Name, Hierarchy node, Currency Unit, Project Type
  (which carries its Project Category), Start Date, End Date, Primary Activity Type, Secondary Activity Type,
  Tracking Number, Operating Cost, Capital Cost, Incentives, and an Events list (Event Type, Measure Type, Unit,
  a monthly value series).'
- 'CORRECTION to the phase 6 design note: there is no "Design -> Procurement -> Install -> Commissioning -> M&V"
  activity sequence in the product. Verified: the only project-level activity lookup is ActivityCategory (1
  "Funding Source", 2 "Cogen Facility Fuel Source") with ActivityType children 7 Local Funding, 8 Project 2100, 9
  Utility Rebates (under Funding Source; category 2''s six fuel types do not apply to a building retrofit). A
  project carries exactly two of these, Primary and Secondary Activity Type -- they classify how the project is
  funded, not its construction phases. M&V is represented as Events over time (below), not as a phase.'
- 'Events use EventCategory (verified, 4 rows): 1 Implementation Costs, 2 Cost Savings, 3 Use Savings, 4 Renewable
  Energy. Each Event is a monthly value series (one row per month, a Value and a Start/End Date), so "M&V" in this
  product means adding a Cost Savings and/or Use Savings event and filling in the post-install months, not a
  status field.'
- ProjectType lookups are reference data with no create screen (as the design note already expected); the five
  types below (8, 2, 20, 3, 22) are existing rows, picked for the closest fit.
- Incentives is one decimal field. Cedar Row Solar''s "ITC" is entered as its estimated dollar value (30% of
  capital cost) with a note, since the field cannot hold a percentage or a program name.
- 'Added 2026-10-01 (Ridgeline Wind): WTG-07 Gearbox Replacement, the fifth project. There is no Generation category:
  ProjectCategory has 5 rows (1 Conservation, 2 Cost Avoidance, 3 Renewable Energy, 4 Water Conservation, 5 Water Cost
  Avoidance, verified), so a wind turbine repair is Renewable Energy with Project Type Wind (22). For that category the
  editor (viewProjectTrackingEditor.ts) offers the Cogen Facility Fuel Source list as the "Renewable activity" (No Cogen
  for a turbine) and no Secondary Activity Type; the schedule is a start month plus 1 to 12 months, so Start and End Date
  are whole months and every monthly series lies inside them; and a series is added as a pair (Generation in kWh and in
  USD), with no Implementation Costs series, the Capital Cost field holding the cost. The outage (2025-02-11 to
  2025-04-22) therefore sits inside an 11-month window that runs to the end of the scenario, so the months after the
  repair fit.'
- 'The four earlier records were written against the models file alone and have not been re-checked against those
  rules: a Secondary Activity Type of Local Funding is not offered (a Local Funding primary has no secondary at all),
  Cedar Row Solar Expansion, being Renewable Energy, is offered the fuel list and neither Local Funding nor Utility
  Rebates, their monthly series run past the project''s end month, and the drawer adds no Implementation Costs series.
  They are left as written; reconcile them when this step is entered.'
