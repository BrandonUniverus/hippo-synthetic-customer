- key: wtg07_gearbox_replacement
  installed:
    projectId:
  Name: WTG-07 Gearbox Replacement
  Hierarchy: Ridgeline Turbine Field
  Currency Unit: USD
  Project Category: Renewable Energy   # there is no Generation category (verified, 5 rows)
  Project Type: Wind
  Start Date: 2025-02-01   # whole months; the outage ran 2025-02-11 to 2025-04-22
  End Date: 2025-12-31     # 11 months, to the end of the scenario, so the months after the repair fit
  Primary Activity Type: No Cogen   # shown as "Renewable activity" for this category; assumed: nothing is burned
  Secondary Activity Type:          # not offered for a Renewable Energy project
  Tracking Number: NTP-PRJ-2025-001   # assumed: the plant's next number after NTP-PRJ-2024-001
  Capital Cost: 310000   # assumed: a capital repair, funded locally
  Operating Cost: 0
  Incentives: 0   # assumed: no insurance or warranty recovery
  Events:
  - {Event Type: Generation, Measure Type: Electricity, Unit: kWh, Monthly Values: "Feb-Dec 2025, WTG-07 Generated kWh 10m summed per month: February and April partial (the days outside the outage), March zero, May on the repaired turbine"}
