    systemConstantSet: false
  System Constants:
    Item: CustomerServer
    Type: String
    Value: "(blank until a sandbox/real Portfolio Manager account is obtained -- product backlog item 1)"
  note: "SystemConstantService.IsCustomerServerSetAsync() is what #/ESNewRatingRequest checks before it will submit
    (EnergyStarController.IsConfiguredForRequests). Obtaining the sandbox account is Brandon's own action item;
    the field stays blank in this pass."
