# Stage 8, step 4: ENERGY STAR property setup and rating requests (Web, #/ESPropertySetup and #/ESNewRatingRequest),
# plus the sandbox Portfolio Manager connection (Configuration Tool, System Constants) and the EnergyStar sync task
# (Web, #/tasks/manager). See [ENERGY STAR integration](energystar-integration.pdf) for the full property mapping.
# Rewritten 2026-11-10: each of the 13 properties now carries its address, year built, occupancy, uses with floor
# areas and details, and its energy meters, not only its primary use.
stage: 8
step: 4
title: ENERGY STAR property setup, rating requests, Portfolio Manager connection
app: Web, Configuration Tool
screen: ESPropertySetup, ESNewRatingRequest, System Constants, tasks/manager
source:
- data/scenarios/demo-university-v1.yaml (energyStarProperties)
- generators/documents/sources/implementation/stage-8-sustainability/energystar-integration.pdf
- generators/documents/sources/implementation/dream-customer/product-gap-backlog.md (item 1)
notes:
- 'ESPropertySetup grid columns (viewESPropertySetup.ts): Parent/Site, Property, Property Uses, Auto Update, Rating, Rating Date, Year
  Ending, Request Year Ending, and row actions Request Rating / View / Edit Property / History / Clear. It lists the company''s level-2
  nodes whether configured or not; a location not yet set up shows N/A under Property Uses and its only action is Edit Property (in-product
  help, property-list). 13 properties are configured: campus parent + 7 campus buildings, the Cedar Row multifamily property + 3 buildings,
  the Central Plant. PMPropertyID stays 0 until the pm_connection record below links it.'
- 'WHAT IS ENTERED PER PROPERTY (ESPropertyEditor.cshtml and the in-product help, SeedLanguageData.sql section property-details, energy-data-sources,
  property-use-details). Edit Property opens the editor: Details (Address, City, Country, State or Region and Postal Code, Year Built,
  Occupancy Percentage and Auto Update; the required ones are marked and the total floor area is added up from the uses), tabs Property
  Uses (Add Property Use: type and description, Primary, Gross Floor Area with its effective date, then Edit Details for the use''s
  own values), Energy Data Sources (Include per meter, with Energy From, Meter Type and, for some types, an attribute or a use) and
  Rating History (filled by requests). The earlier version of this file entered only Primary Use and Auto Update; the year built, occupancy,
  floor areas and use details were in the scenario file and were not carried. The Details come from data/scenarios/demo-university-v1.yaml
  (energyStarProperties); addresses are the Stage 2 node addresses.'
- 'Property Use Details: each use has its own list of values (Weekly Operating Hours, Number of Workers on Main Shift, Number of Computers,
  Percent That Can Be Cooled / Heated, Total Enrollment, Number of FTE workers, Grant Dollars, and for the other use types Number of
  Rooms, Computer Lab?, Dining Hall?, Months in Use, the parking sizes, the multifamily unit counts and so on; labels are the ENERGY
  STAR attribute names seeded in SeedEnergyStarReferenceData.sql). A blank value shows DEFAULT. Every required value must apply from
  the first day of the Year Ending month of the request or earlier, so the effective dates are 2023-01-01 for every floor area and detail
  (# assumed, before the first request, 2024-03). The label of a few attributes was not found in the seed (marked in the record); use
  the attribute the list offers for it.'
- 'Energy Data Sources: each property''s own utility BILL meters (Energy From Bills) are included, never the interval points beside
  them (counting both counts the energy twice, in-product help). The campus and the Cedar Row multifamily property are PARENTS and carry
  no meters of their own; their children do (# assumed: ENERGY STAR rolls the children up). Water meters are not included (ENERGY STAR
  water needs its own meter type; not asked here). The two Helios PV arrays are the property''s on-site generation: Meter Type Renewable,
  attribute Electric on Site Solar (the attribute offered on every electric meter, ESFacilityMeterClassTypeByMeter_Get.sql); the Cedar
  Row Solar Carport is on Carport and Grounds, which is not a property. The Library''s Old Meter closed on 2024-08-14 and carries that
  Inactive Date. Admin Hall is the one property whose uses decide eligibility: 60,000 sq ft of Office and 25,000 of Other - Education,
  which is 29.4% of 85,000, over the 25% cap, so it can be rated for metrics and gets no score once PM-connected.'
- 'Every request still fails alike until Portfolio Manager is connected: the editor and Request Rating check the property first (Year
  Built, required use details, twelve months of data on each included meter) and a request that passes is queued for the ENERGY STAR
  task. The Central Plant request of 2025 is the deliberate error row: leave its Energy Data Sources empty (no meter included) so it
  fails the check, as the file''s record says.'
- 'WHAT IS ENTERED PER PROPERTY (ESPropertyEditor.cshtml and the in-product help, SeedLanguageData.sql section property-details, energy-data-sources,
  property-use-details). Edit Property opens the editor: Details (Address, City, Country, State or Region and Postal Code, Year Built,
  Occupancy Percentage and Auto Update; the required ones are marked and the total floor area is added up from the uses), tabs Property
  Uses (Add Property Use: type and description, Primary, Gross Floor Area with its effective date, then Edit Details for the use''s
  own values), Energy Data Sources (Include per meter, with Energy From, Meter Type and, for some types, an attribute or a use) and
  Rating History (filled by requests). The earlier version of this file entered only Primary Use and Auto Update; the year built, occupancy,
  floor areas and use details were in the scenario file and were not carried. The Details come from data/scenarios/demo-university-v1.yaml
  (energyStarProperties); addresses are the Stage 2 node addresses.'
- 'Property Use Details: each use has its own list of values (Weekly Operating Hours, Number of Workers on Main Shift, Number of Computers,
  Percent That Can Be Cooled / Heated, Total Enrollment, Number of FTE workers, Grant Dollars, and for the other use types Number of
  Rooms, Computer Lab?, Dining Hall?, Months in Use, the parking sizes, the multifamily unit counts and so on; labels are the ENERGY
  STAR attribute names seeded in SeedEnergyStarReferenceData.sql). A blank value shows DEFAULT. Every required value must apply from
  the first day of the Year Ending month of the request or earlier, so the effective dates are 2023-01-01 for every floor area and detail
  (# assumed, before the first request, 2024-03). The label of a few attributes was not found in the seed (marked in the record); use
  the attribute the list offers for it.'
- 'Energy Data Sources: each property''s own utility BILL meters (Energy From Bills) are included, never the interval points beside
  them (counting both counts the energy twice, in-product help). The campus and the Cedar Row multifamily property are PARENTS and carry
  no meters of their own; their children do (# assumed: ENERGY STAR rolls the children up). Water meters are not included (ENERGY STAR
  water needs its own meter type; not asked here). The two Helios PV arrays are the property''s on-site generation: Meter Type Renewable,
  attribute Electric on Site Solar (the attribute offered on every electric meter, ESFacilityMeterClassTypeByMeter_Get.sql); the Cedar
  Row Solar Carport is on Carport and Grounds, which is not a property. The Library''s Old Meter closed on 2024-08-14 and carries that
  Inactive Date. Admin Hall is the one property whose uses decide eligibility: 60,000 sq ft of Office and 25,000 of Other - Education,
  which is 29.4% of 85,000, over the 25% cap, so it can be rated for metrics and gets no score once PM-connected.'
- 'Every request still fails alike until Portfolio Manager is connected: the editor and Request Rating check the property first (Year
  Built, required use details, twelve months of data on each included meter) and a request that passes is queued for the ENERGY STAR
  task. The Central Plant request of 2025 is the deliberate error row: leave its Energy Data Sources empty (no meter included) so it
  fails the check, as the file''s record says.'
- ESNewRatingRequest queues a request per property per year-ending date; it is fully local (ESRequestType 3 Building, verified row in
  dbo.ESRequestType) and does not need Portfolio Manager to save. Submitting it for real scoring does.
- 'EnergyStar sync task: Task 19 "Energy Star" (Energy Star Request Processor, EEMSuite.Tasks.EnergyStar, RatingSyncService) and Task
  20 "Energy Star Automation Task" (approves valid facilities), both verified rows in Task_Tbl. Schedule Task 19 to run every 300 seconds
  once pm_connection is in place; Stage 9 step 4 schedules it alongside the other standard tasks. Until then leave it unscheduled --
  running it against no CustomerServer just logs a skip, it does not error.'
- 'Eligibility (per energystar.gov, and the source-model note on Admin Hall): a property scores only when more than 50% of gross floor
  area is a score-eligible type and non-scoring uses stay under 25%. In the US the eligible-type set here is Office, Residence Hall/Dormitory
  and Multifamily Housing (Library scores only in Canada). Lakeview Residence Hall and Cedar Row Apartments score; Admin Hall is Office-primary
  but its 25,000 sq ft classroom wing is 29% of its 85,000 sq ft, over the 25% cap, so it gets metrics only, not a score.'
- The PM account username/password are the Energy Star task's own configuration parameters, not a System Constant (LegacyEncryptedCredentialProvider
  reads PMUsername/PMAccountPassword keyed EEMSuite.Tasks.EnergyStar) -- set them on that task's Parameters in Task Manager, not on
  pm_connection below.
- 'Added 2026-10-01 (Ridgeline Wind): the Ridgeline Wind Site is not an ENERGY STAR property (the Sustainability Office: a generating
  site, not a building, not benchmarked), so this file gains no property and no rating request and the count stays 13. Property Setup
  lists every level-2 node of the company, configured or not (ESGetPropertyList.sql:13-27,88), so Ridgeline Turbine Field and Ridgeline
  Substation appear under Northlake Thermal Plant with Primary Use N/a: leave them unconfigured, like Campus Grounds and Cedar Row Carport
  and Grounds. The one per-meter generation marker EEM has lives in this module, for the follow-on meter mapping: a meter on a property
  can carry the Renewables class, Electric on Site Solar (attribute 5) or Electric on Site Wind (6), offered on every electric meter
  (ESFacilityMeterClassTypeByMeter_Get.sql:93-117), and the sync then sends it to Portfolio Manager as the meter type in place of Electric
  (ESFacilityMeter_Get.sql:62; MeterMapping.cs:17; TypeOfMeter.cs:55). It describes generation on the property''s own site, and the
  sync reports zero energy exported off site for such a meter (MeterConsumptionMapping.cs:29-32). Ridgeline is about fifty miles from
  the campus and exports all of its output, so no Ridgeline meter is ever mapped to a property and the override is never set. Nor does
  Ridgeline change the Central Plant property: the VED-BCT credit on the plant''s Valley Electric bill is money, and the readings sent
  to Portfolio Manager are the meter''s billed energy quantities (ESMeterReading_Create.sql:120-135).'
