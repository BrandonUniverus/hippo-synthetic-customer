notes:
- 'WHAT THE SCREENS ARE (read in the product, 2026-11-10; the earlier steps did not match them). The Web report Weather Regression (rp_WeatherRegression)
  lists the company''s meters with their weather station and, if one exists, their latest fit: Building, Meter, Year Ending, Weather
  Station, Adjusted R2, Data Count, Balance_CDD, Balance_HDD, Factor_Day, Factor_CDD, Factor_HDD, T Test_Intercept, T Test_CDD, T Test_HDD
  and CVRMSE. Its notes band shows ''Baseline Year Ending FY/FP'' with a button that opens WeatherNormalization_SetPeriod, a popup titled
  Set new default Fiscal Year/Fiscal Period with two inputs, Fiscal Year and Fiscal Period (the baseline END; the company''s defaults
  are the SysConstants wnDefaultFY_<CompanyID> and wnDefaultFP_<CompanyID>, 2022 and 12 until set). Each meter row has Normalize (first
  run) or Re-Normalize and Meter Details; Normalize opens WeatherNormalization_Run, which calls FF_wnCore with the meter, the baseline
  year and the baseline period. There is NO ''pick the point'' step and NO ''Weather Inputs'' choice: the engine fits the heating and
  cooling balance points itself.'
- 'WHAT IT REGRESSES: the meter''s BILLED quantities (bill items of unit classes 3 energy and 7 volume, excluded items left out), per
  bill period, as a daily average over the 12 fiscal periods ending at the baseline end (FF_wncore.sql), against the weather station''s
  heating and cooling degree days. It does not read interval points. A demand regression (the Student Center kW) and an hourly point
  (the plant''s ton-hours) are therefore not inputs; the fourth regression is another meter''s billed kWh. A row shows its Normalize
  action only when the meter has a weather station and more than 11 bills of energy or volume up to the baseline (rp_WeatherRegression;
  its lower date bound, (FY-1)+FP, is a typo for (FY-1)*100+FP and admits any bill, a product defect that does not change this stage).'
- 'ORDER (Web, Weather Regression report, company Northlake University): (1) Set the baseline end, button in the notes band: Fiscal
  Year 2025, Fiscal Period 12, Submit. (2) Normalize on each of the four meters below, one at a time. (3) Read each row''s Year Ending
  (2025/12), Data Count and statistics on the report; Meter Details opens the popup. The Weather Normalization Sync (Task 48) then writes
  normalized bills only for a company that has a bill scenario named ''Weather Normalized'' (FF_WeatherNormalization.sql joins on that
  name; Stage 1''s scenarios do not include it, so no normalized bills are produced and the report is unaffected). SysConstants WeatherNormalizationTolerance
  and wnAllBills are not set here.'
- 'Weather: the KSAC station is the campus primary station (Stage 2 and 3 bind the meters). Data Count is the number of bills in the
  fit; 12 is expected for monthly-billed meters with all twelve 2025 bills. The statistics (Adjusted R2, balance points, factors) are
  computed, not typed: the synthetic bills were not generated from a known coefficient, so no coefficient is asserted. The expectations
  below are ranges (# assumed) and the checks assert only what is structural (4 rows, Year Ending 2025/12, Data Count 12, Adjusted R2
  at or above 0.5, the sign of the factor that drives the load).'
- The Ridgeline regression stays a goal, not a feature, as before (the engine's third variable is wired to 0 and normalizes with HDD
  and CDD only). FF_PopulateRegressions, which an earlier note relied on to fill every meter, is dropped by DropLegacyProcs.sql and
  is not a path.
