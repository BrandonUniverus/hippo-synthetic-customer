# Stage 8, step 5: Weather regression (Web report Weather Regression and its three popups).
# UI-THEN-RUN: set the baseline end, Normalize each meter, read the fit. The statistics are computed, not typed.
# Rewritten 2026-11-10 to match the screens; see the first notes.
stage: 8
step: 5
title: Weather regression
app: Web
screen: Web report Weather Regression (rp_WeatherRegression), with its WeatherNormalization_SetPeriod, _Run and _MeterDetails popups
source:
- src/Web/EEMSuite.Web/Views/Custom/WeatherNormalization_SetPeriod.cshtml, _Run.cshtml, _MeterDetails.cshtml
- Database/EEMSuite/Procs/rp_WeatherRegression.sql, FF_wncore.sql, FF_WeatherNormalization.sql
