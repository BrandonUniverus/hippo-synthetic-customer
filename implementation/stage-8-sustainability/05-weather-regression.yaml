- key: ridgeline_farm_wind_regression
  installed: {}
  WeatherNormalization_SetPeriod:
    Point: Ridgeline WTG-01..10 monthly output, summed; the driver would be Ridgeline Met Mast Hub-Height Wind Speed 10m (m/s) or KSUU
      Wind Speed (knots)
    Weather Inputs: wind speed is not offered; the engine takes HDD and CDD from one temperature point
  WeatherNormalization_MeterDetails:
    Expect: 'when built: output rises with wind speed along a curve, roughly the cube of speed between cut-in and rated and flat above
      it, so a straight line fits it poorly (goal 43 is the power-curve fit); leave out WTG-07, or February to April 2025, where zero
      energy is a gearbox fault and not weak wind'
  Engine today:
  - it regresses one meter's bills, as daily averages over twelve fiscal periods, on a temperature point's HDD and CDD (FF_wncore.sql:43-75),
    and no temperature point means no regression (FF_wncore.sql:117-124)
  - 'a third variable exists in FF_wnCore (@IndVarPtID, summed over each bill period and labelled Occupancy in its output: FF_wncore.sql:36,87,585,599),
    but FF_PopulateRegressions always passes 0 (line 121; its header calls the third variable TBD, line 37) and FF_wnCalculateRegression
    normalizes with the HDD and CDD factors only (line 167)'
  - a wind driver needs an averaged value (a sum of speeds means nothing), temperature made optional, a way to choose the driver, and
    the driver's factor used when normalizing
