    emissionFactorSourceId: 3
    emissionFactorSourceMemberId: 3
  Source: Non-electric commodities (existing; add Commodity Potable Water on the Sources screen first)
  Member: Non-electric commodities (existing)
  Emission Factor History:
  - {Emission Type: CO2, Commodity: Potable Water, Unit: "kg CO2e/kgal (assumed; confirm the offered unit)", History: [
      {Effective From: 2024-01-01, Emission Factor: 0.597},   # 3.2 kWh/kgal (RCU environmental) x the 2024 CAMX CO2e 0.1866 kg/kWh
      {Effective From: 2025-01-01, Emission Factor: 0.575}]}  # 3.2 kWh/kgal x the 2025 CAMX CO2e 0.1798 kg/kWh
- key: ridgeline_avoided_emissions   # computed outside the GHG screens; nothing is entered
  installed: {}
  Report: avoided emissions of the Ridgeline wind farm, kept with the RECs Northlake retains
  Generation counted: "the ten Ridgeline WTG-01..10 pad meters, Generated kWh 10m (the energy on the generated transfer statement), not the Valley Electric export credit (money, and measured at the substation 1.9% lower)"
  Formula: "monthly generated kWh x the grid factor of the year (0.1866 kgCO2e/kWh in 2024, 0.1798 in 2025); RECs = generated MWh x 1.0"
  Expect: "July 2024: 2,251,384 kWh generated (the hand-made statement fixes it), 420,108.3 kg CO2e avoided (420.11 t), 2,251.384 RECs; WTG-07 produces nothing from 2025-02-11 to 2025-04-22 (gearbox fault), so it avoids nothing in those months"
