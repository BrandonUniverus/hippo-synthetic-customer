    emissionFactorSourceId: 3
    emissionFactorSourceMemberId: 3
  Source: Non-electric commodities (existing)
  Member: Non-electric commodities (existing)
  Emission Factor History:
  - {Emission Type: CO2, factorId: 12, Commodity: Natural Gas, Unit: Tonne/MBtu, History: [
      {Effective From: 2024-01-01, Emission Factor: 0.0531},  # = 5.31 kg/therm, data/providers/sierra-gas-utility.yaml co2eFactor
      {Effective From: 2025-01-01, Emission Factor: 0.0537}]} # assumed: revised value
- key: water_embedded_energy_extension   # assumed, verify screen options before entering
