    emissionFactorSourceId: 4
    emissionFactorSourceMemberId: 67
  Source: eGRID (existing)
  Member: CAMX (WECC California) (existing)
  Emission Factor History:
  - {Emission Type: CO2, factorId: 175, Unit: lbs/MWh, History: [
      {Effective From: 2024-01-01, Emission Factor: 410.0},   # valley-electric-district.yaml co2eFactor lbPerMWh (synthetic; continues the CAMX trend 423->428->410)
      {Effective From: 2025-01-01, Emission Factor: 395.0}]}
  - {Emission Type: CH4, factorId: 201, Unit: lbs/MWh, History: [
      {Effective From: 2024-01-01, Emission Factor: 0.024},
      {Effective From: 2025-01-01, Emission Factor: 0.023}]}
  - {Emission Type: N2O, factorId: 227, Unit: lbs/MWh, History: [
      {Effective From: 2024-01-01, Emission Factor: 0.0029},
      {Effective From: 2025-01-01, Emission Factor: 0.0028}]}
- key: nonelectric_gas_history
