  Gateway: gw_bacnet_thermal_plant
  Gateway name: Northlake Thermal Plant BACnet
  Schedule kind: Interval
  Enabled: false
  Interval seconds: 3600
  Time zone ID: 33
  Parameters:
    GatewayId: 6
    LocalIpAddress: 172.21.29.4
    RootDirectory: C:\ProgramData\EEM Suite\NorthLake\Gateways\BACnet
  Source ID: gw_bacnet_thermal_plant
  Source prerequisite: Start services/bacnet on BVirtualPC and verify its health and collector-client probe before
    collection. LocalIpAddress 172.21.29.4 is the verified Ethernet 3 interface, not a device address. UDP 47808
    discovers devices 530101, 530102 and 530103; their unicast endpoints use ports 47820, 47821 and 47822. Keep
    the three gateway nodes BBMD fields blank. Update this local interface value if the network changes.
- key: schedule_noaa_ksac
  Task: task_noaa
  Schedule name: Northlake NOAA Current Weather
  Gateway: gw_noaa_ksac_observations
  Gateway name: Northlake NOAA Weather
  Schedule kind: Interval
  Enabled: false
  Interval seconds: 900
  Time zone ID: 33
  Parameters:
    GatewayId: 7
    Operation: Current
    HistoryStartUtc: ''
    RootDirectory: C:\ProgramData\EEM Suite\NorthLake\Gateways\Noaa
  Source ID: gw_noaa_ksac_observations
  Notes:
  - The three observation nodes collect twelve inputs (temperature, dew point, humidity and wind at each station)
    every 15 minutes; each station's Forecast node refreshes six separate hourly points (temperature, dew point,
    relative humidity, wind speed, wind direction and precipitation probability).
  - Keep this schedule disabled. Enable current collection only after Step 4 and the association checks are accepted.
- key: schedule_noaa_history
