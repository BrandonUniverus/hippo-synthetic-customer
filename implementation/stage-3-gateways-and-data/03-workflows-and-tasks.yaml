  Enabled: false
  Cron expression: 0 0 3 * * ?
  Time zone ID: 33
  Parameters:
    GatewayId: 7
    Operation: History
    HistoryStartUtc: '2024-01-01T08:00:00Z'
    RootDirectory: C:\ProgramData\EEM Suite\NorthLake\Gateways\Noaa
  Source ID: gw_noaa_ksac_observations
  Notes:
  - Enable after the initial observed-history import is accepted. History never writes forecast points.
