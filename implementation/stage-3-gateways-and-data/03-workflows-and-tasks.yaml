# Stage 3, step 3: complete task-entry values and prerequisites; do not start collection.
stage: 3
step: 3
title: Workflows and tasks
app: Configuration Tool for task definitions/defaults/targets; Web for schedules and runs
screen: Configuration Tool > Tasks (Northlake Gateways); Web > Tasks > Library > Add schedule; Workflow Designer for Fake
  Gateway
source:
- Installed EEMSuite_Northlake Workflow/WorkflowVersion definitions, verified 2026-11-03
- src/Tasks/EEMSuite.Tasks.Components/BuiltInWorkflows/*.json
- src/Tasks/EEMSuite.Tasks.Gateways/Fake/FakeGatewayComponent.cs
- src/Domain/Services/EEMSuite.Domain.Services/Admin/Tasks/CronToWindowsTriggerCompiler.cs
- Task_Tbl, TaskItems, TaskSchedules, TaskParams and TaskParamsDefault (installed schema)
- src/Web/EEMSuite.Web/frontend/src/scripts/hippo/views/taskDashboard/taskLibraryView.ts
- src/Domain/Services/EEMSuite.Domain.Services/Admin/Tasks/TaskParameterDescriptorService.cs
- services/sources/README.md and the published contracts/source-model.json
- services/bacnet/bindings.json and the Windows collector-client protocol probe, verified 2026-11-04
notes:
- 'Create one reusable task per workflow from tasks below. Enter Default parameters in Configuration Tool and
  leave GatewayId, RootDirectory and other schedule-specific defaults blank, including required fields. Add
  one BVirtualPC execution target with Run as profile blank. In Web > Tasks > Library, create each schedules entry
  under its Task, give it the exact Schedule name, and enter Parameters as schedule overrides.'
- GatewayId is a named picker. On each schedule, select its Gateway name; the numeric value is an installed
  lookup hint, not an ID to copy between installations. Leave the GatewayId default blank
  on reusable tasks. Keep existing execution targets; hidden legacy gateway metadata does not override the scheduled GatewayId.
- 'File workspaces use only the explicit RootDirectory below. Leave InputDirectory, WorkingDirectory,
  ArchiveDirectory, ErrorDirectory and OutputDirectory overrides blank in both task defaults and schedules.
  They resolve to Input, Working, Archive, Error and Output below the root. Use an override only when that folder
  must be elsewhere. Keep Northlake roots explicit even though installed gateways can default to InstanceDataPath/TaskData/family/GatewayId.'
- Blank task defaults are intentional, even on required fields; each schedule supplies its run-specific values.
  A null required schedule input is an unresolved prerequisite, never a value to paste. BACnet LocalIpAddress needs the Workers IPv4 interface on the BACnet network;
  the gateway uses UDP 47808. The companion services/bacnet emulator is verified on BVirtualPC Ethernet 3,
  172.21.29.4. Recheck that interface address if the host network changes; the collector discovers the devices
  locally, so leave each BACnet node's BBMD Address and BBMD UDP Port blank.
- Use the current workflow version. Do not pin a Northlake task to an older definition that bypasses the checked
  publication pipeline.
- 'Create 11 reusable tasks using ten built-in workflows and the custom Fake Gateway workflow, with 16 disabled
  schedules. MV90 has two schedules, NOAA has current and history, FIG has three, and Neptune has two.
  Required means a value must exist when the schedule runs; it does not require a task default. All parameter
  fields must remain visible so the schedule editor can supply or override them.'
- Create every schedule disabled. After Steps 3, 5 and 6 are configured, Step 4 may run selected tasks manually.
  Recurring enablement is a later explicit action, never part of saving these tasks.
- Choose a current or future Start in Pacific for schedule registration. The old 2024 dates describe sample/history
  data, not when to register a running schedule. Data ranges are set on the collector, such as NOAA HistoryStartUtc
  and Fake StartTimestamp/EndTimestamp.
- 'Installed 7.1.0.10 web editor: timezone-free DateTime defaults from Configuration Tool are interpreted as local
  time when a schedule is saved. For the UTC boundaries below, set the NOAA HistoryStartUtc and Fake StartTimestamp
  calendar controls to January 1, 2024 12:00 AM Pacific, and Fake EndTimestamp to January 1, 2024 11:45 PM Pacific.
  Verify the saved UTC values with checks.sql; the intended collector timestamps remain 08:00Z and 07:45Z, not
  an eight-hour shift.'
- 'Schedule kinds are Runs once (0), Interval (1) or Cron (2). All schedules use Pacific, TimeZoneId 33. IntervalSeconds
  must be at least 300. Cron has six fields: seconds minutes hours day-of-month month day-of-week.'
- MvrsGateway already includes HmrEventsPublish after IntervalDataPublish. Do not create a separate HMR Events Publish
  workflow, task, gateway or input-file handoff.
- Gateway IDs for the three handheld profiles remain unresolved until Step 5. Do not use illustrative source-model
  IDs or invent a placeholder ID to make a schedule save. Their reusable tasks may still be created with blank defaults.
- Do not modify the pre-existing DatabridgeII/Aggregation tasks. OdbcFileDataGateway is an exporter and BillImporter
  belongs to the billing stage; neither gets a Northlake acquisition task here.
- Run the workflow/task section of checks.sql as a stored-configuration check. Its default requires disabled schedules;
  set RequireDisabledSchedules to 0 only when checking a deliberately enabled deployment after Step 4. A successful configuration check does not prove ingestion.
taskDefinitionDefaults:
  Task group: Northlake Gateways
  Task group ID: 3
  Workflow version: Latest
  Minimum interval seconds: 300
  Can schedule: true
  Single schedule only: false
  Parameters visible: true
  Execution machine: BVirtualPC
  Machine ID: 2
  Run as profile: null
  Run as meaning: Blank inherits the Workers service account. The workflow execution profile Gateway is already
    part of the built-in definitions; it is not a user credential to enter.
gatewayEnablement:
  Screen: Profile Manager > Local Configuration > BVIRTUALPC > Gateway Runtime > GatewayRuntime
  Setting: Object Enablement
  Key: GatewayRuntime:ObjectEnablement
  Type: JSON
  Value: '{"AcquiSuite": true, "AerisWeather": false, "Bacnet": true, "Cmep": true, "Eaton": true, "Fig": true,
    "FixedNetworks": true, "Mdef": true, "Mediator": true, "Modbus": true, "Mv9": true, "Mvrs": true, "Neptune":
    true, "Noaa": true, "Odbc": true, "SiemansReport": true, "Spinwave": true, "Xml": true, "Fake": true, "DataBridge":
    false, "GraphQl": false, "Opc": false, "WeatherUnderground": false}'
  Notes:
  - Enable the listed component kinds before acceptance. Keep AerisWeather false; the NOAA task uses the separate
    NOAA collector.
  - Component enablement does not turn on schedules. Leave every Northlake task schedule disabled until its acceptance
    prerequisites are complete.
sourceService:
  Base URL: http://localhost:18081
  Contract: /releases/<release-id>/files/contracts/source-model.json (resolve release-id from /catalog.json)
  Current source coverage: 215 direct file-backed inputs across seven gateway profiles; BACnet, Modbus, ODBC and
    handheld sources are separate prerequisites.
  Delivery: No files are delivered automatically. Do not copy files or start a delivery command until Step 4 (after Steps
    5 and 6 are entered). Delivery uses each schedule Source ID and Parameters.RootDirectory/Input (or its explicit InputDirectory
    override); preserve source delivery subfolders, especially Spinwave SCIENCE.
  Required node changes:
  - Gateway: Northlake VED MDEF Interval Import
    Node: MV90-MDEF-VED-SCIENCE
    Node ID: 5
    Field: TimeStampType
    Value: UTC
    Verified current value: Local (2026-11-03)
  - Gateway: Northlake VED MDEF Interval Import
    Node: MV90-MDEF-VED-RECREATION
    Node ID: 6
    Field: TimeStampType
    Value: UTC
    Verified current value: Local (2026-11-03)
  - Gateway: Northlake VED MDEF Interval Import
    Node: MV90-MDEF-VED-PLANT
    Node ID: 7
    Field: TimeStampType
    Value: UTC
    Verified current value: Local (2026-11-03)
  - Gateway: Northlake VED MDEF Interval Import
    Node: MV90-MDEF-VED-RIDGELINE
    Node ID: 8
    Field: TimeStampType
    Value: UTC
    Verified current value: Local (2026-11-03)
  - Gateway: Northlake Helios MV90 Generation Import
    Node: MV90-MV9-HELIOS
    Node ID: 9
    Field: TimeStampType
    Value: UTC
    Verified current value: Local (2026-11-03)
customWorkflows:
- Name: Fake Gateway
  Execution profile: Gateway
  Components:
  - FakeGateway
  - IntervalDataPublish
  Parameters:
    GatewayId:
      Type: Integer
      Required: true
    RootDirectory:
      Type: DirectoryPath
      Default: ''
    StateFilePath:
      Type: FilePath
      Default: ''
    StartTimestamp:
      Type: DateTime
      Default: ''
    EndTimestamp:
      Type: DateTime
      Default: ''
    GenerationMode:
      Type: String
      Default: sine
    AllowSyntheticData:
      Type: Boolean
      Default: true
    AllowNoData:
      Type: Boolean
      Default: true
    BatchKind:
      Type: String
      Default: Auto
    BatchSize:
      Type: Integer
      Default: 20000
    BackfillCutoffDays:
      Type: Integer
      Default: 1
  Nodes:
  - Id: FakeGateway
    Component: FakeGateway
    Values:
      GatewayId: ${parameters.GatewayId}
      RootDirectory: ${parameters.RootDirectory}
      StateFilePath: ${parameters.StateFilePath}
      StartTimestamp: ${parameters.StartTimestamp}
      EndTimestamp: ${parameters.EndTimestamp}
      GenerationMode: ${parameters.GenerationMode}
      AllowSyntheticData: ${parameters.AllowSyntheticData}
      AllowNoData: ${parameters.AllowNoData}
  - Id: IntervalDataPublish
    Component: IntervalDataPublish
    Values:
      BatchKind: ${parameters.BatchKind}
      BatchSize: ${parameters.BatchSize}
      BackfillCutoffDays: ${parameters.BackfillCutoffDays}
      AllowNoData: ${parameters.AllowNoData}
      IdempotencyScope: northlake-fake-${parameters.TaskExecutionKey}
  Links:
  - From: FakeGateway.Out
    To: IntervalDataPublish.In
  - From: FakeGateway.IntervalDataFilePath
    To: IntervalDataPublish.InputFilePath
  - From: FakeGateway.ResolvedGatewayId
    To: IntervalDataPublish.GatewayId
  - From: FakeGateway.ResolvedGatewayName
    To: IntervalDataPublish.GatewayName
  - From: FakeGateway.ResolvedGatewayGuid
    To: IntervalDataPublish.GatewayGuid
  - From: FakeGateway.GatewayType
    To: IntervalDataPublish.GatewayType
