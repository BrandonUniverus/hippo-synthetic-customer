# ---------------------------------------------------------------- FIG Ridgeline SCADA (standard-time clock) ---
- key: gw_fig_ridgeline_scada
  installed:
    gatewayId: 14
    nodeIds: {node_fig_ridgeline_turbines: 24, node_fig_ridgeline_met_mast: 25}
  Gateway:
    Description: Ridgeline SCADA File Imports
    Vendor: FIG Gateway
  Schedule parameters:
    GatewayId: 14
    RootDirectory: C:\ProgramData\EEM Suite\NorthLake\Gateways\FIG-Ridgeline
    Format: FIG
    AgeThresholdSeconds: 10
    TimeStampType: utc
    AllowNoData: true
    FilePatterns: '*.csv'
  Nodes:
  - key: node_fig_ridgeline_turbines
    Description: FIG-RIDGELINE-TURBINES
    Next Batch Method: Disabled
    Notes:
    - 'The SCADA clock is Pacific Standard Time all year: every point on this node and the next keeps its Pacific time zone and carries OffsetTimeMinutes 480, and the task reads the shifted stamp as UTC, so a file stamp of 00:00 is stored as 08:00 UTC. See the standard-time note above.'
    Points:
    - pointTemplate: true
      channelPattern: ch_rwl_wtg{NN}_kwh_10m for NN in 01..10   # Ridgeline WTG-{NN} > Generated kWh 10m
      Description: Generated kWh 10m
      Company: Northlake Thermal Plant
      Meter pattern: {Description: "Ridgeline WTG-{NN}", Meter Number: "SYN-RWL-M-01100{NN}"}
      Point Parameters pattern: 'Point Alias: RWL_WTG{NN}_KWH, Channel: 01, UOM: kWh, Multiplier: 1, OffsetTimeMinutes: 480'
      count: 10
      Notes:
      - 'Bulk-select the 60 rows on this node and set Multiplier and OffsetTimeMinutes once; then set Channel and UOM for each of the six signals (ten rows apiece) and type each row''s Point Alias. Alias, Multiplier and OffsetTimeMinutes are what the component reads; Channel and UOM are descriptive on a plain FIG file.'
    - pointTemplate: true
      channelPattern: ch_rwl_wtg{NN}_kw_10m for NN in 01..10   # Ridgeline WTG-{NN} > Active Power kW 10m
      Description: Active Power kW 10m
      Company: Northlake Thermal Plant
      Meter pattern: {Description: "Ridgeline WTG-{NN}", Meter Number: "SYN-RWL-M-01100{NN}"}
      Point Parameters pattern: 'Point Alias: RWL_WTG{NN}_KW, Channel: 02, UOM: kW, Multiplier: 1, OffsetTimeMinutes: 480'
      count: 10
    - pointTemplate: true
      channelPattern: ch_rwl_wtg{NN}_possible_kw_10m for NN in 01..10   # Ridgeline WTG-{NN} > Possible kW 10m
      Description: Possible kW 10m
      Company: Northlake Thermal Plant
      Meter pattern: {Description: "Ridgeline WTG-{NN}", Meter Number: "SYN-RWL-M-01100{NN}"}
      Point Parameters pattern: 'Point Alias: RWL_WTG{NN}_PKW, Channel: 03, UOM: kW, Multiplier: 1, OffsetTimeMinutes: 480'
      count: 10
      Notes:
      - 'The turbine controller''s own expected output at the measured wind. It keeps reporting while a turbine is faulted, which is what separates lost production from missing data (WTG-07 outage case in 04-acceptance-runs.yaml).'
    - pointTemplate: true
      channelPattern: ch_rwl_wtg{NN}_nacelle_wind_ms_10m for NN in 01..10   # Ridgeline WTG-{NN} > Nacelle Wind Speed 10m
      Description: Nacelle Wind Speed 10m
      Company: Northlake Thermal Plant
      Meter pattern: {Description: "Ridgeline WTG-{NN}", Meter Number: "SYN-RWL-M-01100{NN}"}
      Point Parameters pattern: 'Point Alias: RWL_WTG{NN}_WS, Channel: 04, UOM: m/s, Multiplier: 1, OffsetTimeMinutes: 480'
      count: 10
    - pointTemplate: true
      channelPattern: ch_rwl_wtg{NN}_rotor_rpm_10m for NN in 01..10   # Ridgeline WTG-{NN} > Rotor Speed 10m
      Description: Rotor Speed 10m
      Company: Northlake Thermal Plant
      Meter pattern: {Description: "Ridgeline WTG-{NN}", Meter Number: "SYN-RWL-M-01100{NN}"}
      Point Parameters pattern: 'Point Alias: RWL_WTG{NN}_RPM, Channel: 05, UOM: RPM, Multiplier: 1, OffsetTimeMinutes: 480'
      count: 10
    - pointTemplate: true
      channelPattern: ch_rwl_wtg{NN}_state_10m for NN in 01..10   # Ridgeline WTG-{NN} > Turbine State
      Description: Turbine State
      Company: Northlake Thermal Plant
      Meter pattern: {Description: "Ridgeline WTG-{NN}", Meter Number: "SYN-RWL-M-01100{NN}"}
      Point Parameters pattern: 'Point Alias: RWL_WTG{NN}_STATE, Channel: 06, UOM: State, Multiplier: 1, OffsetTimeMinutes: 480'
      count: 10
      Notes:
      - 'A Digital point (Stage 2): 0 Stopped, 1 Running, 2 Fault, 3 Curtailed. Its readings are stored in DigitalArchive_TBL, not AnalogArchive_TBL.'
  - key: node_fig_ridgeline_met_mast
    Description: FIG-RIDGELINE-MET-MAST
    Next Batch Method: Disabled
    Notes:
    - 'The met mast stands upwind of WTG-01 and writes its own file on the same clock, so it takes the same offset as the turbines and is read under the same task setting. It is an owned Weather-type meter, not a weather station (Stage 2); KSUU is the station.'
    Points:
    - channel: ch_rwl_met_wind_ms_10m   # Ridgeline Met Mast > Hub-Height Wind Speed 10m
      Description: Hub-Height Wind Speed 10m
      Company: Northlake Thermal Plant
      Meter: {Description: Ridgeline Met Mast, Meter Number: RIDGELINE-MET-MAST}
      Point Parameters: {"Point Alias": RWL_MET_WS50, Channel: "01", UOM: m/s, Multiplier: 1, OffsetTimeMinutes: 480}
    - channel: ch_rwl_met_wind_direction_10m   # Ridgeline Met Mast > Wind Direction 10m
      Description: Wind Direction 10m
      Company: Northlake Thermal Plant
      Meter: {Description: Ridgeline Met Mast, Meter Number: RIDGELINE-MET-MAST}
      Point Parameters: {"Point Alias": RWL_MET_WD, Channel: "02", UOM: deg, Multiplier: 1, OffsetTimeMinutes: 480}
    - channel: ch_rwl_met_air_temp_c_10m   # Ridgeline Met Mast > Air Temperature 10m
      Description: Air Temperature 10m
      Company: Northlake Thermal Plant
      Meter: {Description: Ridgeline Met Mast, Meter Number: RIDGELINE-MET-MAST}
      Point Parameters: {"Point Alias": RWL_MET_TA, Channel: "03", UOM: degC, Multiplier: 1, OffsetTimeMinutes: 480}
    - channel: ch_rwl_met_pressure_kpa_10m   # Ridgeline Met Mast > Barometric Pressure 10m
      Description: Barometric Pressure 10m
      Company: Northlake Thermal Plant
      Meter: {Description: Ridgeline Met Mast, Meter Number: RIDGELINE-MET-MAST}
      Point Parameters: {"Point Alias": RWL_MET_BP, Channel: "04", UOM: kPa, Multiplier: 1, OffsetTimeMinutes: 480}
    - channel: ch_rwl_met_air_density_10m   # Ridgeline Met Mast > Air Density 10m
      Description: Air Density 10m
