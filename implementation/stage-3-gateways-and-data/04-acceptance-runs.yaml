# HMR exercises run on the live database: Stage 3 takes no restore point (decided 2026-11-05). The three cases that
# change settings temporarily (direct_demand, multiplier, rollover) wait until a backup exists to restore afterward.
# Numbers below are deliberately small synthetic probes, not billing/source-model history.
handheldAcceptance:
  status: Specified; uploads still need generating from the saved Northlake meter IDs.
  Environment: implementation/stage-3-gateways-and-data/handheld-test-environment.md
  First simulator slice: Two-route workflow from the environment design; preserve the dependencies and chronology when selecting cases below.
  Pilot: The two-route pilot for the first simulator proof needs no checkpoint; its readings stay in the two masters' history.
  Retained history: Blocked on the separate raw-unit, precision, gas-conversion and conserved-water gate in the environment design.
  restorePolicy: 'No restore. The main sequence runs on the live database, and its probe readings (February to
    June 2024 on the two masters, February 2024 on the 126 submeters) stay in their history after the Step 5
    starting readings, as do the new routes'' (February 2024 on CHECK, SWGR and GEN, May 2024 on IRRIG, October 2025
    on Cedar Row C). Keep schedules disabled except for the run being exercised. Do not mix these synthetic
    register values with the continuous source service or use them for bill reconciliation; if that history is
    later loaded from the source model, remove or replace the probe values and starting readings first.'
  prerequisites:
  - All permanent Step 5 configuration checks pass, and the three handheld schedules are saved disabled.
  - Capture physical MeterID, reading PtID, delta PtID, HMR_MeterID and HMR_ReadingID from checks.sql.
  - 'Generate actual Neptune and MVRS fixed-width uploads using those physical meter IDs and exact
    Text Prompts. Exported routes are outbound configuration, not ready-made inbound sample files.'
  - 'The Step 5 starting readings are the seed: every register holds a dated value on 2024-01-01 (the masters
    12000 kgal and 1000 therms), Cedar Row C''s on 2025-09-01, and no usage. Demand reads have none. Selecting a
    Read Type is not a seed.'
  - 'A case''s Readings list one register each: Meter is the physical meter number, Prompt the register''s prompt,
    and Previous register its Step 5 starting reading. Multiplier is the register''s Meter Constant, which the
    exported route file carries and the returned file repeats. A demand read has Value instead: stored as read.'
  - 'Use saved-schedule Run now. Change parameters with a per-run override or temporary disabled
    schedule on the same reusable task; restore those overrides before leaving the exercise.'
  - 'For each file record task/run ID, file hash, parameter values, archive/error location, register and
    usage values/timestamps, and applicable HMR log rows. Wait for ingestion and event persistence.'
  - 'Exercise the collector plus IntervalBatchCalculator: HMR MeterConstant and PointDef.DeltaMultiplier
    are separate calculation paths to the usage point. Confirm the opening result, order, chunks and
    replay agree; collector JSONL alone is not proof that the stored usage matches.'
  mainSequence:
  - opening
  - route_export
  - normal
  - replay
  - zero_usage
  - database_previous
  - skipped
  - late_actual
  - submeter_batch
  # The five cases for the routes added 2026-11-07 need only Step 5's starting readings, so they are independent too.
  independentCases: [direct_demand, multiplier, rollover, invalid_input, configuration_validation,
                     utility_check_constants, switchgear_round, generator_round, irrigation_season_read, cedar_row_c_round]
  deferredUntilBackup: [direct_demand, multiplier, rollover]
  cases:
  - key: opening
    Action: No upload. Check the starting readings Step 5 entered on the two masters.
    Local timestamp: '2024-01-01T00:00:00'
    Expected UTC timestamp: '2024-01-01T08:00:00Z'
    Water: {Register: 12000}
    Gas: {Register: 1000}
    Verify: Each master's Register Reading holds its starting reading at that time as its first archive row, and its Register Reading Delta has no value at that time.
  - key: route_export
    Requires: opening
    Action: 'Use Handheld Meter Reading Export; save the complete file and compare all 203 exported registers
      with Step 5 (204 configured, less the disabled Cedar Row C laundry meter). Verify each register''s starting
      reading appears as its previous reading; the grid filter must not be treated as a download filter. Inspect
      output record lengths and route/channel fields, the switchgear''s ten readings on one meter record (demand
      reads first) and the two-digit channel 10.'
    Expected: 191 enabled meters on ten routes and six cycles (01 to 05, and Cedar Row C unit 412 alone on cycle 20); no cycle 99; no truncation or point-node IDs substituted for meter IDs.
  - key: normal
    Schedules: [schedule_neptune_river_city_water, schedule_mvrs_sierra_gas]
    Parameters: {UseSqlValues: false}
    Local timestamp: '2024-02-01T00:00:00'
    Expected UTC timestamp: '2024-02-01T08:00:00Z'
    Water: {Previous register: 12000, Current register: 12100, Multiplier: 1, Expected usage: 100}
