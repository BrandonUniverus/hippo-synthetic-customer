  Expected:
    Readings per point: 144
    Readings stored: 9504 (66 points x 144; 8064 in AnalogArchive_TBL and the 1440 Turbine State rows in DigitalArchive_TBL)
    First interval UTC: 2024-07-15 08:10   # each row is stamped at the end of its ten minutes (data/providers/ridgeline-wind.yaml), the stamp EEM's rate engine, Bill Generation and interval reports read
    Last interval UTC: 2024-07-16 08:00
    UTC rule: the SCADA clock is UTC-08:00 all year, so its 00:00 is 08:00 UTC even in July, when the Pacific civil clock reads 01:00; the day's rows are stamped 00:10 through the next day's 00:00
    Task log: FIGGateway collected 9504 FIG reading(s) from 2 claimed file(s), with no unknown-alias warning (a mistyped alias among the 66 shows there; the log is a cross-check, not acceptance)
    Stored local stamps: 'the right Pacific civil time, 2024-07-15 01:10 through 2024-07-16 01:00 (daylight time, UTC-07:00), because EEM converts the UTC into the point''s Pacific zone. This is what verifies the UTC-plus-offset workaround (PRODUCT FINDING 49); predicted from the converter code, assumed until observed. Read AnalogArchive_TBL.LocalTimeStamp (checks.sql ridgeline_scada_day) and record it.'
    Time Interval, results by hour: 'Use point timestamp off (hours cut from UTC in the signed-in user''s own zone) and on (hours cut from the stored local stamps) agree for a Pacific user: the SCADA day starts at 01:00 daylight time and each hour counts 6 intervals, because the report counts a stamp in the hour it ends (wh_GetIntervalData.sql:155-156); record the first hour shown. Predicted from rp_TimeInterval and wh_GetIntervalData, to confirm on screen.'
    Wrong-setting signatures: 'UTC starting 15:10 (15:10 through 15:00) means Timestamp Type was left at local, so the shifted stamp was read as Pacific wall-clock time; UTC starting 07:10 means local with the offset left out, an hour early while Pacific is on daylight time; UTC starting 00:10 means the offset was left out under utc. Restore and run again rather than running over the wrong rows: the archive key is (PtID, UTCTimeStamp), so a corrected run overwrites only the rows whose UTC it shares.'
    January control: 'optional, any January day (assumed 2025-01-15): the same UTC rule (08:10 through 08:00) and stored local stamps of 00:10 through the next day''s 00:00, the SCADA''s own, because Pacific is on standard time and the two clocks agree.'
    Full history start: 'when the 2024-2025 SCADA history is loaded, its first row is stamped 2024-06-30 23:10 on the SCADA clock (the ten minutes from 23:00, Pacific midnight on July 1), not the SCADA''s own 2024-07-01 00:10, and its last row is stamped 2026-01-01 00:00 (the ten minutes ending at midnight on December 31, when the clocks agree). Stage 7 generates the transfer statement on Pacific civil months and asks for every interval (Available % 100), so July 2024 needs all 4,464 intervals per point, the stamps after 2024-07-01 00:00 Pacific up to and including 2024-08-01 00:00; a history starting on the SCADA''s own July 1 would leave July''s first hour empty and July would not generate. With the stamps at interval ends, that history is exactly July 2024 to December 2025, with no extra row at either end.'
  Check: ridgeline_scada_day, ridgeline_scada_day_short_points, ridgeline_nodes_bound, task_runs
