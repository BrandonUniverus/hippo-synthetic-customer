# Stage 3, step 4: Acceptance runs (file delivery + Web > Task Manager > Run now + interval data screens).
# The AcquiSuite acceptance is four cases run in one sequence on the live database (no restore), with exact
# expected results from the customer's expected-results.json and handover sheet. Every other format case
# is one record that says which sample file it needs and whether that file exists yet; only the AcquiSuite
# files are generated today, so those records are open work, not entries. Five Ridgeline Wind cases close the
# file, open work like the format cases; two of them check PRODUCT FINDING 45 and the UTC-plus-offset workaround that
# PRODUCT FINDING 49 forces.
stage: 3
step: 4
title: Acceptance runs
app: Web (Task Manager, Reports) and the gateway input folders
screen: Task Manager > Run now; Reports > Use Analysis > Time Interval and Summary
source:
- documents/intake-package/sample-data/acquisuite/expected-results.json
- documents/intake-package/sample-data/acquisuite/acquisuite-sample-handover.pdf
- documents/intake-package/sample-data/acquisuite/{complete,gap,backfill}/ASQVED01_STUDENT.log
- documents/intake-package/source-system-inventory.pdf (which feeds have no sample yet)
- 'data/scenarios/demo-university-v1.yaml (gatewayBindings.profiles: generatedArtifacts per profile)'
- generators/documents/sources/implementation/northlake-onboarding-ui-checklist.md (section 4, retired into this file)
- data/bills/northlake-itemized-bills-v1.yaml (the metered quantities and bill periods the Ridgeline period totals tie to)
- generators/documents/sources/implementation/product-findings.md (findings 14, 19, 45, 48 and 49)
notes:
- 'Use the reusable Task with the named Schedule below. Run now from that saved schedule so its GatewayId,
  RootDirectory and other overrides are used. Per-case Parameters and FIG Format changes are run overrides
  or a temporary disabled schedule; never edit task defaults to switch a configured gateway or format.'
- 'Deliver one case at a time: copy the sample file into the gateway''s Input folder (keep the original in documents/), wait
  past the AgeThresholdSeconds (10 s) the gateway uses to decide a file has finished arriving, then open the task in Task
  Manager and use Run now. The Workers service (EEMSuite Task Service (NorthLake)) executes it; the run appears in the Task
  Dashboard and in the Task Log report.'
- 'Stage 3 takes no configured-empty backup (decided 2026-11-05), so the four AcquiSuite cases run once, in order, on the
  live database: gap, backfill, complete day, replay. The gap file must be the first AcquiSuite data for 2024-01-15. The
  backfill brings the day to the complete-day numbers; the complete file then lands on a full day (the first replay) and
  the replay delivers it again. The day ends in the same state as one complete load, and that data stays in Northlake.'
- 'Sum kWh and take the maximum of kW. Never sum demand. Local day 2024-01-15 in Pacific time is UTC 2024-01-15 08:00 to
  2024-01-16 07:45; the AcquiSuite file carries UTC interval-start timestamps and the gateway converts them with the point''s
  time zone (TimeZoneID 33). Every interval''s kWh is its kW times 0.25 h, so the day sums to 2,020 kWh with a 120 kW peak.'
- 'The AcquiSuite files are the deliberate interval-start case: each row is stamped when its fifteen minutes begin, as a
  customer who assumes start-of-interval stamps would send them. EEM stores the stamp as given, and its rate engine,
  Bill Generation and interval reports read every stamp as the end of its interval (UtilityRates_LoadData.sql:111-114,
  wh_GetIntervalData.sql:155-156). No AcquiSuite setting moves the stamp: only FIG has an offset (OffsetTimeMinutes, per
  point), MDEF assumes MV90''s interval-end stamps, and the other gateways have none (PRODUCT FINDING 73). So the file''s
  first row, 00:00 Pacific, is EEM''s last interval of January 14: the stored rows are all there (96, 2,020 kWh, cut on
  the file''s own day), but EEM''s January 15 holds 95 of them and 2,010 kWh. acquisuite_complete_day records both; once
  a stamp setting exists, setting the node to interval start must bring EEM''s day to 96 and 2,020.'
- 'What the gateway does with the file (AcquiSuiteGatewayComponent): it claims files matching FilePatterns from Input into
  Working, reads column 0 as UTC and column Row Number + RowOffset as the value, publishes the readings, then zips processed
  files into Archive/yyyy_MM_dd/RunGuid.zip after publication acceptance and moves unreadable originals to Error. A replayed file with the same name
  is read again in full; the archive table''s primary key (PtID, UTCTimeStamp) is why the replay cannot add rows.'
- 'A success in the task log is not acceptance. Acceptance is the stored intervals rendering on a screen with the expected
  value: the Time Interval report for the counts and timestamps, the Summary report for the kWh sum and kW maximum.'
- 'Status (added 2026-11-10): every record that has no sample file carries a Status block saying whether a sample exists, what would produce it, the expected result and the check. Most samples are produced by the services/sources producer, which is not generators/northlake_packet.py; its README lists 215 file-backed inputs across seven profiles. A check that says NOT LOADED means the data is not in the database yet, not that the case failed; PASS and FAIL compare the recipe value with the database.'
- 'Records whose Sample file exists is false are open work for the generator (generators/northlake_packet.py writes only the
  AcquiSuite deliveries today). Run them when the file or service exists, each from the then-current database; they add data
  for other points and need no restore.'
- 'fake_smoke needs the custom two-node FakeGateway to IntervalDataPublish workflow. MVRS publishes HMR events
  inside its built-in workflow; the HMR acceptance case reuses task_mvrs through schedule_mvrs_sierra_gas and does not need another task
  or a manually supplied companion file. The handheld cases still require Step 5 route configuration.'
- 'Added 2026-10-01 (Ridgeline Wind): five cases close the file. Run ridgeline_scada_july_day first;
  ridgeline_wtg07_outage reuses the turbine file; mdef_ridgeline_interconnection and noaa_ksuu_wind_knots are
  independent of them; ridgeline_aggregates runs last, once the SCADA and MDEF cases have data. Like the other
  format cases they add data for their own points and need no restore, and their sample files are not generated
  yet (generators/northlake_packet.py writes only the AcquiSuite deliveries).'
- 'The Ridgeline SCADA day is on a Pacific Standard clock all year (UTC-08:00), and each row is stamped at the end
  of its ten minutes, the convention EEM''s rate engine and Bill Generation read (a day is the stamps after its
  midnight up to and including the next: UtilityRates_LoadData.sql:111-114, UtilityGenBillDates_Set.sql:242). So
  local day 2024-07-15 on that clock is the stamps UTC 2024-07-15 08:10 to 2024-07-16 08:00 although Pacific civil
  time is on daylight time (UTC-07:00) in July, when the SCADA''s 00:00 is 01:00 on the Pacific clock. Read the
  SCADA cases in UTC: checks.sql filters
  them on UTCTimeStamp. The points keep their Pacific zone, carry OffsetTimeMinutes 480, and the task reads the
  shifted stamp as UTC, so the stored local stamps, which EEM converts from that UTC, should
  read Pacific civil time; ridgeline_scada_july_day confirms that on a July day and records what the Time
  Interval report shows with Use point timestamp off (hours cut from UTC in the signed-in user''s own zone) and on
  (hours cut from the stored stamps). The GMT zone is not an alternative: it resolves to London summer time
  (PRODUCT FINDING 48), and FIG offers no standard-time stamp type (PRODUCT FINDING 49). Day counts are 144
  ten-minute and 96 fifteen-minute rows; point, alias and offset facts are in 02-gateways.yaml.'
- 'Two period rules for the Ridgeline totals. Valley Electric cycle 1 reads on the 5th, so a Valley Electric bill
  runs from the 5th to the 4th (the first generator bill is 2024-07-01 to 2024-08-04, 35 days, and the winter
  bill 2025-01-05 to 2025-02-04), while the hand-made Ridgeline statement is a calendar month. The statement
  slices on Pacific civil months, which under this recipe are the points'' stored local time, so the July sums
  are cut on Pacific days (after UTC 07:00 up to and including 07:00 in July), not on the SCADA clock''s UTC
  hours. Bill Generation slices the same way, on the stored local stamps after the month''s first midnight up to
  and including the next (UtilityGenBillDates_Set.sql:242; Stage 7). Every Ridgeline stamp is an interval end:
  the SCADA file is written that way and the MDEF gateway stamps each reading at the end of its interval.'
