setup:
- 'Create the three handheld gateways in Configuration Tool before their schedules: first the
  parameterless Handheld Meter Reading Gateway type on Gateway Types, then the three profiles in
  02-gateways.yaml with that type and no nodes. Configuration Tool requires a type; the Neptune and
  MVRS components never read it. The Stage 3 gateway_type_assignments check confirms all three.'
- 'Finish the three disabled schedules in 03-workflows-and-tasks.yaml once their gateway profiles
  exist. Keep the normal RootDirectory-only setup and leave UseSqlValues=false for the baseline runs.'
- 'Read types: Web > System Manager > Handheld Meter Setup (the page takes over the HMR Configuration menu entry
  before this step), More > Read types. Add the nine read types above and save them together.'
- 'Meters and registers: choose Northlake University, Cedar Row Apartments and Northlake Thermal Plant in the
  location tree and show All meters, so all 192 meters are listed. More > Paste from Excel: open
  05-handheld-meters.csv in a text editor (Excel turns cycles 01 to 05 and tamper code 00 into 1 to 5 and 0), copy
  all of it and paste it into the card. The file has one row per register, 204 rows: a meter with several
  registers has one row for each, told apart by its prompt. Each row fills its meter''s cycle, route, sequence,
  enabled flag, bill code and meter text and the register''s read type, prompt, constant, channel, tamper code, high and low
  warning, Reading Point and Consumption Point; the four demand reads leave Reading Point empty. Save the paste once; it is all or nothing
  and names any rejected row.'
- 'Starting readings, in two passes, Cedar Row C first. (1) Choose only Cedar Row C, switch to Starting readings,
  set the date to September 1, 2025, open 05-handheld-starting-readings-2025-09-01.txt in a text editor, copy all
  50 lines, click the first row''s Starting reading, paste and save. (2) Choose the three companies again, set the
  date to January 1, 2024 and paste 05-handheld-starting-readings-2024-01-01.txt (150 lines) the same way. Each file
  is in the grid''s own order (cycle, route, sequence, prompt), so it lines up only when the grid lists exactly that
  many registers with no starting reading, 50 and then 150. If it lists a different number, stop and check which
  register already has a reading. Demand reads take none and are not listed.'
- 'Run the handheld sections of checks.sql: all nine read types and all 204 registers must match, 213 checks.
  Correct a wrong mapping before supplying any handheld file. Do not correct Cedar Row C''s route: its mistakes are
  the expected configuration until the Stage 12 scenario.'
- 'Route export and import exercises belong to Step 4, after Steps 5 and 6; the starting readings are
  the only values entered here.'

startingReadings:
  Read date: '2024-01-01'
  Notes:
  - 'Each value is saved on the register''s Reading point at the start of that local day, as its first reading;
    no usage is booked for it. The page accepts one only for a register that has no reading yet.'
  - 'A record''s Starting reading is one number for a single meter, or First and Step along its route in
    sequence order. The masters'' 12000 kgal and 1000 therms are the opening values the Step 4 handheld pack
    builds on; the submeters'' values are the previous registers its February batch reads from.'
  - 'A meter with its own Registers gives each accumulator register its own Starting reading. Cedar Row C''s two
    records carry their own Starting date, 2025-09-01, the day its new meters were set, so their values are small.'
  - 'generators/stage_check_data.py writes 05-handheld-starting-readings-<date>.txt, one value per line for each
    date in the Starting readings grid''s order: 150 values for 2024-01-01 and 50 for 2025-09-01.'

