notes:
- 'HMR_Meter assigns a physical meter to a cycle and route. Its MetaWorldID is the meter hierarchy ID,
  not either point node ID. HMR_Reading is channel configuration, not dated observations.'
- 'The permanent scope is 192 meters and 204 registers on ten routes (eleven cycle and route pairs, because one
  Cedar Row C meter sits on a mistyped cycle). The first five routes are the 132 single-register meters of
  November 5: two utility masters, 60 Cedar Row A apartments plus its house, 64 Cedar Row B apartments plus its
  house, and the four sewer-credit deduct meters. Each record''s Meters lists every meter and the existing points
  to pick for it; the apartment templates use the real unit numbers, not 1..60 or 1..64.'
- 'The five routes added on 2026-11-07 are there to learn the handheld settings, each for a different reason:
  CRCWTR (Cedar Row C, 50 meters keyed badly by the installer, as delivered); IRRIG (four irrigation meters read in
  ccf in season, the easy one); CHECK (two utility meters whose register needs a meter constant, x40 and x3.0367);
  SWGR (one switchgear meter with ten registers, six through a Delta and four demand reads); GEN (three
  generators with two registers each, run hours and diesel gallons). They use nine read types between them.'
- 'Cedar Row C is built badly on purpose, the way the installer keyed it, and stays that way until the Stage 12
  scenario fixes it with bulk edit: floors 1 and 2 got 8-dial gallon meters and floors 3 and 4 6-dial ccf meters
  (two read types, two prompts and two units on one route); the route runs floor by floor from the top in unit
  order, so the reader crosses between the west and east meter banks on every floor and walks back to the laundry
  room at the end; unit 412 was keyed on cycle 20 instead of 02, so the route file carries it as a one-meter route
  on cycle 20 and a reader who loads cycle 02 never sees it; the laundry meter was saved disabled, so the route file
  leaves it out; and every meter text was copied from Cedar Row B''s.'
- 'Three kinds of register. An accumulator: Reading Point is the Stage 2 register and Consumption Point its
  generated Delta. An Analog register (the generators'' run hours): Reading Point is an Analog register point and
  Consumption Point a separate Analog usage point, because EEM makes an Accumulator only in an Energy or Volume unit
  or one with a rate unit, and Hour is neither; it is the pattern Massport uses for every handheld register. A demand
  read (read type Demand read Y: the switchgear''s kW, on-peak kW, kVA and power factor) has no Reading Point; its
  value is stored as read on its Analog point, and it takes no starting reading.'
- 'The register points already exist. Select Register Reading as Reading Point and its generated
  Register Reading Delta as Consumption Point. Resolve that pair by PtRelatedData_TBL ReasonType D;
  the channel keys are model keys, not points to create or names to type.'
- 'Cycle is at most 2 characters, Route at most 6, Bill Code at most 1, Text Prompt at most 4, and
  Meter Text at most 100. Cycle/route values below are Northlake assumptions, independent of utility
  billing cycles. Channel is required by the editor/save procedure even for a text upload.'
- 'The incoming file matches the physical meter MetaWorldID plus Text Prompt (KGAL or THRM).
  HMR_PointNode_Get currently loads all configured handheld channels regardless of GatewayId;
  separate gateway profiles and roots identify deliveries but do not isolate the HMR configuration.
  Keep each delivery limited to its intended meters and verify unmatched-file behavior in acceptance.'
- 'Neptune and MVRS use the existing reusable tasks. MVRS publishes its HMR events in the same workflow;
  Neptune does not publish the same HMR log stream. Do not add a separate HMR publisher task.'
- 'High Warning and Low Warning (added 2026-11-09) are whole-number limits, assumed: the customer packet gives none.
  Each route carries one pair, and the registers of CHECK, SWGR and GEN carry their own. Three cases stay on purpose:
  Cedar Row C has none (its installer left them empty), the switchgear''s power factor has none, and irrigation, run
  hours and fuel have a Low of 0. EEM stores the two values on the register; nothing in this stage reads them back.'
- 'Northlake on 2026-11-05: the three read types a SQL script had inserted were deleted so the Handheld Read
  Types page creates them; HMR_ReadType, HMR_Meter and HMR_Reading are all empty.'
- 'The source service currently excludes handheld protocols. The acceptance uploads below still need
  generating from resolved Northlake IDs. A route export is outbound device configuration, not an upload
  that can simply be fed back to the collector.'
- 'The optional handheld simulator design is agreed in handheld-test-environment.md. First demonstrate
  the two master routes with controlled integer kgal/therm readings and Constant 1. This is not the
  retained source-history scale: fractional registers, gas conversion, export field limits, and both
  HMR/accumulator delta calculations must be resolved before historical population or apartment rollout.'
- 'A two-route simulator pilot needs no checkpoint (Stage 3 takes none after the entry backup); its readings stay
  in the two masters'' history. The simulator never restores Northlake.'

