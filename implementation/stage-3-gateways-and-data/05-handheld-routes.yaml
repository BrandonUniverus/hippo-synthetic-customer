# Stage 3, step 5. Configuration first; the controlled import exercises run in Step 4.
# Entered on the web's Handheld Meter Setup page (System Manager): its Read Types page for the catalog, its routes
# view for meters and registers (paste 05-handheld-meters.csv, generated from this file), and its Starting readings
# view for each register's first value.
stage: 3
step: 5
title: Handheld meter reading routes
