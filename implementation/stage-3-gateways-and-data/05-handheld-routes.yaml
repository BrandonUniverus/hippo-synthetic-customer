openingReadings:
  configuration: Entering the routes adds no observation rows; the Step 5 starting readings are the first.
  baseline: 'UseSqlValues=false uses the previous register in the returned file. Supply a known,
    nonzero previous register, not the initial AnalogData zero/1901 value.'
  databaseMode: 'Exercise UseSqlValues=true only after a baseline import is persisted and visible
    in point history and the runtime latest value. Use a separate run so the runtime snapshot is fresh.'
  arithmetic: 'Register usage = (current - previous) * multiplier. A lower current register invokes
    rollover logic; it is not an automatic meter-replacement/reset workflow.'

export:
  Screen: '#/HandheldMeterReadingExport'
  Expected permanent meters: 192
  Expected permanent reading channels: 204
  Expected cycles: ['01', '02', '03', '04', '05', '20']
  Expected routes: [SCGAS, CHECK, CRBMW, CRAWTR, CRBWTR, CRCWTR, DEDUCT, SWGR, IRRIG, GEN]
  Verify:
  - All physical meter IDs, channel prompts, read types, sequences and previous register values.
  - Filtering the grid does not filter the downloaded export; verify the complete file.
  - Export disables assignments on cycle '99'; none of the Northlake routes use that cycle.
  - 'The route file carries only enabled meters, 191: the Cedar Row C laundry meter is not in it. Cycle 20 holds one
    route, CRCWTR, with the single meter of Cedar Row C unit 412; cycle 02''s CRCWTR has 48.'
  - The switchgear's meter record lists ten readings, its four demand reads first (the export orders demand reads first, then by prompt).
  - Save the generated file as evidence; configuration success is not proof of import success.

acceptanceOnly:
  # Temporary, and deferred until a backup exists to restore afterward; excluded from the permanent 192 meters.
  # Exercises the no-register / demand branch without changing Stage 2's point inventory.
  directDemand:
    Company: Northlake University
    Meter: {Description: Student Center Electric Main, Meter Number: SYN-VED-M-0040004}
    Point: {Channel: ch_ved_student_center_kw_15m, Description: Demand kW 15m}
    Cycle: '90'
    Route Number: TSTDMD
    Read Sequence: 10
    Enabled: true
    Bill Code: '-'
    Read Type: demand_keyed
    Text Prompt: KW
    Channel: 1
    Reading Point:
    Meter Constant: 1
    ERT Id:
    Tamper Code: '00'
    Constraint: 'Create through the app only in the controlled HMR acceptance run, with every
      acquisition schedule disabled. The point remains assigned to AcquiSuite; do not change its
      gateway binding. Run it only on a restore of a later backup, and restore again afterward, so the
      temporary assignment and synthetic demand observation cannot enter the real Northlake history.'
  Runs: 04-acceptance-runs.yaml handheldAcceptance
