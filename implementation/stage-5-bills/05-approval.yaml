# Stage 5, step 5: Approval (status history behind every bill, and the QC Approval action in Bill Entry / Bill
# Validation). Every bill from 03-bills.yaml already carries a Status_Code 1 (Bill Entry) StatusHistory row from
# being saved; this step advances about a third of them to Status_Code 2 (QC Approval). Stage 1's shared
# eem_company_setup grants Bill Validation; eem_bill_entry does not. Select the copy in the bill's company.
stage: 5
step: 5
title: Approval
app: Web SPA
screen: '#/BillEntry (status chip and its history), Bill Validation'
source:
- generators/documents/sources/implementation/dream-customer/phase1-substrate-extras.md
- implementation/stage-1-foundation/04-groups.yaml
notes:
- 'Entry lag and LastChangedBy per provider (phase1-substrate-extras.md, deterministic): Valley Electric 3 days
  (nora.chen), Sierra Gas 5 days (iris.morales), River City 4 days (nora.chen), Northlake Thermal 6 days
  (keiko.tan), Helios Solar 7 days (iris.morales), every Cedar Row bill 5 days (marcus.reed) regardless of
  provider. AsOfDate = the bill''s period end plus that lag.'
- Mark roughly one in three bills per account Status_Code 2 (QC Approval), spread across the two-year span so
  rp_DailyProcessingSummary''s approved counts are not clustered in one month.
- 'Verified in src/Web/EEMSuite.Web.Endpoints/Controllers/BillEditController.cs: the action that actually moves a
  bill to Status_Code 2 is ValidateBill / ValidateBills ("Marks a bill as valid"), gated by
  [EEMPermission(Function, "Bill Validation")]. Stage 1 grants that function at level 1 through each company''s
  eem_company_setup copy; ordinary bill entry receives eem_bill_entry without that function.'
- StatusHistory (Table_Code BL) needs no separate entry - Status_Code 1 is written when the bill is saved and
  Status_Code 2 when Validate is clicked; nothing here is typed directly into a StatusHistory grid.
records:
- key: approval_pass
  installed: {}
  Action: For roughly one in three bills per account (spread across 2024-2025), open the bill in Bill Entry and
    click Validate.
  Signed in as: a member of eem_company_setup in that bill's company, with the local Points scope listed in
    05-users.yaml. Confirm the effective Bill Validation function grant; the group name alone is not approval authority.
  Result: Status_Code advances from 1 (Bill Entry) to 2 (QC Approval); the bill's status chip and its status
    history both show the change.
- key: approval_fixture_rejection
  installed: {}
  Purpose: prove that a bill-entry-only user cannot approve.
  Action: Sign in as iris.morales (Northlake University eem_bill_entry plus nlu_points_read) and attempt to open
    Bill Validation or click Validate on a bill she entered.
  Expected: the screen or the action is unavailable to her; record what actually happens (refused screen,
    disabled button, or a successful validate that should not have been) as a Finding if it differs from
    "refused."
