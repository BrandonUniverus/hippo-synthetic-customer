- key: ved_generator_series
  installed: {}
  Series: Aug-24 to Dec-25, monthly (17 bills), rate schedules VED-GEN-IC + VED-BCT, imported with the other Valley
    Electric accounts (02-bill-importer-sources.yaml, user nora.chen). Valley Electric cycle 1 reads on the 5th, so a
    bill runs from the 5th to the 4th and posts to the month it ends in. The account opened with the acquisition, so
    its first bill runs from the opening, 2024-07-01, to 2024-08-04 (35 days, Aug-24) and the last is 2025-11-05 to
    2025-12-04 (Dec-25); no bill exists before 2024-07-01, and the seller's account SYN-VED-A-0019014 closed
    2024-06-30 and has no Northlake bills.
  Accounts:
  - {Account: SYN-VED-A-0010014, Building: Ridgeline Substation, Meter: SYN-VED-M-0040015, Meter Type: 'bidirectional interval (15-min received kWh, delivered kWh and kVArh; multiplier 12000)'}
  Bill Items (line structure in bill order; the exact figures for the first bill and the 2025-01-05 to 2025-02-04 bill are the two generator fixtures below):
  - {Description: generator_customer_charge, Quantity: 1, Unit: month, Rate: 285.00, Amount: 285.00}
  - {Description: station_service_energy, Quantity: delivered kWh for the bill period, Unit: kWh, Rate: 0.131, Amount: quantity x rate}
  - {Description: reactive_power_charge, Quantity: kVArh above the allowance (omit the line when zero), Unit: kVArh, Rate: 0.0042, Amount: quantity x rate}
  - {Description: generation_credit, Quantity: exported kWh for the bill period, Unit: kWh, Rate: -0.0612, Amount: quantity x rate}
  - {Description: bct_credit_transferred, Amount: the generation_credit amount with its sign reversed}
  - {Description: utility_users_tax, Percent of subtotal: 5.0, Amount: 5% of the three charge lines}
  Total: customer charge + station service + reactive + tax (the credit and its transfer cancel)
  Allowance: exported kWh x 0.3286841 (the reactive-to-active ratio at power factor 0.95), rounded to the kVArh; billed kVArh = measured - allowance, never below zero
  Note: >-
    Quantities come off the meter's three 15-minute channels over each bill's own period (Stage 3, node
    MV90-MDEF-VED-RIDGELINE). The first bill (2024-07-01 to 2024-08-04) and the 2025-01-05 to 2025-02-04 bill are
    fixed by the two itemized fixtures below, so Stage 3's data must add up to them; the other fifteen bills are
    assumed until that data exists. The bill is a small positive residue every period: the credit leaves with its
    transfer line, so it is never a credit balance, and it moves with the wind (station service up and export down
    in a calm period). WTG-07's gearbox outage (2025-02-11 to 2025-04-22) is already in that data: a lower export on
    the three bills that cover it (Mar-25 to May-25) is lost production, not a billing error. Each bill's transfer
    lands on the Central Plant bill one cycle later (ved_central_plant_bct_series).
- key: ved_central_plant_bct_series
  installed: {}
  Series: Sep-24 to Dec-25 (16 bills), the Central Plant's own VED-TOU-PRI series (ved_monthly_series) plus VED-BCT,
    the rider that makes it the benefiting account for SYN-VED-A-0010014. Each credit lands one billing cycle after the
    generator bill that earned it, so the credit line and the fee line both start with the Sep-24 bill (2024-08-05 to
    2024-09-04), the first bill that carries a credit.
  Accounts:
  - {Account: SYN-VED-A-0010013, Building: Central Plant, Generating Account: SYN-VED-A-0010014}
  Bill Items (added to that period's VED-TOU-PRI lines, after public_purpose_program and before the tax line):
  - {Description: bct_credit_received, Amount: minus the generator account bct_credit_transferred on the previous generator bill}  # Sep-24 to Dec-25, 16 bills
  - {Description: bct_administrative_fee, Quantity: 1, Unit: month, Rate: 12.50, Amount: 12.50}  # assumed to start with the first credit-bearing bill (Sep-24), 16 bills; the rider is effective 2024-07-01, but the itemized Sep-24 bill is the first one printed
  Note: >-
    The credit is the previous generator bill's export credit to the cent: the first generator bill (2024-07-01 to
    2024-08-04, Aug-24) lands on the Sep-24 bill, the Nov-25 generator bill on the Dec-25 bill. The Dec-25 generator
    bill's credit (2025-11-05 to 2025-12-04) has no bill to land on inside the window (it would post to Jan-26, after
    the last bill this stage enters), so it stays in transit. The VED-BCT lines are not taxable:
    utility_users_tax is 5% of the energy, demand, facility and public purpose lines only. The first credit (Sep-24)
    is about half of that bill's $303,964.12 of charges, so Bill Validation's cost-change test will likely flag it;
    that is correct for a new credit, not a data error, so review it and add no override.
