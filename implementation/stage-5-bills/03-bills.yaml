# Stage 5, step 3: Bills (Web SPA #/BillEntry -> Add Bill -> #/BillEntry/Editor/Details for manual accounts; the
# imported series from 02-bill-importer-sources.yaml for VED and RCU). One monthly bill per account, 2024-01
# through 2025-12 (24 bills), except the fixtures below, which shorten, split, duplicate or supersede that
# series on purpose, and except the Ridgeline accounts: the Valley Electric generator account's first bill runs from
# the 2024-07-01 opening to 2024-08-04 and it takes 17 bills (Aug-24 to Dec-25), and Ridgeline's own transfer
# account takes none here (EEM generates it, Stage 7). Every bill follows its provider's Stage 1 read cycle and
# posts to the month it ends in: Valley Electric reads on the 5th (5th to 4th), Sierra Gas and River City's Cedar
# Row cycle on the 15th (15th to 14th), and River City's campus cycle, the Thermal Plant, Helios and Ridgeline close
# with the calendar month. Every bill's Bill Items decompose per the bill-charge-line spec and reconcile to the bill
# total. The sample bills (data/bills/*.yaml, rendered into documents/utility-bills/) are exact and the fixtures and
# worked examples below quote them; the quantity for any other period is # assumed until Stage 3/4's interval and
# meter-read data exists to read the real number off.
stage: 5
step: 3
title: Bills
app: Web SPA
screen: '#/BillEntry -> Add Bill -> #/BillEntry/Editor/Details'
source:
- data/eem/northlake-bill-entry-v1.yaml
- data/bills/*.yaml (every sample bill; northlake-itemized-bills-v1.yaml holds the Ridgeline-era four)
- generators/documents/sources/implementation/dream-customer/bill-charge-line-spec.md
- generators/documents/sources/implementation/dream-customer/phase1-substrate-extras.md
- data/providers/*.yaml
notes:
- Accounts are referenced by synthetic account number (Stage 2 assigns the real BillingAccountID); meters by
  scenario id and synthetic meter number. Look each one up in Stage 2's records before entering its bills.
- 'Reconciliation rules (bill-charge-line-spec.md): non-informational lines sum to the bill total within $0.01;
  a commodity''s consumption lines sum to the bill''s usage quantity; a tax line is a percent of the sum of the
  lines before it; a credit line is negative; a zero-quantity line (a winter VED peak line, an empty water tier,
  a Cedar Row stormwater line) is omitted rather than entered as zero.'
- Entry method per provider follows data/eem/northlake-bill-entry-v1.yaml preferredEntry, with the Cedar Row
  company scope beating the provider default - Valley Electric and River City import in every company, Cedar Row
  included (02-bill-importer-sources.yaml, user nora.chen); Sierra Gas and Helios Solar are manual Bill Entry (user
  iris.morales), except Cedar Row's own gas and PPA bills, which marcus.reed enters; Northlake Thermal Plant
  allocations are manual (user keiko.tan).
- 'The tariffs leave three riders "as applicable", and the sample bills fix them: Valley Electric''s
  public_purpose_program is 1.5% of the energy lines, Sierra Gas''s public_purpose_surcharge is 1.5% of the commodity
  and transport lines, and both utilities'' utility_users_tax is 5% of every line above it. fixed_oandm_allocation
  (NTP) is the building''s share of fixed plant O&M, a bare amount. None has a rate parameter in the Phase 1 model
  (Phase 2 rate engine). power_factor_adjustment appears on no sample bill.'
- 'Added 2026-10-01 (Ridgeline Wind): the Valley Electric generator account SYN-VED-A-0010014 is a Valley Electric
  import like the rest, but it opens with the acquisition. Valley Electric cycle 1 reads on the 5th, so a bill runs
  from the 5th to the 4th and posts to the month it ends in (Stage 1): the generator''s first bill runs from the
  opening, 2024-07-01, to 2024-08-04 (35 days, Aug-24), and its series is Aug-24 to Dec-25 (17 bills). The Central
  Plant''s bills carry the VED-BCT lines from Sep-24. Ridgeline Wind''s own account SYN-RWL-G-0000001 is in no series
  here: EEM generates its monthly (calendar-month) statement on the Ridgeline Farm Transfer Meter (Bill Generation,
  written by the Run Bill Gen task when the month''s data completes; keiko.tan reviews) in
  Stage 7, so the 51st billing account takes no bill in this stage. The itemized bills
  (data/bills/northlake-itemized-bills-v1.yaml) are exact: the three Valley Electric ones are fixtures below, and the
  hand-made July 2024 transfer statement is kept in rwl_generated_series as the acceptance reference for Stage 7.'
- 'Changed 2026-10-02: the twenty older sample bills were hand-made images with empty tables, calendar-month periods
  for cycle-reading providers, a 2026 plant statement and Helios''s 2024 rate on 2025 bills. Each is now generated
  from data/bills/<provider>-v1.yaml on its provider''s cycle and at its tariff, under the same file name, and the
  fixtures below quote them.'
- 'The VED-BCT credit and fee are not taxable: on the Central Plant bills that carry them (from Sep-24) the utility
  users tax is 5% of the lines before the credit, not of every line before it, so the tax-line rule above bends
  there. The generator''s credit and its transfer cancel, so on its bills the plain rule still holds.'
