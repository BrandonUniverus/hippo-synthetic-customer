  Provider Meter Number:
    Not a bill field. The grid column and the drawer show it read-only from the meter (the drawer's Provider Meter Number is a derived value). It is set where Stage 2 enters the meter (03-meters.yaml, Provider Meter Number, e.g. SGU-SET-0050001), so a bill line shows it as soon as the meter is picked. Nothing to type here.
