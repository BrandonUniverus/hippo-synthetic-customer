- key: expected_totals_feed
  installed: {}
  Purpose: >-
    An expected total for EVERY bill, not only the 24 above. The generated bills (about 1,170) have no total in any recipe file:
    they exist only as the output of services/sources/billing.py (invoices(), which calls _generated_bill, the same function that
    renders each bill's PDF and its import files), deterministic for a given model and seed (104729). The command below writes
    them, plus the 24 anchors, as one SQL file of expected totals. It reads the repository only (no database, no service, no
    network) and is NOT run by this recipe; whoever runs the generators runs it once after the other generators.
  Command: |
    python -c "import sys, pathlib; from datetime import date; sys.path.insert(0, '.'); from services.sources.generation import create_model; from services.sources.billing import invoices; m = create_model(pathlib.Path('.'), 104729); rows = sorted((m.accounts[b['accountId']]['syntheticAccountNumber'], str(b['period']['start']), str(b['period']['end']), '%.2f' % b['total'], b['id'], b['providerId']) for b in invoices(m, date(2026, 1, 8)) if b['providerId'] != 'ridgeline_wind' and b['fiscalYear'] <= 2025); q = lambda v: \"'\" + v + \"'\"; out = ['CREATE TABLE #ExpectedTotals (AccountNumber nvarchar(50), PeriodStart date, PeriodEnd date, Expected money, SourceBillId nvarchar(100), ProviderId nvarchar(50));'] + ['INSERT INTO #ExpectedTotals VALUES (' + ', '.join([q(r[0]), q(r[1]), q(r[2]), r[3], q(r[4]), q(r[5])]) + ');' for r in rows] + ['GO']; pathlib.Path('implementation/stage-5-bills/expected-bill-totals.sql').write_text(chr(10).join(out), encoding='utf-8'); print(len(rows), 'expected totals written')"
  Output: implementation/stage-5-bills/expected-bill-totals.sql, one INSERT per bill, under the account's CURRENT number (Cedar Row A's bills before July 2024 print SYN-RCU-A-0030103 but sit on SYN-RCU-A-0030003). Expect 1,193 rows (the 50 accounts that take bills, see bills_per_account, with the six Thermal Plant cost centers' 144 bills, which Stage 7 produces, and without Ridgeline's own statements).
  Consumed by: checks.sql bill_totals_expected_vs_actual. Run both files in ONE sqlcmd session so the temp table survives - sqlcmd -S localhost -E -d EEMSuite_Northlake -W -s "|" -i expected-bill-totals.sql -i checks.sql - and the check says "feed not loaded" (still asserting the 24 anchors from its own list) when the file was not run first.
  Not in the feed: the Total Due adjustment on one bill (header_field_bills), which the check applies itself, and the fixture-bay bills (deleted).
- key: header_field_bills
  installed: {}
  Purpose: 'Editor fields that no bill set before (the Billing Dates and Amounts sections of #/BillEntry/Editor/Details), each set on the bills below where the source supports it. The labels are the editor''s (BillEntryEditorDetails.cshtml; the wording is the language data app_bill_entry).'
  Invoice Number:
    Rule: every Bill Entry bill (Sierra Gas and Helios, the 13 manual accounts) carries the invoice number the source service prints, SYN-<provider short name>-<model account id>-<fiscal year><fiscal period, two digits>-01 (services/sources/billing.py _generated_bill); the estimate and its correction are -01 and -02 so the two are told apart. The imported Valley Electric and River City bills bring their InvoiceNumber from the file. The anchors carry no invoice number in data/bills, so theirs follow the same pattern  # assumed
    Examples: [{Bill: SGU Admin Hall Apr-25, Invoice Number: SYN-SGU-sgu_admin_hall-202504-01}, {Bill: HOS Science Center Feb-25, Invoice Number: SYN-HOS-hos_science_center-202502-01}, {Bill: SGU Student Center estimated, Invoice Number: SYN-SGU-sgu_student_center-202411-01}, {Bill: SGU Student Center corrected, Invoice Number: SYN-SGU-sgu_student_center-202411-02}]
    Why it matters: an AP voucher needs it (the Massport builder tags a missing one "Missing Invoice Number") and the Stage 6 AP file carries it.
  Received Date:
    Rule: the date the bill is typed in, period end plus the provider's entry lag from 05-approval.yaml (Sierra Gas 5 days, Helios 7, Cedar Row 5), after the Issue Date  # assumed: the sources give a lag, not a received date. An imported bill has no Received Date (the BIF has no such column).
    Replaces: the earlier "Entered On", which is not an editor field (Received Date is the nearest).
  Previous Balance and Payment Received:
    Bill: HOS Student Center Feb-25 (SYN-HOS-P-0000002, 2025-02-01 to 2025-02-28, 02-Helios-Student-Center-Midday-Generation.pdf)
    Values: {Previous Balance: 1310.55, Payment Received: 500.00, Total Due: 3439.55}  # assumed: the PDF prints current charges only (2,629.00); the balance and the part payment are typed from the account's ledger
    Calculation: 2629.00 + 1310.55 - 500.00 = 3439.55. The editor's Calculated total adds the previous balance less the payment, so Difference stays 0.00. Validation test 1 (Company NLU, 1,000 USD) reports the balance.
  Pay Amount:
    Bill: the same HOS Student Center Feb-25 bill. Helios accounts are Bill Payment accounts (Stage 2), and those are the manual accounts for which the editor shows Pay Amount (DapperBillEditingDTORepository.cs, Type_Code = 2).
    Value: {Pay Amount: 3439.55}  # assumed: the whole Total Due
