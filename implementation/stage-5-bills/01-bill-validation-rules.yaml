- key: test_catalog
  installed: {}
  Purpose: >-
    Every test, in number order, with the calculation it reads, the rule it enforces, where it is turned on, a bill that
    trips it and a bill that does not. F01 to F20 are the fixture-bay bills of 03-bills.yaml (validation_fixture_bay);
    the other bills are named by account and period. A result marked "# assumed" depends on a bill whose figures are
    generated and not yet known. Status is exercised or not exercised, and a test not exercised says why.
  Tests:
  - {Test: 1, Meaning: Previous balance above threshold, Reads: CalcPreviousBalance, Level: Company NLU, Setting: Amount 1000 USD, Trips: 'HOS Student Center Feb-25 (SYN-HOS-P-0000002, Previous Balance 1,310.55); F02', Passes: 'HOS Science Center Feb-25 (Previous Balance 0); F13', Status: exercised}
  - {Test: 2, Meaning: Late payment fees, Reads: 'CalcLatePaymentFees (line items whose commodity name contains "Late")', Level: Group Validation Bay, Setting: Amount 25 USD, Trips: F03 (Late Payment Fee 35.00), Passes: F13, Status: exercised}
  - {Test: 3, Meaning: Estimated bill, Reads: CalcEstimatedBill (Bill Type = 1), Level: Company NLU, Setting: on, Trips: SGU Student Center estimated bill (2024-10-15 to 2024-11-14; Bill Type Estimated), Passes: the corrected bill for the same period, Status: exercised}
  - {Test: 4, Meaning: Bill total reconciliation, Reads: 'CalcBillTotalReconciliation (Total Due against lines + previous balance - payment)', Level: Company NLU, Setting: on, Trips: 'F05 (Total Due 1,485.36, lines 1,475.36)', Passes: every series bill; F13, Status: exercised}
  - {Test: 5, Meaning: Billing before account opening, Reads: CalcAccountOpening (earliest Active row of the account), Level: Company NLU, Setting: on, Trips: 'SGU Admin Hall Jan-24 (2023-12-15 to 2024-01-14; account Active as of 2024-01-01), and the first bill of every 5th- and 15th-cycle account', Passes: SGU Admin Hall Feb-24 (2024-01-15 to 2024-02-14), Status: exercised}
  - {Test: 6, Meaning: Billing after account closure, Reads: CalcAccountClosure, Level: Company NLU, Setting: on, Status: not exercised, Why: no Northlake billing account is closed; the Stage 12 scenario "an account closes and is replaced" is the first bill that can report}
  - {Test: 7, Meaning: Period end after invoice date, Reads: CalcPeriodEndAfterInvoiceDate, Level: Company NLU, Setting: on, Trips: 'F06 (Issue Date 2026-07-10, Period End 2026-07-14)', Passes: F13, Status: exercised}
  - {Test: 8, Meaning: Payment due before invoice date, Reads: 'CalcPaymentDueBeforeInvoiceDate (Issue Date after Due Date)', Level: Company NLU, Setting: on, Trips: 'F07 (Issue Date 2026-08-16, Due Date 2026-08-10)', Passes: F13, Status: exercised}
  - {Test: 9, Meaning: Period starts after it ends, Reads: CalcReversedBillingPeriod, Level: Company NLU, Setting: on, Status: not exercised, Why: the editor moves an end date that is not after the start to the next day (the bill editor guide), so no saved bill can have a reversed period; only an import could carry one and that path was not confirmed}
  - {Test: 10, Meaning: Overlap with preceding bill, Reads: CalcPeriodOverlapAndGap, Level: Group Validation Bay, Setting: Amount 3 days, Trips: 'F08 (starts 2026-08-10, F07 ends 2026-08-14: 4 days)', Passes: F13, Status: exercised}
  - {Test: 11, Meaning: Gap after preceding bill, Reads: CalcPeriodOverlapAndGap, Level: Group Validation Bay, Setting: Amount 3 days, Trips: 'F09 (starts 2026-09-21, F08 ends 2026-09-14: 7 days)', Passes: 'F13 (starts the day after F12 ends, a 1 day gap)', Status: exercised}
  - {Test: 12, Meaning: Billing period length change, Reads: 'CalcBillingPeriodLengthChange (against the trailing fiscal year average)', Level: Group Validation Bay, Setting: Percent 50, Trips: 'F11 (15 days against an average of 31.7: -52.7%)', Passes: 'F13 (31 days, -2.2%)', Status: exercised}
  - {Test: 13, Meaning: Billing period length above maximum, Reads: CalcBillingPeriodLimits, Level: Global, Setting: Amount 36, Trips: F10 (41 days), Passes: 'the generator first bill (35 days); F13', Status: exercised}
  - {Test: 14, Meaning: Billing period length below minimum, Reads: CalcBillingPeriodLimits, Level: Global, Setting: Amount 26, Trips: F11 (15 days), Passes: 'the generator first bill (35 days); F13', Status: exercised}
  - {Test: 15, Meaning: Duplicate bills in fiscal period, Reads: CalcDuplicateFiscalPeriod, Level: Company NLU, Setting: on, Trips: 'SGU Student Center estimated and corrected bills (both fiscal 2024-11)', Passes: SGU Student Center Oct-24 bill, Status: exercised}
  - {Test: 16, Meaning: Missing fiscal periods, Reads: CalcMissingFiscalPeriods, Level: Group Validation Bay, Setting: on, Trips: 'F20 (typed fiscal 2027 period 11 after F19 period 8: periods 9 and 10 skipped)', Passes: F13, Status: exercised}
  - {Test: 17, Meaning: Insufficient accounting overlap, Reads: 'CalcAccountingPeriodOverlap (CompanyCalendar)', Level: Group Validation Bay, Setting: Amount 4 days, Trips: 'F20 (August 15 to September 14 against period 11: 0 days)', Passes: 'a series bill, e.g. SGU Admin Hall Feb-24 (14 days) # assumed: calendar months', Status: exercised, Note: Northlake University's calendar ends in 2026 (Stage 1), so every 2027 fixture from F13 to F20 also reports 17 (no calendar row counts as 0 days); read the pass on a 2024-25 bill}
  - {Test: 18, Meaning: Same total as preceding bill, Reads: CalcIdenticalTotalCost, Level: Group Validation Bay, Setting: Amount 500 USD, Trips: 'F14 (1,624.52, same as F13)', Passes: F13, Status: exercised}
