# Stage 5, step 1: Bill Validation rules (Database Administrator > Nodes > company node > Bill Validation tab; the same
# page opens from the main window's Bill Validation item). Entered before any bill in 03-bills.yaml so the deliberate-
# failure fixtures fire when those bills are saved.
#
# What the screen is (BillValidationViewModel.cs, BillValidationTestModel.cs, BillValidationView.xaml and
# src/Documentation/Developers/Billing/BillValidation-DeepDive.md): "Validation for" picks Global Test Defaults or a
# company; at a company, "Settings for" picks Company Defaults, Manage Groups, one Group or one Billing Account. The
# grid has the columns State, Effective, Test Name, Commodity, Percent Check, Percent, Amount Check, Amount, Unit and
# Color, on two tabs: Bill Save (BillValidationType 1) and Batch Test (2). The State cell offers Enabled and Off at
# Global Test Defaults and Inherit, Enabled and Disabled everywhere else. There is NO provider scope: the scopes are
# Global (0), Company (1), Group (2) and Billing Account (3), and the most specific row wins whole
# (BillValidation_ResolveTests.sql: "the winning row supplies the whole configuration"). The AP/GL plan's "provider
# level" therefore means a Group or Account row.
stage: 5
step: 1
title: Bill Validation rules
app: Database Administrator
screen: Nodes > company node > Bill Validation
source:
- data/eem/northlake-ap-gl-v1.yaml
- data/bills/*.yaml
- generators/documents/sources/implementation/dream-customer/phase3-ap-gl-validation-spec.md
notes:
- 'THE TEST LIST. The product has 47 tests numbered 1 to 47 plus test 99 (accrual bill without a mapping): the numbered
  index is the comment block at the top of Database/EEMSuite/Procs/BillValidation_Run.sql, and each test is one
  BillValidation_Calc*.sql procedure (named in test_catalog below, which reads the proc for each). The words in
  "Meaning" are that index. The on-screen Test Name is a BillValidationLabel row, installed data and not source: the
  wording for tests 13, 14, 21, 23, 25, 28, 41 and 42 was copied from the installed grid by the earlier author and is used
  verbatim in the Global block; for every other test copy the exact wording from the grid when you enter it, matching on
  the number (the grid prefixes the number). "No row at any scope means the test is off" (BillValidation_ResolveTests.sql),
  so a test is on only where a row enables it.'
- 'WHICH TAB. Bill Save runs when a bill is saved or Validate Bill is pressed in Bill Entry (uaBillValidate
  @ValidationType = 1), shows its findings in the editor and stores nothing. Batch Test (mode 2) is what the bill
  validation job runs (uaBillValidate_Job, built-in task BILL_VALIDATION, which needs SysConstants IsValidateBillsJob = 1):
  it is the only place an IMPORTED bill is ever validated, it writes BillValidation_Tbl, and an open BillValidation_Tbl row
  is what holds a bill out of the AP approval queue (Stage 6). The earlier text said Northlake uses Bill Save only; with
  that the 31 importer accounts are never validated and Stage 6 has nothing to read. So every rule meant to reach an
  imported or a stored result is entered on BOTH tabs (Batch Test says "same rows"); the fixture-bay group is Bill Save
  only, because its bills are read in the editor and then deleted.'
- 'THRESHOLDS. Which of Percent and Amount a test has is its BillValidationLabel row (BV_PQLabel, BV_AQLabel); the grid locks
  a cell the test does not have, so each Percent and Amount below is the one the calculation procedure reads and a cell the
  test lacks is not given. Amount is a currency for tests 1, 2, 18, 21, 22, 23, 24, 35 and 37 (Unit: USD, label as the
  picker shows it), a number of days for 10, 11, 13, 14, 17, 39 and 47, a usage for 20, 25, 26, 27, 28, 36, 38 and 43 to 46
  (the row''s own unit: kWh, therms, kgal), a demand for 29 to 31 (kW) and a price for 33 (a price unit such as USD/kWh).
  Percent is a tinyint, 255 at most. A comparison against a minimum reads NULL as "nothing qualifies"
  (BillValidation_CalcUsageChange.sql needs both usages above t.AbsQuantity), so Global test 25 as first entered (Percent 40,
  no Amount) could never report. It now carries a minimum usage per commodity, like test 28.'
- 'A Company, Group or Account row carries the whole configuration, so an override that leaves Amount empty drops the
  floor the Global row had. The Science Center override of test 21 therefore repeats the 1,000 USD floor (before, it ran with
  none).'
- 'Tests that report on many bills at once are not at Global scope: a Global row reaches all 50 accounts and an open
  alert holds a bill out of the AP queue (Stage 6). They sit on the company, on one group or on named accounts so the alerts
  are the ones this stage plans. Cedar Row Apartments and the Thermal Plant company inherit only the Global rows and their own
  account overrides: that difference between companies is deliberate.'
- 'EVIDENCE. A Bill Save finding is read in the editor (the issue strip, Show all) after the save and is stored nowhere. A
  Batch Test finding is a BillValidation_Tbl row (IsError = 0). The fixture-bay bills (03-bills.yaml, validation_fixture_bay)
  are entered, read and deleted, so each is recorded there as Expect: the test numbers the editor lists.'
- Enter this step signed in as a company administrator with the target company's eem_company_setup copy and local Points
  scope from Stage 1. The Administrator user setting is separate from membership of that shared group; bill-entry-only users
  do not hold the Bill Validation function (BillValidation_CanConfigure.sql needs the Bill Validation or Hierarchy tab at
  update level).
- 'Added 2026-10-01 (Ridgeline Wind): a fifth account override, on the Valley Electric generator account SYN-VED-A-0010014.
  It keeps none of its export credit, so its bill is a small residue that moves with the wind and its only usage line,
  station service, does too: the two change-from-last-bill tests (21 and 25) would flag most bills, and an open alert holds
  an ordinary AP bill out of the approval queue (Stage 6). The percent column is a tinyint (255 at most) and the two itemized
  bills differ by +527% in cost and +960% in usage, so the tests are turned off for that one account rather than raised. The
  1,000 kWh usage floor and every other test stay on.'
