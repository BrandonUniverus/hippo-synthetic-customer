  - {Test: 21, Meaning: Total cost change vs preceding bill, Reads: CalcTotalCostChange, Level: Global, Setting: Percent 35, Amount 1000 USD, Trips: 'F18 (1,942.52 against F17 40,718.00: -95.2%); likely also Central Plant Sep-24 (151,171.47) # assumed: against its Aug-24 bill', Passes: 'F19 (-15.0%)', Status: exercised}
  - {Test: 22, Meaning: Total above historical high, Reads: 'CalcHighTotalCost (trailing fiscal year)', Level: Group Validation Bay, Setting: Percent 50, Amount 1000 USD, Trips: 'F17 (40,718.00 against a high of 1,624.52: +2,406.5%)', Passes: F13 (+0.8%), Status: exercised}
  - {Test: 23, Meaning: Total cost above maximum, Reads: CalcTotalCostLimits, Level: Global 1,000,000; Group Validation Bay 20,000, Setting: Amount in USD, Trips: 'F17 (40,718.00 over 20,000)', Passes: 'F13; the Central Plant Sep-24 bill (151,171.47) under the Global 1,000,000', Status: exercised}
  - {Test: 24, Meaning: Total cost below minimum, Reads: CalcTotalCostLimits, Level: Group Validation Bay, Setting: Amount 100 USD, Trips: 'F15 (38.00)', Passes: F13, Status: exercised}
  - {Test: 25, Meaning: Usage change vs preceding bill, Reads: CalcUsageChange, Level: Global (per commodity), Setting: Percent 40 and a minimum usage, Trips: 'F18 (1,180 therms against F17 30,000: -96.1%)', Passes: 'F19 (+0.8%)', Status: exercised}
  - {Test: 26, Meaning: Usage above historical high, Reads: CalcHistoricalUsageAndDemandHighs, Level: Group Validation Bay, Setting: Natural Gas, Percent 50, Amount 100 therms, Trips: 'F17 (30,000 therms against a high of 1,170: +2,464.1%)', Passes: 'F13 (1,170 against 1,160: +0.9%)', Status: exercised}
  - {Test: 27, Meaning: Usage above maximum, Reads: CalcUsageLimits, Level: Group Validation Bay (gas); Account Admin Hall and Library (electric), Setting: gas 5,000 therms; electric 25,000 kWh, Trips: 'F17 (30,000 therms); Admin Hall Apr-24 (27,680 kWh)', Passes: 'F13; Library Sep-24 (5,160 and 10,800 kWh)', Status: exercised}
  - {Test: 28, Meaning: Usage below minimum, Reads: CalcUsageLimits, Level: Global (per commodity), Setting: 1000 kWh, 100 therms, 100 kgal, Trips: 'F15 (0 therms)', Passes: F13, Status: exercised}
