# Stage 5, step 4: Bill images and notes. Bill images attach in the Bill Entry editor's own image pane (drag the
# file onto the editor or use its attach control; verified in billEntryEditorPage.ts - a staged-image flow for a
# brand-new bill, a direct attach once the bill has been saved). Notes are Table_Code-scoped: a bill's own note is
# entered in the Bill Entry editor's Notes area; a meter's note has no WPF page (Meter Definition and Node Data
# carry no Notes tab) and is entered on the web Note History screen instead (viewNoteHistory.ts, api/NoteHistory/
# AddOrUpdate, Table Code METR); a billing account's note is the Utility Accountant tab's own Notes page
# (BillAccountViewModel, Table Code BA).
stage: 5
step: 4
title: Bill images and notes
app: Web SPA and Database Administrator
screen: Bill Entry Editor (image pane), Note History, Utility Accountant > Billing Account > Notes
source:
- generators/documents/sources/implementation/dream-customer/phase1-substrate-extras.md
- documents/utility-bills/**/*.pdf
notes:
- Attach the sample PDF that matches each account's provider and scenario; there is one sample per provider plus
  one per named fixture, not one per month - every other monthly bill in the series goes in without an image. Of the 24
  sample PDFs, 19 attach in this stage (bill_images); the four Thermal Plant ones and the Ridgeline statement wait for the
  bills Stage 7 produces (bill_images_stage_7). The eight Sierra Gas and Helios images go through the Bill Entry
  editor's image pane. The eleven on imported accounts (Valley Electric 7, River City 4) are on bills Bill Entry does not list
  (it lists only Bill Entry accounts), and the source service's BIF leaves its Image field empty, so how an image reaches an
  imported bill is not confirmed; try the editor by direct link and the importer, and record what works as a finding.
- 'Table codes verified against StatusHistory/NoteHistory usage in the dream-customer notes: BL = bill, METR =
  meter, BA = billing account.'
- 'Added 2026-10-01 (Ridgeline Wind): three Valley Electric statements join the samples (the generator account''s
  first bill and its calm bill for 2025-01-05 to 2025-02-04, and the Central Plant''s first credit, on its Sep-24
  bill), and Ridgeline Wind''s own sample is the
  hand-made July 2024 transfer statement. Nobody enters that bill - EEM generates it in Stage 7 - so its PDF
  attaches to the generated July 2024 statement and is the one image not attached in this stage. The generator
  account also gets a billing-account note.'
