      statement)
    Sample Input: 'work/input/RCU/RCU_sample.csv (columns per data/providers/river-city-utilities.yaml
      fileFormats.billing: synthetic_account_number, service_code, billing_start, billing_end, usage_quantity,
      usage_unit, total_cost)'
    BIF Output Folder: work/output
    Backup Folder: work/backup
  Files (Web SPA):
    Upload: the .bif file BillImporter wrote to work/output
  Account Mapping:
  - {Source Account: SYN-RCU-A-#######, Maps To: the matching billing account by synthetic number (Stage 2)}
  Commodity Mapping:
  - {Source Charge: water_meter_charge / water_tier1 / water_tier2 / water_tier3, Maps To: Water}
  - {Source Charge: sewer_base / sewer_volume, Maps To: Sewer}
  - {Source Charge: stormwater_eru, Maps To: Stormwater}
  Workspace:
  - Review the queue; the account_number_change fixture (03-bills.yaml) needs Cedar Row A remapped to its new
    account number after the July 2024 renewal; the duplicate_file_import fixture needs the same combined file
    uploaded twice to prove the Workspace does not double the service lines.
