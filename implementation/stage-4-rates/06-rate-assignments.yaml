  notes:
  - 'Ridgeline Farm Transfer Meter (SYN-RWL-M-0110000) is a logical billing meter on SYN-RWL-G-0000001: no channels, and
    its one point is the aggregate Ridgeline Farm Generated kWh 10m, the ten turbines'' Generated kWh (Stage 2). The rate
    goes here and the ten turbine pad meters (SYN-RWL-M-0110001..0110010, meter keys rwl_wtg_01 to rwl_wtg_10) get no row,
    because EEM prices the points under one meter and writes one bill per meter and month (UtilityRate_Exec, UtilityGenBill_Create;
    finding 66). Rated on the ten pad meters, the statement would be ten bills a month, the research credit would post ten
    times and the ten cent-rounded transfer lines would add to $130,580.28; rated here it is one Transfer Energy line on
    the farm total and one Research Credit, $129,330.27 for July 2024.'
  - 'Start Date is the acquisition, 2024-07-01: a month is generated only if it starts on or after the rate''s Start Date
    (UtilityGenBillDates_Set.sql:286). The rate''s own dates end it on 2025-12-31 (End Date left open, like every row here).
    Bill is unchecked because EEM generates this account''s statement itself (the Bill Generation sub-tab, Stage 7 step
    8), so there is no separate bill to reconcile it against, and a checked box would copy the rate onto a Bill Reconciliation
    scenario that Northlake Thermal Plant does not have.'
  - 'RWL-XFER-2024 needs no Rate Option: its determinants sit under the automatic All class, which the engine takes for
    every meter (UtilityRate_Exec.sql:303-307), and its Commodity Mapping is what turns its two amounts into bill lines
    (both in 05-rates.yaml).'
