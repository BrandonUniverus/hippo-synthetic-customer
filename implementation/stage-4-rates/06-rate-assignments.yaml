# Stage 4, step 6: Meter-to-rate assignments (Database Administrator > Nodes, select a meter node,
# Definitions dock, "Tenant Rebill" tab).
#
# Order inside the tab: pick the Bill Scenario at the top (every Northlake company has only "Actual"), then add one
# row per rate with its Start date. The Rate Lab's meters are assigned in 08-rate-lab.yaml.
stage: 4
step: 6
title: Rate assignments
app: Database Administrator
screen: Nodes > Tenant Rebill
source:
- data/scenarios/demo-university-v1.yaml (each account's rate schedules; meter sizes, fixture and ERU counts, floor areas)
- data/providers/valley-electric-district.yaml and data/providers/ridgeline-wind.yaml (which rates apply to the Ridgeline meters)
notes:
- 'Reworked 2026-11-09: every real meter carries the tariff its provider bills it on. Before, 16 meters carried a
  feature rate (the nine gas meters, for one, were not on Sierra Gas''s own rate); those rates moved to the Rate Lab.
  The Central Plant main meter now carries VED-TOU-PRI. Stormwater is on the six meters the provider bills it on, and
  the Central Plant''s makeup water meter gains its sewer row.'
- 'End Date blank = open-ended. The screen accepts an End Date but the product does not store it; a row runs until
  the next row''s Start Date.'
- Bill checked = this assignment takes part in bill reconciliation for the scenario; every row is checked except
  the Ridgeline Farm Transfer Meter's, whose statement EEM generates itself (Stage 7 step 8).
- 'Rate Options on a row: the class this meter takes for the rate''s option (its meter or line size). A meter of the
  default size needs nothing entered. Binding a meter to a class is done where the product offers it (the rate''s
  option editor, or the web''s Rate Class Assignment); record which screen it was on the first entry.'
- 'Meter Prices on a row: the meter''s own price for a User Defined charge (fixtures x $14.60, ERUs x $11.20, the
  plant''s fixed share by floor area), with the 2026 step. If no screen can enter a per-meter price, record the product
  finding and enter the charge as one flat amount on the rate.'
- 'OPEN, for the rate tests to settle: a meter carries one rate at a time (the engine prices the row with the latest
  Start Date on or before the period end; finding 65), so the water meters'' three rows (water, sewer, stormwater)
  and the two VED-BCT rows do not price beside each other as entered. The rows are listed as the provider bills
  them; how the product should carry three rates on one meter is still to be worked out.'
- The Library's meter-replacement pair is a Stage 2/3 concern; the rate assignment does not change across the swap,
  so only the after-replacement meter is listed.
- 'Ridgeline (2026-10-01): the interconnection meter (VED-GEN-IC and VED-BCT), a VED-BCT row on the Central Plant
  meter and the Ridgeline Farm Transfer Meter (RWL-XFER-2024), all from 2024-07-01. The ten turbine pad meters have no
  row: the billing meter carries the rate for them.'
