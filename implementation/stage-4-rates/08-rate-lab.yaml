# Stage 4, step 8: the Rate Lab (Database Administrator > RateModeler). NOT READY TO ENTER.
# Starting material only: the nine feature rates and four scripts that sat under the real providers until
# 2026-11-09, moved here unchanged. They become the Northlake Rate Lab provider's rates, a seventh provider that
# carries the full engine: every significance, a day-of-week season, ratchet and load factor with history, real-time
# pricing with its price point, minimum and maximum charges, every kind of option, per-meter prices, excluded points,
# scripts, and export and import. Known to be wrong as written: the three new scripts use variables the engine does
# not supply (a script works on the bill-item table), the schedules they name were replaced, the real-time price
# point does not exist, and four of the five option classes carry no charge.
stage: 4
step: 8
title: Rate Lab
app: Database Administrator
screen: RateModeler > Rate Edit
status: starting material, to be reworked
records:
- key: script_base_excess_pre
  installed:
    determinantScriptId: null
  kind: Determinant script
  Scripts:
    Description: Base/Excess Demand Split (Pre)
    Type: Pre
    SQL: '-- Synthetic stand-in: the engine has no native "base vs excess" demand tier.

      -- Reads the meter''s billed demand and caps this determinant''s usage at the contract

      -- base demand (16.2 kW basis); the paired Post script bills the remainder as Excess Demand.

      -- @DeterminantID, @MetaWorldID, @BillDemand are the script context variables the engine supplies.

      SELECT @BillDemand = CASE WHEN @BillDemand > 16.2 THEN 16.2 ELSE @BillDemand END

      '
- key: script_base_excess_post
  installed:
    determinantScriptId: null
  kind: Determinant script
  Scripts:
    Description: Base/Excess Demand Split (Post)
    Type: Post
    SQL: '-- Pairs with Base/Excess Demand Split (Pre): re-reads the meter''s actual billed demand and

      -- bills only the amount above the 16.2 kW contract base on the Excess Demand determinant.

      SELECT @BillDemand = CASE WHEN @BillDemand > 16.2 THEN @BillDemand - 16.2 ELSE 0 END

      '
- key: script_pf_adjust
  installed:
    determinantScriptId: null
  kind: Determinant script
  Scripts:
    Description: Power Factor Adjustment (Post)
    Type: Post
    SQL: '-- Synthetic stand-in: the engine has no power-factor math. Northlake has no measured power

      -- factor point yet, so this adds a small flat reactive-power adjustment on the lab-heavy

      -- Science Center account instead of computing kVAR from a real PF reading.

      SELECT @ChargeAmount = @ChargeAmount + 45.00

      '
- key: script_round_2dp
  installed:
    determinantScriptId: 1
    note: already exists (verified in dbo.UtilityDeterminantScript); no new script to create
  kind: Determinant script
  Scripts:
    Description: Round Bill Item Down 2 Decimals
    Type: Post
  notes:
  - Pre-existing on this installed database, presumably from an earlier setup step; reuse it as-is on NL-RTP-Index's
    two RTP determinants rather than creating a second rounding script. Its SQL rounds down (floor), not to nearest,
    which is fine for the RTP proof and not worth changing here.
