# Stage 4, step 7: Test Rates (Database Administrator > RateModeler > Test Rates).
# A run is a rate, a billing period, the rate classes to bill and the reads. It is saved on the PC, not in the
# database, so checks.sql cannot query it.
stage: 4
step: 7
title: Rate tests
app: Database Administrator
screen: RateModeler > Test Rates
source:
- implementation/stage-4-rates/05-rates.yaml (prices), 04-schedules.yaml and 01-holidays.yaml (hours)
- data/bills/northlake-itemized-bills-v1.yaml (the itemized bills the Ridgeline-era runs reproduce)
notes:
- 'Reworked 2026-11-09: every run states its total and its lines, worked out beforehand from the rate as entered.
  Before, 17 of 29 runs said to record whatever the run produced. The Rate Lab''s runs are in 08-rate-lab.yaml.'
- 'The first 19 runs use Generate Reads with one flat value per hour, so the quantities are hours x value and can be
  checked by hand: July 2024 has 744 hours; of them 132 are peak (22 weekdays x 6 hours, July 4 left out), 176
  part-peak and 436 off-peak. Demand is the generated kW value itself.'
- 'How the expected hours were counted: an hour belongs to a schedule when its season covers it and its time-of-use
  cell is lit. On Peak and Super On Peak charges skip holidays; every other charge takes the whole holiday. If the
  engine counts a reading in the hour it ends in, the lit hours shift by one and a total can differ by an hour or
  two at the edges of a holiday or of the period. A difference of that size is that question, not a wrong rate.'
- 'Every line is rounded to the cent when it is posted, and percentage charges apply to the rounded lines.'
- Energy Multiplier and Demand Multiplier stay at 1.0000.
- 'Rate Classes: tick All. For a rate with an option, also tick the class the run names; one run proves the default
  class prices with nothing else ticked.'
- 'Test Rates cannot run a per-meter price, a ratchet or load factor. The per-meter prices are proved by generated
  bills (Stage 7); ratchet and load factor are the Rate Lab''s.'
- 'The last seven runs (2026-10-01, Ridgeline Wind) reproduce the itemized bills, so they paste exact rows. A row is
  LocalTimestamp, Value, IntervalMinutes and UnitID (6 is KilowattHours, 7 is Kilowatt); its timestamp is the interval
  start and must fall inside the run''s dates. A run reads one stream per unit, so VED-GEN-IC''s delivered and received
  quantities take one run each.'
