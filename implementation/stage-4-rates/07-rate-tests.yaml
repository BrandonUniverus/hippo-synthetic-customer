    Outside The Engine:
    - 'Transfer under VED-BCT: +$152,792.65 (bct_credit_transferred; it lands on the Central Plant bill, ved_central_plant_2024_09)'
    Bill Reconstruction: 'ved_ridgeline_generator_2024_07 is 285.00 + 580.07 + 161.07 - 152,792.65 + 152,792.65 + 51.31 =
      $1,077.45. The engine supplies 285.00, 580.07 and the tax of 43.25 (first run) and -152,792.65 (this run); the
      reactive line 161.07, the $8.06 of tax on it and the +152,792.65 transfer come from outside it.'
