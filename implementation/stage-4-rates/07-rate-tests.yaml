- key: test_ved_gen_ic_2024_07_service
  Test Configuration:
    Rate to Test: VED-GEN-IC
    Start Date: 2024-07-01
    End Date: 2024-08-04
    Rate Classes: Select All
  Intervals:
    Source: Paste CSV
    Rows:
    - {LocalTimestamp: '2024-07-15 12:00', Value: 4428, IntervalMinutes: 60, UnitID: 6}
    Shape: the delivered (station service) kWh on the generator's first bill, ved_ridgeline_generator_2024_07 (July 1 to
      August 4, 2024, the Aug-24 period)
  Results:
    Expected Bill Total: not a bill figure, because the Generation Credit line prices this same stream; read only the
      lines named here
    Engine Lines:
    - 'Generator Customer Charge: $285.00 (bill 285.00)'
    - 'Station Service Energy: 4,428 kWh x $0.131 = $580.07 (bill 580.07)'
    - 'Utility Users Tax: 5% x ($285.00 + $580.07) = $43.25 (bill 51.31, which also taxes the reactive line)'
    Outside The Engine:
    - 'Reactive Power Charge: 38,351 kVArh x $0.0042 = $161.07 (858,948 measured less 820,597 allowed; no determinant)'
    - 'The tax on that line, $8.06: the difference between the bill''s $51.31 and the engine''s $43.25'
    Note: the next run, test_ved_gen_ic_2024_07_export, reads the credit and adds up the bill.
