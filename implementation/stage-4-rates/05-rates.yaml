      Commodity: true
  Rate Classes:
  - Rate Class Name: All   # created by Add Rate; the always-applied class (ClassType 0), not entered
  Determinants:
  - Charge Name: Transfer Energy
    Charge Type: 200 Charge Period
    Units: KilowattHours
    Aggregation Rule: Summing
    Schedule: Annual All Hrs
    Significance: All Hour
    Commodity Mapping:
      Commodity (Charge):
        Category: Elec Energy (Non-TOU)
        Commodity: Non-TOU kWh
      Commodity (Usage):
