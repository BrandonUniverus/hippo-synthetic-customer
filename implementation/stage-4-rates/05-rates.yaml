# ---- Ridgeline Wind rates ----
- key: ved_gen_ic
  installed:
    providerId: 1
    rateId: null
  provider: valley_electric_district
  Rate:
    Rate Name: VED-GEN-IC
    Currency: US Dollar
    Measure Type: Electricity
    Rate Categories:
      Transmission: false
      Distribution: true
      Commodity: true
  Rate Classes:
  - Rate Class Name: All
  Determinants:
  - Charge Name: Generator Customer Charge
    Charge Type: 400 Fixed By Period
    Units: US Dollar
    Schedule: Annual All Hrs
    Significance: All Hour
    Effective Dates:
    - Effective Date: 2024-07-01
      Value: 285.0
  - Charge Name: Station Service Energy
    Charge Type: 200 Charge Period
    Units: KilowattHours
    Aggregation Rule: Summing
    Schedule: Annual All Hrs
    Significance: All Hour
    Effective Dates:
    - Effective Date: 2024-07-01
      Value: 0.131
    notes:
    - Delivered kWh in the tariff (station service drawn while the turbines are idle); see the rate's note on channels.
  - Charge Name: Generation Credit
    Charge Type: 200 Charge Period
    Units: KilowattHours
    Aggregation Rule: Summing
    Schedule: Annual All Hrs
    Significance: All Hour
    Effective Dates:
    - Effective Date: 2024-07-01
      Value: -0.0612
    notes:
    - '# synthetic stand-in: an ordinary usage determinant priced negative, the construct HOS-PPA-2024''s Net Metering
      Credit uses. The tariff prices it on received (export) kWh only; the engine cannot restrict it to that channel
      (see the rate''s note on channels).'
  - Charge Name: Utility Users Tax
    Charge Type: 800 Taxes
    Units: US Dollar
    Schedule: Annual All Hrs
    Significance: All Hour
    Apply Charges:
    - Generator Customer Charge
    - Station Service Energy
    Effective Dates:
    - Effective Date: 2024-07-01
      Value: 0.05
  notes:
  - 'Generator interconnection for the Ridgeline Substation account (SYN-VED-A-0010014), effective 2024-07-01 to
    2025-12-31 (no end date is entered, like every rate here). The components are the provider file''s: a $285.00
    monthly customer charge, station service energy at $0.131 on delivered kWh, reactive power at $0.0042 per kVArh
    beyond power factor 0.95, and a -$0.0612 generation credit on received (export) kWh. Utility Users Tax is the 5% the
    itemized bills apply.'
  - 'Gap, channels (finding 62): a usage determinant takes every point under the meter whose unit class is the measure
    type''s usage class (kWh, class 3) and Summing adds them (UtilityRates_GetPoints, UtilityRates_LoadDataValues).
    Exported kWh and Station Service kWh are both class 3, so Station Service Energy and Generation Credit each price
    the sum of the two, not their own channel. A point can only be excluded from every rate in a bill scenario (Tenant
    Rebill, Point Assignment), never from one determinant. Both determinants stay as the tariff states them. A
    data-dependent workaround (untested) is Minimum on Station Service Energy and Maximum on Generation Credit, which
    would make the engine pick the smaller and the larger channel and so holds only while a period''s export exceeds
    its station service.'
  - 'Gap, reactive power (finding 63): the tariff''s Reactive Power Charge (per kVArh beyond the kVArh allowed at power
    factor 0.95, allowed = export kWh x 0.3286841) has no determinant. kVArh is unit class 21, outside the classes a
    charge may use (the UtilityChargeUnits view allows 3, 4, 7 and 8); the engine reads only the Electricity usage and
    demand classes, 3 and 4; and it has no power factor or allowance math. The commodity catalog does hold Elec rkVAh
    (kVArh) and Elec Power Factor, so a bill can carry those quantities, but no determinant can price them. The
    itemized bills'' reactive line ($161.07 on the first bill, $0.00 on the winter bill) comes from the Valley Electric
    bill itself.'
  - 'Utility Users Tax applies to the customer charge and station service only. The bills also tax the reactive line and
    never the credit, so on the first bill the engine''s tax is $43.25 against the bill''s $51.31, the $8.06 being tax on
    the $161.07 reactive line; on the winter bill, where reactive is zero, the two agree.'
  - 'Gap, credit transfer (finding 64): under VED-BCT the whole Generation Credit leaves this account
    (bct_credit_transferred, +$152,792.65 on the first bill) and lands on the Central Plant''s bill. A Bill Adj of -1.0
    on Generation Credit would cancel it here, since the engine can apply a percentage to its own rate''s charges, but
    that line belongs to VED-BCT, which cannot run beside this rate (see VED-BCT).'
- key: ved_bct
  installed:
    providerId: 1
    rateId: null
  provider: valley_electric_district
  Rate:
    Rate Name: VED-BCT
    Currency: US Dollar
    Measure Type: Electricity
    Rate Categories:
      Transmission: false
      Distribution: true
      Commodity: true
  Rate Classes:
  - Rate Class Name: All
  Determinants:
  - Charge Name: BCT Administrative Fee
    Charge Type: 400 Fixed By Period
    Units: US Dollar
    Schedule: Annual All Hrs
    Significance: All Hour
    Effective Dates:
    - Effective Date: 2024-07-01
      Value: 12.5
  notes:
  - 'Rider on the generator account (SYN-VED-A-0010014) and the Central Plant (SYN-VED-A-0010013), effective 2024-07-01
    to 2025-12-31: the generator''s whole Generation Credit moves to the Central Plant''s bill one cycle later (the first
    bill''s credit is on the Sep-24 period bill), and a $12.50 administrative fee posts per benefiting account per month.'
  - 'Only the fee is a charge the engine can compute, and it belongs to the benefiting account: assigned to the generator
    account''s meter it would post a fee that account''s bills do not carry.'
  - 'Gap, credit transfer (finding 64): the engine prices one meter at a time from that meter''s own points
    (UtilityRate_Exec) and writes the result to that meter''s own account (UtilityGenBill_Create), and a Bill Adj can
    apply only to charges priced in the same run (UtilityRates_Run_700). Nothing reads one account''s amount into
    another account''s bill, so bct_credit_transferred (+$152,792.65 on the first generator bill) and
    bct_credit_received (-$152,792.65 on the Central Plant''s Sep-24 period bill) are not determinants here. The Central
    Plant''s credit arrives as a line on its imported Valley Electric bill. Bill Allocation, the product''s one
    cross-account feature, splits every line of a source meter''s bill across destination accounts by percent; it is
    configured rather than rate-driven and has no one-cycle lag.'
  - 'Gap, one rate at a time (finding 65): a meter carries one rate per bill scenario, so this rider cannot be assigned
    beside VED-GEN-IC or the Central Plant''s base rate as the provider file lists it (06-rate-assignments.yaml). The rate
    exists for its name, dates and fee; the product-shaped alternative is to put the fee, and the credit lines for a
    specific account, into that account''s own base rate.'
