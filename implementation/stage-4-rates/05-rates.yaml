      Value: 0.058
  - Charge Name: Research Credit
    Charge Type: 400 Fixed By Period
    Units: US Dollar
    Schedule: Annual All Hrs
    Significance: All Hour
    Commodity Mapping:
      Commodity (Charge):
        Category: Elec Misc Chgs/Credits
        Commodity: Elec Misc Chgs/Credits
    Effective Dates:
    - Effective Date: 2024-07-01
      Value: -1250.0
    notes:
    - A negative fixed amount; the tariff's basis is the Wind Energy Research Lab's use of the site.
  notes:
  - 'Internal transfer of the Ridgeline turbines'' output to the plant: $0.058 per kWh of the farm''s generated energy (the
    sum of the ten turbine pad meters), less a $1,250.00 monthly credit for the Wind Energy Research Lab''s use of the
    site, effective 2024-07-01 to 2025-12-31 (no end date is entered). # assumed: Commodity only for the rate
    categories, like the plant''s other internal rates; the provider file states none.'
  - 'Assigned to one logical billing meter, not the ten turbines: EEM prices the points under one meter and writes one
    bill per meter and month (UtilityRate_Exec, UtilityGenBill_Create; UtilityMeterRatesBillGen holds one row per meter;
    finding 66), so the rate goes on the Ridgeline Farm Transfer Meter (SYN-RWL-M-0110000), whose one point is the
    aggregate Ridgeline Farm Generated kWh 10m, the ten turbines'' kWh (Stage 2). Priced there, Transfer Energy is one
    line on the farm total and Research Credit posts once. On the ten pad meters the statement would be ten bills with
    ten credits, and the ten Transfer Energy lines, each rounded to the cent, would add to $130,580.28 against the
    hand-made $130,580.27 for the farm. Test Rates prices the farm total as one stream, which is how 07-rate-tests.yaml
    reproduces the statement to the cent; it rounds every line to the cent, while Bill Generation carries four decimals,
    so confirm the total on the first generated statement.'
  - 'Rate class: Add Rate creates the rate''s class All itself, and it is the always-applied type (UtilityRate_Save.sql:89-90
    inserts it with ClassType 0; the desktop saves with FromImport 0; every rate in the demo database has one).
    UtilityRate_Exec takes an All-type class into every meter''s determinant list (UtilityRate_Exec.sql:303-307), so both
    determinants go under All and the rate needs no Rate Option. Do not add a class: an added class is Unique and prices a
    meter only as its Rate Option''s default (finding 69), and the option editor never offers All. Test Rates names its
    classes itself, so it would pass either way; the generated bill is what proves this.'
  - 'Commodity Mapping: a determinant becomes a bill line only through its mapping (UtilityBillLineItems_Get joins each
    quantity and amount to dbo.UtilityCommodityMap and dbo.Commodity). One with no mapping adds its amount to the bill
    total and writes no line, so the lines stop adding up to the total. Transfer Energy maps quantity and charge to one
    commodity, Non-TOU kWh, so its one line carries the kWh and the amount; Research Credit, a fixed charge, maps its
    charge to Elec Misc Chgs/Credits, a money line. Both commodities and their categories are in the installed catalog
    (dbo.Commodity and dbo.CommodityCategory, both system entries).'
