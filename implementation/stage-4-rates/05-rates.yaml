# Stage 4, step 5: Rates (Database Administrator > RateModeler > Rate Edit).
# The tree is Utility Provider > Rate > Rate Class > Determinant > Effective Date. Toggle "Show all providers"
# first: the tree defaults to providers that already have a rate, and none of Northlake's six do yet.
# This file holds the six real providers' sixteen tariffs. The Rate Lab provider's rates are in 08-rate-lab.yaml.
stage: 4
step: 5
title: Rates
app: Database Administrator
screen: RateModeler > Rate Edit
source:
- data/providers/valley-electric-district.yaml
- data/providers/sierra-gas-utility.yaml
- data/providers/river-city-utilities.yaml
- data/providers/northlake-thermal-plant.yaml
- data/providers/helios-onsite-solar.yaml
- data/providers/ridgeline-wind.yaml
- services/sources/billing.py (how the providers' bills are worked out: percentage lines, sizes, counts, seasons)
- services/sources/tariffs.py (the 2026 step and the Helios escalator)
- data/scenarios/demo-university-v1.yaml (meter sizes, fixture and ERU counts)
- data/bills/northlake-itemized-bills-v1.yaml (the Ridgeline-era bills the last three rates are tested against)
notes:
- 'Reworked 2026-11-09. Each real tariff is entered the way its own tariff and bills read, so a generated bill can be
  set against the provider''s bill. Before, several were simplified (two time-of-use periods, one meter size, one flat
  amount for a per-fixture price) and nine feature rates sat under the real providers; those moved to the Rate Lab.'
- 'Order inside the editor: pick the provider, Add Rate (Rate Name only at first save), then fill Currency and Measure
  Type before adding any charge; both lock once the rate has one. Add Rate creates the rate''s class All itself, the
  always-applied class, so a rate whose classes are [All] needs no class entered. Add a class only where a record
  lists more, for its Rate Options; every added class prices a meter only as its option''s default or when the meter
  is bound to it. Add each charge under its class, then one Effective Date per price, and for a tiered charge its
  Block rows on that date.'
- 'What the real rates exercise between them: three time-of-use periods with holidays (Valley Electric); Bill Adj and
  Taxes with member charges (Valley Electric, Sierra Gas); tiers (River City water); Rate Options with a default class
  and meters bound to another (River City meter and line sizes); User Defined per-meter prices (lighting fixtures,
  stormwater ERUs, the plant''s fixed share); negative prices (Helios, the generator credit); two or three price
  dates on every priced charge; a commodity mapping on every charge, with Exclude and two added commodities.'
- 'Price dates: 2024-01-01 as the tariff states; 2025-01-01 where the tariff steps (VED-TOU-GS, Helios); 2026-01-01
  at 3% over the last price for Valley Electric, Sierra Gas, River City and the Thermal Plant, as the source tariffs
  for 2026 carry it. Ridgeline does not escalate. Percentage lines do not change.'
- 'Percentage charges (700 Bill Adj, 800 Taxes) multiply the total of the charges they apply to by the value as typed,
  so 5% is 0.05 and 1.5% is 0.015. Their Units box offers only the rate''s currency.'
- 'Commodity Mapping: a charge becomes a bill line only through its mapping; one with no mapping adds to the bill
  total and writes no line. Every charge here has one. A fixed, adjustment or tax charge maps its amount to the
  measure type''s Misc Chgs/Credits commodity; a usage charge maps quantity and amount to its usage commodity. Where
  two charges price the same quantity, the second is marked Exclude so the quantity is reported once.'
- 'Rate Categories (Transmission, Distribution, Commodity) are not stated in the source documents. # assumed:
  Distribution and Commodity on; Transmission on for VED-TOU-PRI only; Distribution off for the Thermal Plant,
  Helios and Ridgeline. Nothing in the engine reads them.'
- 'The engine has no per-unit count (fixtures, ERUs) in Electricity or Potable Water units, so those charges are
  User Defined and priced per meter.'
- 'The last three records (VED-GEN-IC, VED-BCT, RWL-XFER-2024) were added 2026-10-01 for Ridgeline Wind and are
  kept as written then, with what the engine cannot do recorded on each: one channel of a bidirectional meter,
  reactive energy beyond a power factor, a credit moved between accounts, and one bill per meter.'
